<!--
  HE Manufacturing — Employee Leave Portal (v2, 2026-09-29)
  ---------------------------------------------------------
  Opened from the QR on HR → Leave. Employee signs in with Employee No. + the password HR set.
  Nothing talks to the tables directly any more: every call goes through a security-definer
  function that re-checks the employee number + password (bcrypt) first —
    portal_data        → my details, leave types + rules, my applications, messages from HR
    portal_apply       → submit; ALL leave rules are enforced there, server side
    portal_attach_docs → add an MC / hospital letter to a pending application
    portal_mark_read   → mark HR messages as read
  Documents go to the private Storage bucket 'hem-leave-docs' (upload-only for this page).
  The rules shown on this page are read from hem_leave_types, the same row the server
  enforces, so what the employee is told and what is checked can't drift apart.
-->

/* the same rules the server enforces, run as the employee types so they see the problem first */
function check(){
  const ty=typeOf(FORM.type), today=todayKL(), s=FORM.start, half=halfAllowed(ty)&&FORM.half, e=half? FORM.start : FORM.end;
  if(!ty) return {code:'bad_type'};
  if(!s||!e||e<s) return {code:'bad_dates'};
  if(s.slice(0,4)!==e.slice(0,4)) return {code:'span_year'};
  let days=workDays(s,e);
  if((new Date(e)-new Date(s))/864e5>90) return {code:'too_long'};
  if(days<1) return {code:'no_workdays'};
  if(half) days=0.5;
  if(ty.min_notice_days>0 && s<addDays(today,ty.min_notice_days)) return {code:'notice', need:ty.min_notice_days, earliest:addDays(today,ty.min_notice_days), days};
  if(s<today && addDays(e,ty.late_days)<today) return {code:'too_late', late_days:ty.late_days, days};
  if(ty.code==='medical' && s>today) return {code:'mc_future', days};
  const mine=(DATA.apps||[]).filter(a=>(a.status==='pending'||a.status==='approved') && !String(a.id).startsWith('OB-'));
  if(mine.some(a=>a.start_date<=e && a.end_date>=s && !(half && a.details && a.details.half && a.details.half!==half))) return {code:'overlap', days};
  if(ty.paid && Number(ty.default_days)>0){
    const used=(DATA.apps||[]).filter(a=>(a.status==='pending'||a.status==='approved') && a.type===ty.code && Number(a.year)===Number(s.slice(0,4))).reduce((x,a)=>x+Number(a.days||0),0);
    if(used+days>Number(ty.default_days)) return {code:'balance', left:Math.max(0,Number(ty.default_days)-used), days};
  }
  return {code:'', days};
}
function errText(r){
  const ty=typeOf(FORM.type), nm=typeName(ty);
  switch(r.code){
    case 'notice': return t('e_notice',{type:nm, n:r.need, date:fmtDate(r.earliest)});
    case 'too_late': return r.late_days>0? t('e_too_late',{type:nm, n:r.late_days}) : t('e_too_late0',{type:nm});
    case 'balance': return t('e_balance',{n:r.left, type:nm});
    case 'doc_missing': return t('e_doc_missing',{doc:docLabel(ty)||'document'});
    default: return TX['e_'+r.code]? t('e_'+r.code) : t('e_generic',{c:r.code||'?'});
  }
}
function liveCheck(){
  const box=$('liveCheck'); if(!box) return;
  const ty=typeOf(FORM.type), half=halfAllowed(ty)&&FORM.half;
  const r = (FORM.type && FORM.start && (FORM.end||half))? check() : null;
  box.innerHTML = !r? '' : r.code? '<div class="msg warn">'+esc(errText(r))+'</div>'
    : '<div class="msg info">'+esc(half? t('halfDays',{h:half}) : t('workDays',{n:r.days}))+(ty&&!ty.paid?' — '+esc(t('unpaid')):'')+'</div>';
  const rc=$('reasonCount'); if(rc){ const n=FORM.reason.trim().length; rc.textContent=t('chars',{n}); rc.style.color=n>=10?'var(--ok)':''; }
}
function supWaLink(phone, token, app){
  const url=location.origin+location.pathname.replace(/[^/]*$/,'')+'leave-approve.html?t='+token;
  const emp=DATA.employee||{}, ty=typeOf(app.type);
  const d=fmtDate(app.start_date)+(app.end_date&&app.end_date!==app.start_date?' – '+fmtDate(app.end_date):'')+(app.half?' ('+app.half+')':'');
  const text='HE Manufacturing — Leave approval needed / Kelulusan cuti diperlukan\n'+emp.name+' ('+emp.emp_no+')'+(emp.position?', '+emp.position:'')
    +'\n'+(ty?ty.name:app.type)+': '+d+' · '+app.days+' day(s)\nReason: '+app.reason+'\n\nPlease approve or not approve here / Sila luluskan di sini:\n'+url;
  const n=String(phone||'').replace(/\D/g,'');
  return n? 'https://wa.me/'+n+'?text='+encodeURIComponent(text) : '';
}
let SUP_SEND=null;   // {id, link, name} shown after submit / on request
function supSendHtml(){
  if(!SUP_SEND) return '';
  return '<div class="card supcard"><h3>👤 '+esc(t('sendSupTitle',{n:SUP_SEND.name||''}))+'</h3>'
    +(SUP_SEND.link? '<div class="muted" style="margin-bottom:10px">'+esc(t('sendSupLead'))+'</div>'
      +'<a class="btn-wa" id="supWaBtn" href="'+esc(SUP_SEND.link)+'" target="_blank" rel="noopener">'+esc(t('sendSupBtn'))+'</a>'
      : '<div class="msg warn">'+esc(t('supNoPhone'))+'</div>')+'</div>';
}
function renderHistory(){
  const apps=DATA.apps||[];
  $('supSend').innerHTML=supSendHtml();
  $('historyList').innerHTML = apps.length? apps.map(a=>{
    if(String(a.id).startsWith('OB-')) return Number(a.days)? '<div class="hist"><b>'+esc((typeOf(a.type)||{}).name||a.type)+'</b>'
      +'<div class="muted">'+esc(t('broughtFwd'))+': '+esc(a.days)+' '+esc(t('daysW'))+'</div></div>' : '';
    const ty=typeOf(a.type), needLater = a.status==='pending' && ty && ty.doc_rule==='required_if_started' && !Number(a.docs);
    const half=a.details&&a.details.half;
    let stage='';
    if(a.status==='pending'){
      if(a.stage==='superior') stage='<div class="stage">⏳ '+esc(t('stageSup',{n:a.sup_name||''}))
        +' <button type="button" class="linkbtn" data-resend="'+esc(a.id)+'">'+esc(t('resendSup'))+'</button></div>';
      else stage='<div class="stage">🗂 '+esc(t('stageHr'))+(a.sup_decision? ' · '+esc(t(a.sup_decision==='approved'?'supOk':'supNo',{n:a.sup_name||''}))+(a.sup_comment?': “'+esc(a.sup_comment)+'”':'') : '')+'</div>';
    }
    return '<div class="hist"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+esc(ty?ty.name:a.type)+'</b>'
      +'<span>'+(a.paid===false?'<span class="tag unpaid">'+esc(t('unpaid'))+'</span> ':'')+'<span class="tag '+esc(a.status)+'">'+esc((TX.st[LANG]||TX.st.en)[a.status]||a.status)+'</span></span></div>'
      +'<div class="muted mono">'+esc(fmtDate(a.start_date))+(a.end_date!==a.start_date?' → '+esc(fmtDate(a.end_date)):'')+(half?' ('+esc(half)+')':'')+' · '+esc(a.days)+' '+esc(t('daysW'))
      +(Number(a.docs)?' · '+esc(t('docs',{n:a.docs})):'')+'</div>'
      +(a.reason?'<div class="muted">'+esc(a.reason)+'</div>':'')+stage
      +(a.status==='rejected'&&a.reject_reason?'<div style="color:var(--bad);font-size:13px"><b>'+esc(t('rejReason'))+':</b> '+esc(a.reject_reason)+'</div>':'')
      +(needLater?'<div class="msg warn" style="margin:6px 0 0">'+esc(t('needDocLater'))
        +'<div class="cvbtns" style="margin-bottom:0"><label><input type="file" data-later="'+esc(a.id)+'" accept="application/pdf,image/*">📄 '+esc(t('uploadNow'))+'</label></div></div>':'')
      +'</div>';
  }).join('') : '<div class="muted">'+esc(t('none'))+'</div>';
}
async function resendSup(id){
  try{ const {data,error}=await sb.rpc('portal_superior_link',{p_emp_no:CRED.emp_no,p_password:CRED.password,p_id:id});
    if(error) throw error; if(!data||!data.ok) return showMsg('topMsg','err',t('e_generic',{c:(data&&data.code)||'?'}));
    const app=(DATA.apps||[]).find(a=>a.id===id)||{};
    SUP_SEND={id, name:data.superior_name, link:supWaLink(data.superior_phone, data.token, {type:app.type,start_date:app.start_date,end_date:app.end_date,days:app.days,reason:app.reason,half:app.details&&app.details.half})};
    renderHistory(); $('supSend').scrollIntoView({behavior:'smooth'});
  }catch(e){ showMsg('topMsg','err',t('offline')); }
}

/* ------------------------------------------------------------------ form events */
document.addEventListener('input', e=>{
  const id=e.target.id;
  if(id==='lvReason'){ FORM.reason=e.target.value; liveCheck(); }
  if(id==='lvContact'){ FORM.contact=e.target.value; }
  if(id==='lvRelief'){ FORM.relief=e.target.value; }
  if(id==='lvHandover'){ FORM.handover=e.target.value; }
  if(id==='lvSign'){ FORM.signature=e.target.value; }
  if(id==='vPhone'){ VPHONE=e.target.value; }
});
document.addEventListener('change', e=>{
  const id=e.target.id;
  if(id==='lvType'){ FORM.type=e.target.value; FORM.start=''; FORM.end=''; FORM.half=''; showMsg('applyMsg','',''); renderApply(); }
  if(e.target.name==='lvHalf'){ FORM.half=e.target.value; if(FORM.half) FORM.end=FORM.start; renderApply(); }
  if(id==='lvStart'){ FORM.start=e.target.value; if(FORM.half || !FORM.end || FORM.end<FORM.start) FORM.end=FORM.start; renderApply(); }
  if(id==='lvEnd'){ FORM.end=e.target.value; liveCheck(); }
  if(id==='lvDeclare'){ FORM.declared=e.target.checked; }
  if(id==='docCam' || id==='docPick'){ addDocs(e.target.files).then(()=>renderApply()); }
  if(e.target.dataset && e.target.dataset.later){ attachLater(e.target.dataset.later, e.target.files); }
});
document.addEventListener('click', e=>{
  const d=e.target.closest('[data-docdel]'); if(d){ DOCS.splice(Number(d.dataset.docdel),1); renderApply(); return; }
  const rs=e.target.closest('[data-resend]'); if(rs){ resendSup(rs.dataset.resend); return; }
  if(e.target.id==='submitBtn') submitLeave();
  if(e.target.id==='vSend') requestOtp();
  if(e.target.id==='vCheck') checkOtp();
  if(e.target.id==='vChange'){ DATA.otp=null; renderApply(); }
  if(e.target.id==='supWaBtn'){ setTimeout(()=>{ SUP_SEND=null; renderHistory(); showMsg('topMsg','ok',t('supSentOk')); }, 400); }
});

/* photos are resized on the phone (long edge 2000px JPEG) — an MC photo stays readable at a
   fraction of the size, which matters on mobile data */
function shrinkImage(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ try{
        const k=Math.min(1, 2000/Math.max(img.naturalWidth,img.naturalHeight)), w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
        const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
        const tc=document.createElement('canvas'), tk=100/Math.max(w,h); tc.width=Math.round(w*tk); tc.height=Math.round(h*tk); tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height);
        const thumb=tc.toDataURL('image/jpeg',0.7);
        c.toBlob(b=>{ URL.revokeObjectURL(url); res(b?{blob:b,thumb}:null); }, 'image/jpeg', 0.82);
      }catch(x){ URL.revokeObjectURL(url); res(null); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}
async function prepFiles(list, room){
  const out=[];
  for(const f of Array.from(list||[])){
    if(out.length>=room){ showMsg('applyMsg','err',t('e_max_files',{n:MAX_DOCS})); break; }
    const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name), isImg=/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name);
    if(!isPdf&&!isImg){ showMsg('applyMsg','err',t('e_file_type',{f:f.name})); continue; }
    if(isImg){ const r=await shrinkImage(f); if(r){ out.push({blob:r.blob, name:f.name.replace(/\.[^.]+$/,'')+'.jpg', type:'image/jpeg', size:r.blob.size, thumb:r.thumb}); continue; } }
    if(f.size>MAX_BYTES){ showMsg('applyMsg','err',t('e_file_big',{f:f.name})); continue; }
    out.push({blob:f, name:f.name, type:isPdf?'application/pdf':(f.type||'image/heic'), size:f.size, thumb:null});
  }
  return out;
}
async function addDocs(list){ const got=await prepFiles(list, MAX_DOCS-DOCS.length); DOCS=DOCS.concat(got); }
const extOf = f => f.type==='application/pdf'?'pdf': f.type==='image/png'?'png': f.type==='image/webp'?'webp': /hei[cf]/.test(f.type)?'heic':'jpg';
async function uploadDocs(id, files, startAt, onProgress){
  const paths=[];
  for(let i=0;i<files.length;i++){
    const f=files[i], path=id+'/doc-'+(startAt+i+1)+'.'+extOf(f);
    if(onProgress) onProgress(i+1, files.length);
    const { error } = await sb.storage.from(DOC_BUCKET).upload(path, f.blob, {contentType:f.type, upsert:false});
    if(error) throw Object.assign(new Error(error.message||'upload'), {upload:true});
    paths.push(path);
  }
  return paths;
}

/* ------------------------------------------------------------------ submit */
async function submitLeave(){
  showMsg('applyMsg','','');
  const r=check(), ty=typeOf(FORM.type);
  const nm=v=>String(v||'').toUpperCase().replace(/[^A-Z]/g,'');
  let err = r.code? r : (FORM.reason.trim().length<10? {code:'reason_short'} : (docRequired(ty,FORM.start) && !DOCS.length? {code:'doc_missing'}
    : !FORM.declared? {code:'no_declaration'} : nm(FORM.signature)!==nm((DATA.employee||{}).name)? {code:'sign_mismatch'} : null));
  if(err){ showMsg('applyMsg','err',errText(err)); $('applyCard').scrollIntoView({behavior:'smooth'}); return; }
  const btn=$('submitBtn'); btn.disabled=true; btn.textContent=t('sending');
  try{
    let res=null;
    for(let attempt=0; attempt<2; attempt++){
      const id='LV-P-'+Date.now()+String(Math.floor(Math.random()*90)+10);
      const paths = DOCS.length? await uploadDocs(id, DOCS, 0, (n,tot)=>{ btn.textContent=t('uploading',{n,t:tot}); }) : [];
      btn.textContent=t('sending');
      const { data, error } = await sb.rpc('portal_apply', {p_emp_no:CRED.emp_no, p_password:CRED.password,
        p:{id, type:FORM.type, start_date:FORM.start, end_date:(halfAllowed(ty)&&FORM.half)? FORM.start : FORM.end, half:(halfAllowed(ty)&&FORM.half)||'',
           reason:FORM.reason.trim(), contact:FORM.contact.trim(), relief:FORM.relief.trim(), handover:FORM.handover.trim(),
           declared:FORM.declared?'true':'', signature:FORM.signature.trim(), doc_paths:paths, lang:LANG}});
      if(error) throw error;
      res=data; if(!(res && res.code==='dup_id')) break;
    }
    if(!res || !res.ok){
      if(res && res.code==='auth') return signOut(t('e_auth'));
      showMsg('applyMsg','err',errText(res||{code:'?'})); return;
    }
    const sent={type:FORM.type, start_date:FORM.start, end_date:(halfAllowed(ty)&&FORM.half)?FORM.start:FORM.end, days:res.days, reason:FORM.reason.trim(), half:(halfAllowed(ty)&&FORM.half)||''};
    DOCS=[]; FORM=blankForm();
    SUP_SEND = res.superior? {id:res.id, name:res.superior.name, link:supWaLink(res.superior.phone, res.token, sent)} : null;
    await refresh(true);
    showMsg('topMsg','ok',t(res.superior?'submittedSup':'submitted',{d:res.days, u:res.paid===false?t('unpaidSuffix'):''}));
    (SUP_SEND? $('supSend') : document.body).scrollIntoView({behavior:'smooth'});
  }catch(e){
    console.error(e);
    showMsg('applyMsg','err', e && e.upload? t('e_upload') : t('offline'));
  }finally{
    const b=$('submitBtn'); if(b){ b.disabled=false; b.textContent=t('submit'); }
  }
}
async function attachLater(id, files){
  try{
    const got=await prepFiles(files, MAX_DOCS); if(!got.length) return;
    const app=(DATA.apps||[]).find(a=>a.id===id); const start=Number(app&&app.docs)||0;
    const paths=await uploadDocs(id, got, start + Math.floor(Math.random()*5)*MAX_DOCS);
    const { data, error } = await sb.rpc('portal_attach_docs', {p_emp_no:CRED.emp_no, p_password:CRED.password, p_id:id, p_paths:paths});
    if(error || !data || !data.ok) throw error||new Error((data&&data.code)||'attach');
    await refresh(true); showMsg('topMsg','ok',t('docAdded')); window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){ console.error(e); showMsg('topMsg','err',t('e_upload')); window.scrollTo({top:0,behavior:'smooth'}); }
}
