<!--
  HE Manufacturing — New staff registration (first day / before first day)
  ---------------------------------------------------------------------
  Opened from one of the two QR codes on HR → New joiners in the ERP:
      join.html?type=permanent      join.html?type=parttime
  The QR decides the staff type; HR can still correct it before issuing the Employee ID.
  No login. Each registration is INSERTED into Supabase table hem_new_joiners and the joiner's
  IC / photo files go to the private bucket hem-staff-docs (see joiner-setup.sql). The public
  key can only insert and upload — it can never read anything back.
  The ERP pulls registrations in, HR files the offer letter and appointment letter, issues the
  next Employee ID in the right series and adds the person to the employee list.
-->

const isMy=()=>D.nationality==='Malaysian';
const typeLabel=()=>D.staffType==='Part-time'? t('parttime') : t('permanent');

/* ------------------------------------------------------------------ field helpers */
function fld(name, label, o){ o=o||{};
  const v=D[name]!=null?D[name]:'';
  const lab='<label class="l" for="f_'+name+'">'+esc(label)+(o.req?' <span class="req">*</span>':'')+'</label>';
  let ctl;
  if(o.type==='textarea') ctl='<textarea id="f_'+name+'" data-n="'+name+'" rows="'+(o.rows||2)+'">'+esc(v)+'</textarea>';
  else if(o.type==='select'){
    const labels=o.labels||o.values;
    ctl='<select id="f_'+name+'" data-n="'+name+'"><option value="">'+esc(t('choose'))+'</option>'
      +o.values.map((val,i)=>'<option value="'+esc(val)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(labels[i])+'</option>').join('')+'</select>';
  } else {
    ctl='<input id="f_'+name+'" data-n="'+name+'" type="'+(o.type||'text')+'" value="'+esc(v)+'"'
      +(o.inputmode?' inputmode="'+o.inputmode+'"':'')+(o.min!=null?' min="'+o.min+'"':'')+(o.max!=null?' max="'+o.max+'"':'')
      +(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.auto?' autocomplete="'+o.auto+'"':'')+'>';
  }
  return lab+ctl+(o.hint?'<div class="hint">'+esc(o.hint)+'</div>':'');
}
function radios(name, label, values, labels, o){ o=o||{};
  return '<label class="l">'+esc(label)+(o.req?' <span class="req">*</span>':'')+'</label><div class="choices" data-group="'+name+'">'
    +values.map((val,i)=>'<label><input type="radio" name="r_'+name+'" data-n="'+name+'" value="'+esc(val)+'"'+(D[name]===val?' checked':'')+'> '+esc(labels[i])+'</label>').join('')+'</div>';
}
const row2=(a,b)=>'<div class="row2"><div>'+a+'</div><div>'+b+'</div></div>';
const todayIso=()=>new Date().toISOString().slice(0,10);

/* ------------------------------------------------------------------ steps */
function stepHtml(){
  if(step===0){
    return '<div class="card"><h2>'+esc(t('pickTitle'))+'</h2><p class="lead">'+esc(t('pickLead'))+'</p><div class="pick">'
      +'<button type="button" data-pick="Permanent"><b>'+esc(t('permanent'))+'</b><span>'+esc(t('pickPerm'))+'</span></button>'
      +'<button type="button" data-pick="Part-time"><b>'+esc(t('parttime'))+'</b><span>'+esc(t('pickPt'))+'</span></button>'
      +'</div></div>';
  }
  const badge='<div class="typebadge">'+esc(typeLabel())+'</div>';
  if(step===1){
    return '<div class="card">'+badge+'<h2>'+esc(t('youTitle'))+'</h2><p class="lead">'+esc(t('youLead'))+'</p>'
      + fld('fullName', t('fullName'), {req:true, auto:'name'})
      + fld('prefName', t('prefName'))
      + radios('nationality', t('nationality'), ['Malaysian','Other'], [t('malaysian'), t('otherNat')], {req:true})
      + (D.nationality==='Malaysian'? fld('icNo', t('icNo'), {req:true, inputmode:'numeric', ph:'900101-10-1234'}) : '')
      + (D.nationality==='Other'
          ? fld('nationalityOther', t('nationalityOther'), {req:true})
            + row2(fld('passportNo', t('passportNo'), {req:true}), fld('passportExpiry', t('passportExpiry'), {req:true, type:'date'}))
            + row2(fld('permitNo', t('permitNo')), fld('permitExpiry', t('permitExpiry'), {type:'date'}))
          : '')
      + row2(fld('dob', t('dob'), {req:true, type:'date', max:todayIso()}),
             radios('gender', t('gender'), ['Male','Female'], [t('male'), t('female')], {req:true}))
      + row2(fld('marital', t('marital'), {type:'select', values:TX.ms_.en, labels:t('ms_')}),
             fld('children', t('children'), {type:'number', inputmode:'numeric', min:0}))
      +'</div>';
  }
  if(step===2){
    return '<div class="card">'+badge+'<h2>'+esc(t('contactTitle'))+'</h2>'
      + row2(fld('phone', t('phone'), {req:true, type:'tel', inputmode:'tel', auto:'tel', ph:'01X-XXX XXXX'}),
             fld('whatsapp', t('whatsapp'), {type:'tel', inputmode:'tel'}))
      + '<div class="hint" style="margin-top:-6px">'+esc(t('waHint'))+'</div>'
      + fld('email', t('email'), {type:'email', auto:'email'})
      + fld('address', t('address'), {req:true, type:'textarea', rows:3})
      + fld('postcode', t('postcode'), {req:true, inputmode:'numeric'})
      + '<fieldset><legend>'+esc(t('emTitle'))+'</legend>'
      + fld('emName', t('emName'), {req:true})
      + row2(fld('emRel', t('emRel'), {req:true, ph:t('emRelPh')}), fld('emPhone', t('emPhone'), {req:true, type:'tel', inputmode:'tel'}))
      + '</fieldset></div>';
  }
  if(step===3){
    return '<div class="card">'+badge+'<h2>'+esc(t('jobTitle'))+'</h2><p class="lead">'+esc(t('jobLead'))+'</p>'
      + fld('position', t('position'), {req:true})
      + row2(fld('department', t('department'), {type:'select', values:DEPTS}), fld('startDate', t('startDate'), {req:true, type:'date'}))
      + fld('refBy', t('refBy'))
      + '<fieldset><legend>'+esc(t('statTitle'))+'</legend><div class="hint" style="margin:0 0 10px">'+esc(t('statLead'))+'</div>'
      + row2(fld('epfNo', t('epfNo'), {inputmode:'numeric'}), fld('socsoNo', t('socsoNo')))
      + fld('taxNo', t('taxNo'))
      + '</fieldset>'
      + '<fieldset><legend>'+esc(t('bankTitle'))+'</legend>'
      + fld('bankName', t('bankName'), {req:true, type:'select', values:BANKS})
      + (D.bankName==='Other'? fld('bankOther', t('bankOther'), {req:true}) : '')
      + fld('bankAcct', t('bankAcct'), {req:true, inputmode:'numeric'})
      + fld('bankHolder', t('bankHolder'), {req:true, hint:t('bankHint')})
      + '</fieldset></div>';
  }
  if(step===4){
    return '<div class="card">'+badge+'<h2>'+esc(t('docTitle'))+'</h2><p class="lead">'+esc(t('docLead'))+'</p>'
      + ['ic','photo','other'].map(uplHtml).join('')
      + '<div class="hint" style="margin:0">'+esc(t('fileHint'))+'</div></div>'
      + '<div class="card" id="declWrap"><h2>'+esc(t('declTitle'))+'</h2><p class="lead">'+esc(t('declText'))+'</p>'
      + '<div class="choices"><label><input type="checkbox" data-n="declare"'+(D.declare?' checked':'')+'> '+esc(t('declare'))+'</label></div>'
      + fld('signature', t('signature'), {req:true})
      + '</div>';
  }
  return '';
}
function uplHtml(kind){
  const mine=FILES.map((f,i)=>({f,i})).filter(x=>x.f.kind===kind);
  return '<div class="cvbox" data-kind="'+kind+'"><div class="upl-sec">'+esc(t('kind_'+kind))+(kind==='ic'?' <span class="req">*</span>':'')+'</div>'
    +'<div class="cvbtns">'
    +'<label><input type="file" data-upl="'+kind+'" accept="image/*" capture="environment">📷 '+esc(t('takePhoto'))+'</label>'
    +'<label><input type="file" data-upl="'+kind+'" accept="application/pdf,image/*" multiple>📄 '+esc(t('chooseFile'))+'</label>'
    +'</div><div class="cvlist">'+mine.map(({f,i})=>'<div class="cvitem">'
      +(f.thumb?'<img class="th" src="'+f.thumb+'" alt="">':'<div class="th">'+(f.type==='application/pdf'?'PDF':'IMG')+'</div>')
      +'<div class="nm">'+esc(f.name)+'<div class="sz">'+fmtSize(f.size)+'</div></div>'
      +'<button type="button" data-del="'+i+'">'+esc(t('remove'))+'</button></div>').join('')+'</div></div>';
}

function render(){
  document.documentElement.lang = LANG==='ms'?'ms':'en';
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=t(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  const names=[t('s1'),t('s2'),t('s3'),t('s4')];
  $('stepBar').innerHTML= step===0? '' : names.map((n,i)=>'<span class="'+(i+1<step?'past':i+1===step?'on':'')+'"></span>').join('');
  $('stepName').textContent= step===0? '' : t('stepOf',{n:step, name:names[step-1]});
  $('stepHost').innerHTML=stepHtml();
  $('navBar').hidden = step===0;
  $('backBtn').hidden = step===1 && !!TYPE_FROM_LINK;
  $('nextBtn').textContent = step===STEPS? t('submit') : t('next');
}

/* ------------------------------------------------------------------ input capture */
document.addEventListener('input', e=>{
  const el=e.target; if(!el.dataset.n) return;
  D[el.dataset.n] = el.type==='checkbox'? el.checked : el.value;
  el.classList.remove('bad-field');
  const g=el.closest('.choices'); if(g) g.classList.remove('bad-group');
});
document.addEventListener('change', e=>{
  const n=e.target.dataset.n;
  if(['nationality','bankName'].includes(n)){ D[n]=e.target.value; keepScroll(render); }
  if(e.target.dataset.upl){ const kind=e.target.dataset.upl, list=e.target.files;
    addFiles(kind, list).then(()=>{ try{ e.target.value=''; }catch(x){} }); }
});
document.addEventListener('click', e=>{
  const p=e.target.closest('[data-pick]');
  if(p){ D.staffType=p.dataset.pick; step=1; render(); window.scrollTo(0,0); return; }
  const d=e.target.closest('[data-del]');
  if(d){ FILES.splice(Number(d.dataset.del),1); keepScroll(render); }
});
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }

/* ------------------------------------------------------------------ validation */
function need(names){ return names.filter(n=>{ const v=D[n]; return v==null || String(v).trim()===''; }); }
const digits=s=>String(s||'').replace(/\D/g,'');
function validate(){
  let bad=[];
  if(step===1){
    bad=need(['fullName','nationality','dob','gender']);
    if(D.nationality==='Malaysian'){ bad=bad.concat(need(['icNo']));
      if(D.icNo && digits(D.icNo).length!==12){ mark(['icNo']); return fail(t('badIc')); } }
    if(D.nationality==='Other') bad=bad.concat(need(['nationalityOther','passportNo','passportExpiry']));
  }
  if(step===2){
    bad=need(['phone','address','postcode','emName','emRel','emPhone']);
    ['phone','emPhone'].forEach(k=>{ if(D[k] && digits(D[k]).length<9) bad.push(k); });
    if(D.whatsapp && digits(D.whatsapp).length<9) bad.push('whatsapp');
    if(D.email && !/^\S+@\S+\.\S+$/.test(D.email)) bad.push('email');
  }
  if(step===3){
    bad=need(['position','startDate','bankName','bankAcct','bankHolder']);
    if(D.bankName==='Other') bad=bad.concat(need(['bankOther']));
    if(D.bankAcct && digits(D.bankAcct).length<6) bad.push('bankAcct');
  }
  if(step===4){
    if(!FILES.some(f=>f.kind==='ic')){ const b=document.querySelector('.cvbox[data-kind="ic"]'); if(b){ b.style.borderColor='var(--bad)'; b.scrollIntoView({behavior:'smooth',block:'center'}); } return fail(t('needIc')); }
    if(!D.declare){ const w=$('declWrap'); if(w) w.style.borderColor='var(--bad)'; return fail(t('mustDeclare')); }
    if(!D.signature || !D.signature.trim()) bad.push('signature');
    else if(norm(D.signature)!==norm(D.fullName)){ mark(['signature']); return fail(t('sigMismatch')); }
  }
  if(bad.length){ mark(bad); return fail(t('required')); }
  $('errBox').hidden=true; return true;
}
function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function mark(names){
  names.forEach(n=>{
    const el=document.querySelector('[data-n="'+n+'"]:not([type="radio"])'); if(el) el.classList.add('bad-field');
    const g=document.querySelector('.choices[data-group="'+n+'"]'); if(g) g.classList.add('bad-group');
  });
  const first=document.querySelector('.bad-field, .bad-group'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
}
function fail(msg){ $('errBox').textContent=msg; $('errBox').hidden=false; if(!document.querySelector('.bad-field,.bad-group')) window.scrollTo({top:0,behavior:'smooth'}); return false; }

/* ------------------------------------------------------------------ navigation */
$('nextBtn').addEventListener('click', async ()=>{
  if(!validate()) return;
  if(step<STEPS){ step++; render(); window.scrollTo(0,0); return; }
  await submit();
});
$('backBtn').addEventListener('click', ()=>{
  $('errBox').hidden=true;
  if(step>1){ step--; render(); window.scrollTo(0,0); }
  else if(!TYPE_FROM_LINK){ step=0; render(); }
});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click', ()=>{ LANG=b.dataset.lang; keepScroll(render); }));

/* ------------------------------------------------------------------ file upload
   Held in memory until Submit, then uploaded to the PRIVATE bucket hem-staff-docs under
   <reference>/<kind>-N.ext. The public key can only upload there — never list or open — so one
   joiner can never see another's IC. Photos are shrunk on the phone (long edge 2000px, JPEG). */
function fmtSize(b){ return b>=1048576? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }
function shrinkImage(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      try{
        const max=2000, k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
        const tc=document.createElement('canvas'), tk=120/Math.max(w,h); tc.width=Math.round(w*tk); tc.height=Math.round(h*tk);
        tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height);
        const thumb=tc.toDataURL('image/jpeg',0.7);
        c.toBlob(b=>{ URL.revokeObjectURL(url); res(b? {blob:b, thumb} : null); }, 'image/jpeg', 0.82);
      }catch(e){ URL.revokeObjectURL(url); res(null); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}
async function addFiles(kind, list){
  $('errBox').hidden=true;
  for(const f of Array.from(list||[])){
    if(FILES.length>=MAX_FILES){ fail(t('tooMany')); break; }
    const isPdf = f.type==='application/pdf' || /\.pdf$/i.test(f.name);
    const isImg = /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name);
    if(!isPdf && !isImg){ fail(t('badType',{f:f.name})); continue; }
    if(isImg){
      const r=await shrinkImage(f);
      if(r){ FILES.push({kind, blob:r.blob, name:f.name.replace(/\.[^.]+$/,'')+'.jpg', type:'image/jpeg', size:r.blob.size, thumb:r.thumb}); continue; }
    }
    if(f.size>MAX_BYTES){ fail(t('tooBig',{f:f.name})); continue; }
    const type = isPdf? 'application/pdf' : (f.type || (/\.heif$/i.test(f.name)?'image/heif':'image/heic'));
    FILES.push({kind, blob:f, name:f.name, type, size:f.size, thumb:null});
  }
  keepScroll(render);
}
function ext(f){ return f.type==='application/pdf'?'pdf': f.type==='image/png'?'png': f.type==='image/webp'?'webp': /heif/.test(f.type)?'heif': /heic/.test(f.type)?'heic':'jpg'; }
async function uploadFiles(id){
  const out=[], n={};
  for(let i=0;i<FILES.length;i++){
    const f=FILES[i]; n[f.kind]=(n[f.kind]||0)+1;
    const path=id+'/'+f.kind+'-'+n[f.kind]+'.'+ext(f);
    $('nextBtn').textContent=t('uploading',{n:i+1, t:FILES.length});
    const { error } = await sb.storage.from('hem-staff-docs').upload(path, f.blob, {contentType:f.type, upsert:false, cacheControl:'3600'});
    if(error) throw error;
    out.push({kind:f.kind, path, name:f.name, type:f.type, size:f.size});
  }
  return out;
}

/* ------------------------------------------------------------------ submit */
function newId(){
  const d=new Date(), y=String(d.getFullYear()).slice(2), m=String(d.getMonth()+1).padStart(2,'0');
  const r=(crypto.getRandomValues? crypto.getRandomValues(new Uint32Array(1))[0] : Math.floor(Math.random()*1e9))%9000+1000;
  return 'J'+y+m+'-'+r;
}
function buildPayload(){
  const data=Object.assign({}, D);
  delete data.declare; delete data.staffType;
  if(D.nationality==='Other') data.nationality = D.nationalityOther||'Other';
  if(D.bankName==='Other') data.bankName = D.bankOther||'Other';
  data.icNo = D.nationality==='Malaysian'? String(D.icNo||'').trim() : String(D.passportNo||'').trim();
  data.idType = D.nationality==='Malaysian'? 'MyKad' : 'Passport';
  if(data.children!=null && data.children!=='') data.children=Number(data.children);
  data.linkType = TYPE_FROM_LINK || 'chosen on form';
  data.formLang = LANG; data.declared = true; data.declaredAt = new Date().toISOString();
  return { id:newId(), staff_type:D.staffType, status:'new',
           full_name:String(D.fullName||'').trim().toUpperCase(), phone:String(D.phone||'').trim(), data };
}
async function submit(){
  const btn=$('nextBtn'); btn.disabled=true; btn.textContent=t('sending');
  const row=buildPayload();
  try{
    if(!sb) throw new Error('no client');
    let error=null;
    for(let attempt=0; attempt<3; attempt++){
      try{ row.data.files = FILES.length? await uploadFiles(row.id) : []; error=null; }
      catch(upErr){
        if(/exist|duplicate|409/i.test(String(upErr.message||upErr.statusCode||''))){ row.id=newId(); error=upErr; continue; }
        throw upErr;
      }
      btn.textContent=t('sending');
      ({ error } = await sb.from('hem_new_joiners').insert(row));
      if(error && /duplicate|unique/i.test(error.message||'')){ row.id=newId(); continue; }
      break;
    }
    if(error) throw error;
    done(row.id);
  }catch(err){
    console.error(err);
    btn.disabled=false; btn.textContent=t('submit');
    const offline = !sb || navigator.onLine===false || /fetch|network|load failed/i.test(String((err&&err.message)||err)) && !(err&&err.code);
    fail(offline? t('sendFail') : t('sendReject')+'  ['+String((err&&(err.code||err.message))||'error').slice(0,60)+']');
  }
}
function done(id){
  $('formWrap').hidden=true; $('navBar').hidden=true; $('doneWrap').hidden=false;
  $('doneId').textContent=id; window.scrollTo(0,0);
  document.querySelectorAll('#doneWrap [data-t]').forEach(el=>{ el.textContent=t(el.dataset.t); });
  let s=RESET_AFTER_SEC;
  const upd=()=>{ $('resetNote').textContent=t('resetIn',{s}); };
  upd(); clearInterval(resetHandle);
  resetHandle=setInterval(()=>{ s--; if(s<=0) restart(); else upd(); }, 1000);
}
function restart(){
  clearInterval(resetHandle);
  D={staffType:TYPE_FROM_LINK}; FILES=[]; step=TYPE_FROM_LINK? 1 : 0;
  $('formWrap').hidden=false; $('navBar').hidden=false; $('doneWrap').hidden=true;
  $('nextBtn').disabled=false; $('errBox').hidden=true;
  render(); window.scrollTo(0,0);
}
$('restartBtn').addEventListener('click', restart);

/* Nothing is kept in browser storage — a shared HR tablet must not show the previous person's
   IC or bank details to the next one. Reloading simply starts over. */
render();
</script>
</body>
</html>
