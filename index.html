/* ============================================================
   STEP 01 — CUSTOMER PO REGISTER (in-page, not a link out)
   Tabs: PO Register · Product Demand · Shipment Schedule ·
         Price Check · Price Master · Reports
   ============================================================ */
const REG_TABS = [
  {k:'register', t:'PO Register'},
  {k:'demand',   t:'Product Demand'},
  {k:'schedule', t:'Shipment Schedule'},
  {k:'pricecheck',t:'Price Check'},
  {k:'pricemaster',t:'Price Master'},
  {k:'regreports', t:'Reports'}
];
function shipPill(po){
  if(po.status==='cancelled') return '<span class="tag t-bad">voided</span>';
  if(po.status==='shipped') return '<span class="tag t-ok">shipped</span>';
  const d=daysFromToday(po.shipBy);
  if(d==null) return '';
  if(d<0) return '<span class="tag t-bad">'+(-d)+' days over</span>';
  if(d<=7) return '<span class="tag t-warn">'+d+' days to ship</span>';
  return '<span class="tag t-ok">'+d+' days to ship</span>';
}
function ourRef(po){ return 'HEM/'+String(po.poDate||today()).slice(0,4)+'/'+po.po; }
function poCases(po){ return (po.lines||[]).reduce((s,l)=>s+(Number(l.cases)||0),0); }
function packOf(code){
  const p=product(code); if(p.packSize) return p.packSize;
  const pr=priceRow(code); if(pr&&pr.packSize) return pr.packSize;
  /* fall back to whatever pack size was captured on an order line for this code */
  for(const po of (S.pos||[])) for(const l of (po.lines||[]))
    if(String(l.code).toUpperCase()===String(code).toUpperCase() && l.packSize) return Number(l.packSize);
  return 1;
}

function V_orders(){
  cleanupVoidedPOs();
  const tab=F('tab','register');
  const open=(S.pos||[]).filter(p=>p.status!=='shipped'&&p.status!=='cancelled');
  const shipped=(S.pos||[]).filter(p=>p.status==='shipped');
  const cases=open.reduce((s,p)=>s+poCases(p),0);
  const pieces=open.reduce((s,p)=>s+(p.lines||[]).reduce((t,l)=>t+(Number(l.cases)||0)*packOf(l.code),0),0);
  const overdue=open.filter(p=>daysFromToday(p.shipBy)<0);
  const due7=open.filter(p=>{const d=daysFromToday(p.shipBy); return d>=0&&d<=7;});
  const checks=priceCheck();
  const variances=checks.filter(c=>c.verdict==='variance');
  const confirmed=(S.prices||[]).filter(p=>priceStatus(p)==='confirmed').length;
  const unconf=unconfirmedPrices();
  const nextSum=nextSummary();

  let h = KPI([
    {k:'Open POs', v:nf(open.length), d:nf(shipped.length)+' shipped'},
    {k:'Open order value', v:money(open.reduce((s,p)=>s+(p.value||0),0)), d:money((S.pos||[]).reduce((s,p)=>s+(p.value||0),0))+' all time'},
    {k:'Cases outstanding', v:nf(cases), d:nf(pieces)+' pieces'},
    {k:'Overdue shipments', v:nf(overdue.length), d:'past '+(S.settings.defaultShipDays||30)+'-day window', cls:overdue.length?'bad':'ok'},
    {k:'Due ≤ 7 days', v:nf(due7.length), d:'ship this week', cls:due7.length?'warn':''},
    {k:'Price variances', v:nf(variances.length), d:confirmed+' of '+(S.prices||[]).length+' prices confirmed', cls:variances.length?'bad':(confirmed?'ok':'warn')},
    {k:'Next summary', v:nextSum===today()?'due today':(nextSum||'—'), d:(S.settings.summaryDays||[]).join(' & ')+' customer summary', cls:nextSum===today()?'warn':''}
  ]);

  if(unconf.length) h+='<div class="banner warn"><span class="tag t-warn" style="flex:none">Prices</span>'
    +'<span style="flex:1"><b>'+unconf.length+' product'+(unconf.length>1?'s have':' has')+' no confirmed price of ours</b> — order lines for '
    +(unconf.length>1?'them':'it')+' are not being checked. Enter our case price and confirm it.</span>'
    +btn('Open price master','reg-tab','pricemaster')+'</div>';
  const figIssues=arithmeticIssues();
  if(figIssues.length) h+='<div class="banner bad"><span class="tag t-bad" style="flex:none">Check figures</span>'
    +'<span style="flex:1"><b>'+figIssues.length+' line'+(figIssues.length>1?'s do':' does')+' not agree with the line total printed on the order.</b> '
    +'Cases × case price should equal the line total. Where it does not, the quantity was almost certainly misread when the order was captured.</span>'
    +btn('Open the audit','fig-audit')+'</div>';
  const noPack=missingPack();
  if(noPack.length) h+='<div class="banner warn"><span class="tag t-warn" style="flex:none">Pack size</span>'
    +'<span style="flex:1"><b>'+noPack.length+' line'+(noPack.length>1?'s have':' has')+' no pack size</b> ('
    +esc([...new Set(noPack.map(x=>x.code))].join(', '))+') — their pieces are excluded from every piece count until a pack size is set.</span>'
    +btn('Price master','reg-tab','pricemaster')+'</div>';
  const revs=recentRevisions(7);
  if(revs.length) h+='<div class="banner warn"><span class="tag t-warn" style="flex:none">Revised</span>'
    +'<span style="flex:1"><b>'+revs.length+' order'+(revs.length>1?'s were':' was')+' revised in the last 7 days</b> — '
    +esc(revs.map(p=>p.po+' (rev '+(p.revision||1)+')').join(', '))+'. Check any batch already planned against them.</span></div>';
  const reqs=withCustomerNote();
  if(reqs.length) h+='<div class="banner info"><span class="tag t-brand" style="flex:none">Requests</span>'
    +'<span style="flex:1"><b>'+reqs.length+' open order'+(reqs.length>1?'s carry':' carries')+' a customer special request</b> — '
    +esc(reqs.map(p=>p.po).join(', '))+'. These reach the floor on the production hand-off.</span></div>';
  if(nextSum===today()) h+='<div class="banner info"><span class="tag t-info" style="flex:none">Report due</span>'
    +'<span style="flex:1">The customer summary report is due today ('+esc(today())+'). '+esc((S.settings.summaryDays||[]).join(' & '))+', twice weekly.</span>'
    +btn('Generate','rep-summary')+'</div>';

  h += '<div class="subtabs">'+REG_TABS.map(t=>'<button class="subtab'+(tab===t.k?' on':'')+'" data-chip="tab" data-val="'+t.k+'" type="button">'
      +esc(t.t)+(t.k==='register'?' <b>'+open.length+'</b>':'')
      +(t.k==='demand'? ' <b>'+openDemand().length+'</b>':'')
      +(t.k==='pricemaster'&&unconf.length? ' <b class="warnpip">'+unconf.length+'</b>':'')
      +(t.k==='pricecheck'&&variances.length? ' <b class="warnpip">'+variances.length+'</b>':'')
      +'</button>').join('')+'</div>';

  h += ({register:REG_register, demand:REG_demand, schedule:REG_schedule,
         pricecheck:REG_priceCheck, pricemaster:REG_priceMaster, regreports:REG_reports}[tab]||REG_register)();
  return h;
}

/* ---------------- PO Register tab ---------------- */
function REG_register(){
  const q=F('q'), st=F('status'), sort=F('sort','urgency');
  let rows=(S.pos||[]).filter(p=>{
    if(st==='open'&&(p.status==='shipped'||p.status==='cancelled')) return false;
    if(st&&st!=='open'&&p.status!==st) return false;
    return match(p.po,q)||match(customerName(p.customer),q)||match(p.shipTo,q)
      ||match(p.customerNote,q)
      ||(p.lines||[]).some(l=>match(l.code,q)||match(l.desc,q)||match(l.note,q)||match(product(l.code).name,q));
  });
  rows = sort==='value'? sortBy(rows,'value','desc') : sort==='po'? sortBy(rows,'po','desc')
       : sort==='date'? sortBy(rows,'poDate','desc')
       /* urgency: soonest ship-by first, with anything already shipped dropped to the bottom */
       : sortBy(rows,'shipBy').sort((a,b)=>(a.status==='shipped'?1:0)-(b.status==='shipped'?1:0));
  const exp=UI.sel.poExpanded||{};

  const cards = rows.map(po=>{
    const isOpen=!!exp[po.id];
    const lineCases=poCases(po), pcs=(po.lines||[]).reduce((t,l)=>t+(Number(l.cases)||0)*packOf(l.code),0);
    const covered=(S.batches||[]).filter(b=>(b.pos||[]).includes(po.id));
    let c='<div class="pocard'+(isOpen?' open':'')+'">'
      +'<div class="pohead" data-act="po-toggle" data-arg="'+esc(po.id)+'">'
      +'<div class="postripe'+(po.status==='shipped'?' done':daysFromToday(po.shipBy)<0?' late':'')+'"></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="porow1"><b class="pono mono">'+esc(po.po)+'</b>'
        +'<span class="pocust">'+esc(customerName(po.customer))+'</span>'
        +'<span class="poref mono">'+esc(ourRef(po))+'</span>'
        +(po.revision?'<span class="tag t-warn">rev '+esc(po.revision)+'</span>':'')
        +(po.copy&&po.copy.pages&&po.copy.pages.length?'<span class="copychip" data-act="copy-view" data-arg="'+esc(po.id)+'">PO copy</span>':'')
        +(po.customerNote?'<span class="tag t-brand">special request</span>':'')
        +(po.source?'<span class="tag t-mute">'+esc(po.source)+'</span>':'')+'</div>'
      +'<div class="porow2">PO date <b class="mono">'+esc(po.poDate)+'</b>'
        +' · Ship by <b class="mono">'+esc(po.shipBy)+'</b>'
        +' · '+nf((po.lines||[]).length)+' product'+((po.lines||[]).length===1?'':'s')
        +' · <b class="mono">'+nf(lineCases)+'</b> cases · <span class="mono">'+nf(pcs)+'</span> pcs'
        +(po.shipTo? ' <span class="poship">→ '+esc(po.shipTo)+'</span>':'')+'</div></div>'
      +'<div class="pometa">'+shipPill(po)+'<div class="povalue mono">'+money(po.value)+'</div>'
        +'<div class="povlabel">PO value</div></div>'
      +'<div class="pochev">'+(isOpen?'▾':'▸')+'</div></div>';
    if(isOpen){
      c+='<div class="pobody">'
        +(po.customerNote? '<div class="note" style="margin-bottom:12px"><b>Customer request:</b> '+esc(po.customerNote)+'</div>':'')
        + T([
          {h:'Product', f:l=>'<b class="mono">'+esc(l.code)+'</b><div class="sub">'+esc(l.desc||product(l.code).name)+'</div>'
            +(l.note? '<div class="linenote">↳ '+esc(l.note)+'</div>':'')},
          {h:'Cases', c:'num', f:l=>nf(l.cases)},
          {h:'Pieces', c:'num', f:l=>{const pk=packOf(l.code); return pk>1? nf(l.cases*pk):'<span class="tag t-warn">no pack size</span>';}},
          {h:'PO price/cs', c:'num', f:l=>money(l.price)},
          {h:'Our price', c:'num', f:l=>{const pr=priceRow(l.code), stt=priceStatus(pr);
            if(stt!=='confirmed') return '<span class="tag t-warn">not confirmed</span>';
            const a=priceAsOf(l.code,po.poDate);
            return money(a.price)+(a.historic?'<div class="sub">price of '+esc(a.from||'')+'</div>':'');}},
          {h:'Variance', c:'num', f:l=>{const pr=priceRow(l.code); if(priceStatus(pr)!=='confirmed') return '<span class="sub">—</span>';
            const a=priceAsOf(l.code,po.poDate), d=+(l.price-a.price).toFixed(4);
            if(Math.abs(d)<=(S.settings.priceTolerance||0.005)) return '<span class="tag t-ok">match</span>';
            return '<span class="tag t-bad">'+(d>0?'+':'')+money(d)+'</span><div class="sub">'+money(d*l.cases)+' on this line</div>';}},
          {h:'Line value', c:'num', f:l=>money(l.cases*l.price)},
          {h:'Production', f:l=>{const bs=covered.filter(b=>b.product===l.code);
            return bs.length? bs.map(b=>link(b.id,'batch-open',b.id)+' '+tag(b.status)).join('<br>')
                            : btn('Plan batch','plan-from',l.code);}}
        ], po.lines||[])
        +'<div class="pillrow" style="margin-top:12px">'
        + btn('Full detail','po-open',po.id)
        + btn('Edit order','po-edit',po.id)
        + btn('Detail report','rep-podetail',po.id)
        + (po.copyLink? '<a class="btn sm" href="'+esc(po.copyLink)+'" target="_blank" rel="noopener">PO copy</a>':btn('Attach PO copy','po-copy',po.id))
        + ((po.revisions||[]).length? btn('Revisions ('+po.revisions.length+')','po-revisions',po.id):'')
        + (po.copy&&po.copy.pages&&po.copy.pages.length? btn('View filed copy','copy-view',po.id):btn('File a copy','copy-attach',po.id))
        + (po.status!=='shipped'&&po.status!=='cancelled'? btn('Mark shipped','po-ship',po.id):'')
        + (po.status!=='cancelled'? btn('Void order','po-void',po.id,'btn sm danger'):btn('Restore order','po-restore',po.id,'btn sm'))
        +'</div>'
        +(po.status==='cancelled'? '<div class="note" style="margin-top:10px"><b>Voided '+esc(po.voidedAt||'')+' by '+esc(po.voidedBy||'—')+'.</b> '+esc(po.voidReason||'')
            +'<div style="margin-top:4px;color:var(--bad)">'+esc(voidCountdown(po))+'</div></div>':'')
        +'</div>';
    }
    return c+'</div>';
  }).join('');

  return filterBar([searchCtl('q',q,'Search PO, product code, customer…'),
      selCtl('status',[{v:'open',t:'Open only'},{v:'planned',t:'Planned'},{v:'in production',t:'In production'},{v:'shipped',t:'Shipped'},{v:'cancelled',t:'Voided'}],st,'All statuses'),
      selCtl('sort',[{v:'urgency',t:'Sort: urgency'},{v:'value',t:'Sort: value'},{v:'date',t:'Sort: PO date'},{v:'po',t:'Sort: PO number'}],sort,''),
      btn('Expand all','po-expand-all'), btn('Collapse all','po-collapse-all'),
      btn('Import a CSV export','po-import'),
      btn('+ Upload customer PO','po-upload',null,'btn primary')])
    + (rows.length? '<div class="pocards">'+cards+'</div>'
      : '<div class="tw"><div class="empty"><b>No orders match</b>Clear the filter, or add a purchase order.</div></div>');
}

/* ---------------- Product Demand tab ---------------- */
function REG_demand(){
  const q=F('dq'), scope=F('scope','open'), sort=F('dsort','urgency');
  const pos=(S.pos||[]).filter(p=> scope==='all'? true : scope==='shipped'? p.status==='shipped' : (p.status!=='shipped'&&p.status!=='cancelled'));
  const map=new Map();
  pos.forEach(po=>(po.lines||[]).forEach(l=>{
    const k=String(l.code).toUpperCase();
    const r=map.get(k)||{code:l.code, cases:0, pieces:0, value:0, prices:new Set(), pos:[], earliest:''};
    r.cases+=Number(l.cases)||0; r.pieces+=(Number(l.cases)||0)*packOf(l.code);
    r.value+=(Number(l.cases)||0)*(Number(l.price)||0);
    r.prices.add(Number(l.price));
    r.pos.push({po:po.po, poId:po.id, cases:l.cases, price:l.price, shipBy:po.shipBy, customer:po.customer});
    if(!r.earliest||(po.shipBy&&po.shipBy<r.earliest)) r.earliest=po.shipBy;
    map.set(k,r);
  }));
  let rows=[...map.values()].filter(r=>match(r.code,q)||match(product(r.code).name,q));
  rows.forEach(r=>{
    r.split=r.prices.size>1;
    r.onHand=(S.fg||[]).filter(f=>f.product===r.code&&f.status==='released').reduce((s,f)=>s+f.cases,0);
    r.toMake=Math.max(0,r.cases-r.onHand);
  });
  rows = sort==='cases'? sortBy(rows,'cases','desc') : sort==='value'? sortBy(rows,'value','desc')
       : sort==='code'? sortBy(rows,'code') : sortBy(rows,'earliest');
  const exp=UI.sel.demandExpanded||{};

  return '<div class="note">Every open order line consolidated by product — this is what the plant has to make, regardless of which order it came from. A product ordered at more than one case price is flagged.</div><div style="height:12px"></div>'
   + filterBar([searchCtl('dq',q,'Product code or description'),
       selCtl('scope',[{v:'open',t:'Open orders'},{v:'all',t:'All orders'},{v:'shipped',t:'Shipped only'}],scope,''),
       selCtl('dsort',[{v:'urgency',t:'Sort: urgency'},{v:'cases',t:'Sort: cases'},{v:'value',t:'Sort: value'},{v:'code',t:'Sort: code'}],sort,''),
       btn('Production plan (CSV)','export-plan'), btn('Requirement report','rep-requirement')])
   + T([
      {h:'Product', f:r=>'<b class="mono">'+esc(r.code)+'</b><div class="sub">'+esc(product(r.code).name)+'</div>'},
      {h:'Orders', f:r=>'<span class="mono" style="font-size:12px">'+esc(r.pos.map(p=>p.po).join(', '))+'</span>'},
      {h:'Cases', c:'num', f:r=>'<b>'+nf(r.cases)+'</b>'},
      {h:'Pieces', c:'num', f:r=>nf(r.pieces)},
      {h:'In FG', c:'num', f:r=>nf(r.onHand)},
      {h:'To make', c:'num', f:r=>r.toMake? '<b>'+nf(r.toMake)+'</b>':'<span class="tag t-ok">covered</span>'},
      {h:'Value', c:'num', f:r=>money(r.value)},
      {h:'Price', f:r=>r.split? '<span class="tag t-bad">split price</span><div class="sub">'+[...r.prices].map(p=>money(p)).join(' / ')+'</div>'
                              : '<span class="mono">'+money([...r.prices][0])+'</span>'},
      {h:'Earliest ship-by', c:'num', f:r=>{const d=daysFromToday(r.earliest);
        return '<span class="mono">'+esc(r.earliest||'—')+'</span>'+(d!=null?'<div class="sub"><span class="tag '+(d<0?'t-bad':d<=7?'t-warn':'t-ok')+'">'+(d<0?(-d)+'d over':d+'d')+'</span></div>':'');}},
      {h:'', f:r=>btn(exp[r.code]?'Hide':'Breakdown','demand-toggle',r.code)+(r.toMake?' '+btn('Plan','plan-from',r.code):'')}
    ], rows, {empty:'No demand in this scope.'})
   + Object.keys(exp).filter(k=>exp[k]).map(k=>{
       const r=rows.find(x=>x.code===k); if(!r) return '';
       return sect('Breakdown — '+r.code, T([
         {h:'PO', f:x=>'<b class="mono">'+esc(x.po)+'</b>'},
         {h:'Customer', f:x=>esc(customerName(x.customer))},
         {h:'Cases', c:'num', f:x=>nf(x.cases)},
         {h:'Price/cs', c:'num', f:x=>money(x.price)},
         {h:'Value', c:'num', f:x=>money(x.cases*x.price)},
         {h:'Ship by', c:'num', f:x=>'<span class="mono">'+esc(x.shipBy)+'</span>'}
       ], r.pos));
     }).join('');
}

/* ---------------- Shipment Schedule tab ---------------- */
function REG_schedule(){
  const buffer=S.settings.prodBufferDays||7;
  const rows=sortBy((S.pos||[]).filter(p=>p.status!=='cancelled'),'shipBy');
  return '<div class="note">Ship-by is '+(S.settings.defaultShipDays||30)+' days from the PO date. Production should complete '+buffer
    +' days before that, which is the date the plant actually works to.</div><div style="height:12px"></div>'
   + T([
      {h:'Ship by', c:'num', f:p=>'<b class="mono">'+esc(p.shipBy)+'</b>'},
      {h:'PO', f:p=>'<b class="mono">'+esc(p.po)+'</b><div class="sub">'+esc(ourRef(p))+'</div>'},
      {h:'Customer', f:p=>esc(customerName(p.customer))+'<div class="sub">'+esc(p.shipTo||'')+'</div>'},
      {h:'Cases', c:'num', f:p=>nf(poCases(p))},
      {h:'Value', c:'num', f:p=>money(p.value)},
      {h:'Production due', c:'num', f:p=>{const d=new Date(new Date(p.shipBy).getTime()-buffer*864e5).toISOString().slice(0,10);
        const left=daysFromToday(d);
        return '<span class="mono">'+esc(d)+'</span>'+(p.status!=='shipped'?'<div class="sub"><span class="tag '+(left<0?'t-bad':left<=7?'t-warn':'t-mute')+'">'+(left<0?(-left)+'d over':left+'d')+'</span></div>':'');}},
      {h:'Batches', f:p=>{const bs=(S.batches||[]).filter(b=>(b.pos||[]).includes(p.id));
        return bs.length? bs.map(b=>'<span class="mono" style="font-size:12px">'+esc(b.id)+'</span> '+tag(b.status)).join('<br>'):'<span class="tag t-warn">not planned</span>';}},
      {h:'Container', f:p=>{const s=(S.shipments||[]).find(x=>(x.pos||[]).includes(p.id));
        return s? link(s.id,'shp-open',s.id)+'<div class="sub mono">'+esc(s.container||'not assigned')+'</div>':'<span class="sub">none</span>';}},
      {h:'Window', f:p=>shipPill(p)}
    ], rows, {empty:'No orders scheduled.'});
}

/* ---------------- Price Check tab ---------------- */
function REG_priceCheck(){
  const only=F('pcOnly');
  let rows=priceCheck();
  if(only==='variance') rows=rows.filter(r=>r.verdict==='variance');
  if(only==='unchecked') rows=rows.filter(r=>r.verdict==='unchecked');
  const v=priceCheck().filter(r=>r.verdict==='variance');
  const impact=v.reduce((s,r)=>s+(r.impact||0),0);
  return KPI([
    {k:'Lines checked', v:nf(priceCheck().filter(r=>r.verdict!=='unchecked').length)+'/'+nf(priceCheck().length), d:'against a confirmed price'},
    {k:'Variances', v:nf(v.length), d:'beyond $'+(S.settings.priceTolerance||0.005)+' per case', cls:v.length?'bad':'ok'},
    {k:'Value at stake', v:money(impact), d:'difference across the flagged lines', cls:Math.abs(impact)>0?'warn':''},
    {k:'Prices confirmed', v:nf((S.prices||[]).filter(p=>priceStatus(p)==='confirmed').length)+'/'+nf((S.prices||[]).length), d:'unconfirmed prices judge nothing', cls:unconfirmedPrices().length?'warn':'ok'}
  ])
  + '<div class="note">A line is only judged against a price we have <b>confirmed</b>, and against the price that was in force on that order\'s own PO date — so raising a price later never retro-flags an order placed before the rise.</div><div style="height:12px"></div>'
  + filterBar(['<button class="chip'+(only==='variance'?' on':'')+'" data-chip="pcOnly" data-val="'+(only==='variance'?'':'variance')+'" type="button">Variances only</button>',
      '<button class="chip'+(only==='unchecked'?' on':'')+'" data-chip="pcOnly" data-val="'+(only==='unchecked'?'':'unchecked')+'" type="button">Unchecked only</button>',
      btn('Open price master','reg-tab','pricemaster')])
  + T([
      {h:'PO', f:r=>'<b class="mono">'+esc(r.po)+'</b><div class="sub mono">'+esc(r.poDate)+'</div>'},
      {h:'Customer', f:r=>esc(customerName(r.customer))},
      {h:'Product', f:r=>'<span class="mono">'+esc(r.code)+'</span><div class="sub">'+esc(product(r.code).name)+'</div>'},
      {h:'Cases', c:'num', f:r=>nf(r.cases)},
      {h:'PO price', c:'num', f:r=>money(r.poPrice)},
      {h:'Our price', c:'num', f:r=>r.ours==null? '<span class="tag t-warn">'+(r.status==='awaiting'?'no price entered':r.status==='none'?'not in master':'not confirmed')+'</span>'
          : money(r.ours)+(r.historic?'<div class="sub">price of '+esc(r.histFrom||'')+'</div>':'')},
      {h:'Difference', c:'num', f:r=>r.diff==null? '—' : (r.verdict==='match'? '<span class="tag t-ok">match</span>'
          : '<b style="color:var(--bad)">'+(r.diff>0?'+':'')+money(r.diff)+'</b>')},
      {h:'On the line', c:'num', f:r=>r.verdict==='variance'? '<b style="color:var(--bad)">'+money(r.impact)+'</b>':'—'},
      {h:'', f:r=>btn('Price master','price-open',r.code)}
    ], rows, {empty:'Nothing to check in this filter.'});
}

      {h:'In force from', c:'num', f:p=>p.effectiveFrom? '<span class="mono">'+esc(p.effectiveFrom)+'</span>':'<span class="sub">—</span>'},
      {h:'History', f:p=>(p.history||[]).length? link((p.history||[]).length+' superseded','price-history',p.code):'<span class="sub">none</span>'},
      {h:'Notes', f:p=>'<span class="sub">'+esc(p.notes||'')+'</span>'},
      {h:'', f:p=>{const s=priceStatus(p);
        return btn('Edit','price-open',p.code)+' '+(s==='confirmed'? btn('Change','price-change',p.code) : btn('Confirm','price-confirm',p.code,'btn sm'));}}

/* ============================ TRACEABILITY ============================ */
function traceChain(batchId){
  const b = byId('batches',batchId); if(!b) return '<div class="empty"><b>Batch not found</b>Pick a batch from the list.</div>';
  const p = product(b.product), f = formula(b.formula)||{};
  const iss = batchIssues(b.id), ip = batchIpqc(b.id), qc = batchQc(b.id), coa = batchCoa(b.id), fgs = batchFg(b.id);
  const ships = fgs.flatMap(g=>fgShipments(g.id));
  const pos = (b.pos||[]).map(id=>byId('pos',id)).filter(Boolean);
  const devs = (S.deviations||[]).filter(d=>d.ref===b.id);
  const step = (done, title, meta, body) =>
    '<div class="chainstep"><div class="rail"><span class="dot '+(done?'done':'miss')+'"></span><span class="ln"></span></div>'
    +'<div class="body"><h4>'+title+'</h4>'+(meta?'<div class="meta">'+meta+'</div>':'')+(body||'')+'</div></div>';
  const mini = (cols,rows)=> rows.length? '<div style="margin-top:8px">'+T(cols,rows)+'</div>':'';

  let h='<div class="chain">';
  h += step(pos.length, 'Customer order', pos.length? pos.map(o=>'PO <b class="mono">'+esc(o.po)+'</b> · '+esc(customerName(o.customer))+' · ship by '+esc(o.shipBy)).join('<br>') : 'No order linked — this batch was made to stock.');
  h += step(true, 'Formulation', '<span class="mono">'+esc(b.formula)+'</span> version '+esc(f.version||'—')+' · approved '+esc(f.approvedOn||'—')+' by '+esc(person(f.approvedBy))+'<br>Specification: pH '+esc(f.ph||'—')+' · viscosity '+esc(f.viscosity||'—'));
  h += step(iss.length, 'Raw and packaging material lots', iss.length? iss.length+' issue lines, each tied to a released incoming lot' : 'No material issued yet.',
    mini([{h:'Material',f:i=>'<span class="mono">'+esc(i.code)+'</span> '+esc(material(i.code).name)},
          {h:'Lot',f:i=>'<b class="mono">'+esc(i.lot)+'</b>'},
          {h:'Supplier',f:i=>{const g=(S.grns||[]).find(x=>x.lot===i.lot); return g? esc(supplierName(g.supplier))+'<div class="sub">supplier lot '+esc(g.supLot||'—')+'</div>':'—';}},
          {h:'Qty',c:'num',f:i=>nf(i.qty,i.uom==='kg'?2:0)+' '+esc(i.uom)},
          {h:'Released by',f:i=>{const g=(S.grns||[]).find(x=>x.lot===i.lot); return g&&g.releasedBy? personShort(g.releasedBy)+'<div class="sub">'+esc(g.releaseDate)+'</div>':'<span class="tag t-warn">check</span>';}}
         ], iss));
  h += step(!!b.actualStart, 'Manufacture', b.actualStart? esc(b.line)+' · started '+esc(b.actualStart)+(b.actualEnd?' · completed '+esc(b.actualEnd):'')+' · operator '+esc(person(b.operator))+'<br>'+esc(b.lineClearance||'') : 'Not yet started.');
  h += step(ip.length, 'In-process control', ip.length? ip.filter(x=>x.verdict==='pass').length+' of '+ip.length+' checks within specification':'No in-process checks recorded.',
    mini([{h:'Point',f:i=>esc(i.point)},{h:'Parameter',f:i=>esc(i.param)},{h:'Spec',f:i=>'<span class="mono" style="font-size:12px">'+esc(i.spec)+'</span>'},
          {h:'Result',c:'num',f:i=>'<span class="mono">'+esc(i.result)+' '+esc(i.unit||'')+'</span>'},{h:'',f:i=>tag(i.verdict)},{h:'By',f:i=>personShort(i.by)}], ip));
  h += step(qc.length, 'Finished product testing', qc.length? qc.length+' release tests recorded':'Release panel not yet performed.',
    mini([{h:'Test',f:i=>'<b>'+esc(i.test)+'</b><div class="sub">'+esc(i.method)+'</div>'},{h:'Specification',f:i=>esc(i.spec)},
          {h:'Result',c:'num',f:i=>'<span class="mono">'+esc(i.result)+'</span>'},{h:'',f:i=>tag(i.verdict)}], qc));
  h += step(devs.length? true:true, 'Deviations against this batch', devs.length? '' : 'None raised.',
    devs.length? mini([{h:'Ref',f:d=>'<b class="mono">'+esc(d.id)+'</b>'},{h:'Title',f:d=>esc(d.title)},{h:'Severity',f:d=>tag(d.severity)},{h:'Status',f:d=>tag(d.status)},{h:'Impact',f:d=>esc(d.impact)}], devs):'');
  h += step(!!coa, 'Release and certificate of analysis', coa? 'COA <b class="mono">'+esc(coa.id)+'</b> issued '+esc(coa.issuedAt)+' by '+esc(person(coa.issuedBy))+' to '+esc(customerName(coa.issuedTo)) : 'Not released.',
    coa? '<div style="margin-top:8px">'+btn('Open certificate','coa-open',coa.id)+'</div>':'');
  h += step(fgs.length, 'Finished goods', fgs.length? fgs.map(g=>'<b class="mono">'+esc(g.id)+'</b> · '+nf(g.cases)+' cases · '+esc(g.location)+' · expiry '+esc(g.expDate)).join('<br>'):'Not transferred to the FG store.');
  h += step(ships.length, 'Shipment', ships.length? ships.map(s=>'<b class="mono">'+esc(s.id)+'</b> · container '+esc(s.container||'not assigned')+' · seal '+esc(s.seal||'—')+' · '+esc(s.vessel||'')+' · ETD '+esc(s.etd)).join('<br>'):'Not yet shipped.',
    ships.length? '<div style="margin-top:8px">'+ships.map(s=>btn('Load plan '+s.id,'shp-open',s.id)).join(' ')+'</div>':'');
  h += '</div>';
  return h;
}

/* ============================ COMPLIANCE TRACKER ============================ */
const STD_META = {
 'ISO 22716':{full:'ISO 22716:2007 — Cosmetics, Good Manufacturing Practices', note:'The international cosmetics GMP standard. Malaysia and the ASEAN Cosmetic Directive both lean on it, and it is the working benchmark for the FDA rule that MoCRA has yet to finalise.'},
 'ISO 9001':{full:'ISO 9001:2015 — Quality management systems', note:'The management-system layer around GMP: context, leadership, planning, support, operation, evaluation, improvement.'},
 'Malaysia GMP':{full:'Guidelines for Control of Cosmetic Products in Malaysia — NPRA', note:'Notification (valid two years, renew at least one month before expiry), a maintained Product Information File, ACD annex compliance, labelling and adverse event reporting. Manufacturers are inspected before notification and periodically after.'},
 'FDA MoCRA':{full:'Modernization of Cosmetics Regulation Act — US FDA', note:'Facility registration and product listing, safety substantiation, adverse event records with 15-business-day serious-event reporting, and labelling. FDA has not yet finalised cosmetic GMP regulations, so ISO 22716 stands in.'}
};
function V_compliance(){
  const stdF=F('std'), stF=F('status'), q=F('q');
  const all=S.compliance||[];
  const rows=all.filter(c=>(!stdF||c.std===stdF)&&(!stF||c.status===stF)&&(match(c.title,q)||match(c.req,q)||match(c.cl,q)||match(c.evidence,q)));
  const stds=[...new Set(all.map(c=>c.std))];
  const score = s => { const g=all.filter(c=>c.std===s); const v=g.reduce((t,c)=>t+(c.status==='met'?1:c.status==='partial'?0.5:0),0); return {n:g.length, pct:g.length?Math.round(v/g.length*100):0, gaps:g.filter(c=>c.status==='gap').length}; };
  const overall = Math.round(all.reduce((t,c)=>t+(c.status==='met'?1:c.status==='partial'?0.5:0),0)/(all.length||1)*100);

  const scoreCards = '<div class="cols">'+stds.map(s=>{const sc=score(s); const m=STD_META[s]||{};
    return '<div class="card"><h3>'+esc(s)+'</h3><div class="sub" style="font-size:11.5px;color:var(--muted);margin:-4px 0 8px">'+esc(m.full||'')+'</div>'
      +'<div class="mono" style="font-size:28px;line-height:1.1">'+sc.pct+'%</div>'
      +'<div class="meter"><i class="'+(sc.pct>=90?'ok':sc.pct>=70?'warn':'bad')+'" style="width:'+sc.pct+'%"></i></div>'
      +'<div class="sub" style="margin-top:7px;font-size:12px;color:var(--muted)">'+sc.n+' clauses tracked · '+(sc.gaps?'<b style="color:var(--bad)">'+sc.gaps+' gap'+(sc.gaps>1?'s':'')+'</b>':'no gaps')+'</div>'
      +'<div style="font-size:12px;color:var(--ink2);margin-top:9px;line-height:1.5">'+esc(m.note||'')+'</div></div>';
  }).join('')+'</div>';

  return KPI([
    {k:'Overall readiness', v:overall+'%', d:'weighted, partial counts half', cls:overall>=90?'ok':overall>=75?'warn':'bad'},
    {k:'Clauses met', v:nf(all.filter(c=>c.status==='met').length)+'/'+all.length, d:'evidence on file', cls:'ok'},
    {k:'Partial', v:nf(all.filter(c=>c.status==='partial').length), d:'evidence incomplete', cls:'warn'},
    {k:'Gaps', v:nf(all.filter(c=>c.status==='gap').length), d:'would be a finding today', cls:all.filter(c=>c.status==='gap').length?'bad':'ok'}
  ])
  + sect('By standard', scoreCards)
  + sect('Clause by clause',
      filterBar([searchCtl('q',q,'Clause, requirement or evidence'),
        selCtl('std',stds,stdF,'All standards'),
        selCtl('status',[{v:'met',t:'Met'},{v:'partial',t:'Partial'},{v:'gap',t:'Gap'}],stF,'Any status'),
        btn('Export register (CSV)','export-compliance')])
      + T([
        {h:'Standard', f:c=>'<span class="tag t-brand">'+esc(c.std)+'</span>'},
        {h:'Clause', c:'num', f:c=>'<b class="mono">'+esc(c.cl)+'</b>'},
        {h:'Requirement', f:c=>'<b>'+esc(c.title)+'</b><div class="sub">'+esc(c.req)+'</div>'},
        {h:'Evidence', f:c=>'<span style="font-size:12.5px">'+esc(c.evidence||'—')+'</span>'+(c.note?'<div class="sub" style="color:var(--bad)"><b>Gap:</b> '+esc(c.note)+'</div>':'')},
        {h:'Owner', f:c=>personShort(c.owner)},
        {h:'Reviewed', c:'num', f:c=>'<span class="mono">'+esc(c.review||'—')+'</span>'},
        {h:'Status', f:c=>tag(c.status)},
        {h:'', f:c=>btn('Update','comp-open',c.std+'|'+c.cl)}
      ], rows, {empty:'No clauses match this filter.'}));
}

     + '</div>')
   + sect('Data', '<div class="card"><div style="font-size:13px;color:var(--ink2);margin-bottom:12px">'
     + (CAP.artifact
        ? 'Records are written back into the page itself, so everyone with the link sees the same register, and a copy is kept in this browser as a fallback.'
        : '<b>This copy is running from your own server.</b> Records are held in <b>this browser only</b> — they are not shared with anyone else opening the same address, and clearing site data erases them. '
          + 'Export a backup regularly, and import it on any other machine that needs the same figures. A shared, multi-user register needs a database behind the page.')
     + ' Export a backup before any structural change.</div>'
     + '<div class="pillrow">'+btn('Export full backup (JSON)','export-backup',null,'btn primary')
     + btn('Import backup','import-backup',null,'btn')
     + btn('Reset to seed data','reset-seed',null,'btn danger')+'</div></div>');
}

/* ============================================================
   MODALS, FORMS, ACTIONS, REPORTS, BOOT
   ============================================================ */
let MODAL_SEQ = 0;
function closeModal(){ $('#modal-root').innerHTML=''; document.body.classList.remove('printing'); MODAL_SEQ++; }
function modal(title, body, foot, wide){
  MODAL_SEQ++;
  $('#modal-root').innerHTML='<div class="mbg" data-close="1"><div class="modal'+(wide?' wide':'')+'">'
    +'<div class="mhead"><h3>'+title+'</h3><button class="x" data-act="close" type="button" aria-label="Close">×</button></div>'
    +'<div class="mbody">'+body+'</div>'
    +(foot!==false?'<div class="mfoot">'+(foot||'')+btn('Close','close',null,'btn')+'</div>':'')+'</div></div>';
}
function fieldHtml(f, v){
  const val = v==null?'':v;
  let ctl;
  if(f.type==='select') ctl='<select data-f="'+f.k+'">'+(f.blank!==false?'<option value=""></option>':'')
      +(f.opts||[]).map(o=>{const ov=typeof o==='string'?o:o.v, ot=typeof o==='string'?o:o.t;
        return '<option value="'+esc(ov)+'"'+(String(val)===String(ov)?' selected':'')+'>'+esc(ot)+'</option>';}).join('')+'</select>';
  else if(f.type==='textarea') ctl='<textarea data-f="'+f.k+'" rows="'+(f.rows||3)+'">'+esc(val)+'</textarea>';
  else if(f.type==='static') ctl='<div style="padding:6px 0">'+(f.html||esc(val))+'</div>';
  else ctl='<input type="'+(f.type||'text')+'" data-f="'+f.k+'" value="'+esc(val)+'"'+(f.step?' step="'+f.step+'"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
  return '<div class="field'+(f.full?' full':'')+'"><label>'+esc(f.label)+(f.req?' <span class="req">*</span>':'')+'</label>'+ctl
    +(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>';
}
let FORM = null;
function formModal(cfg){
  FORM = cfg;
  const v = cfg.values||{};
  let body = cfg.intro? '<div class="note" style="margin-bottom:14px">'+cfg.intro+'</div>':'';
  (cfg.groups|| [{fields:cfg.fields}]).forEach(g=>{
    body += g.legend? '<fieldset><legend>'+esc(g.legend)+'</legend><div class="fgrid">':'<div class="fgrid">';
    (g.fields||[]).forEach(f=> body+=fieldHtml(f, v[f.k]!==undefined?v[f.k]:f.def));
    body += g.legend? '</div></fieldset>':'</div>';
  });
  if(cfg.after) body += cfg.after;
  modal(esc(cfg.title), body, (cfg.extraFoot||'')+btn(cfg.saveLabel||'Save','form-save',null,'btn primary'), cfg.wide);
}
function readForm(){
  const o={};
  document.querySelectorAll('#modal-root [data-f]').forEach(el=>{
    let v = el.value;
    if(el.type==='number') v = v===''?null:Number(v);
    o[el.dataset.f]=v;
  });
  return o;
}

  return '<div class="cols2" style="margin-bottom:16px">'
   +'<div class="card"><h3>Batch identity</h3><dl class="dl">'
   +'<dt>Batch no.</dt><dd class="mono"><b>'+esc(b.id)+'</b></dd>'

   +'<dt>Formula</dt><dd class="mono">'+esc(b.formula)+' v'+esc(f.version||'')+'</dd>'
   +'<dt>Line</dt><dd>'+esc(b.line||'—')+'</dd>'
   +'<dt>Planned</dt><dd class="mono">'+nf(b.plannedKg)+' kg · '+nf(b.plannedUnits)+' units</dd>'
   +'<dt>Actual</dt><dd class="mono">'+(b.actualKg?nf(b.actualKg,1)+' kg · '+nf(b.actualUnits)+' units':'—')+'</dd>'
   +'<dt>Yield</dt><dd class="mono">'+(b.yieldPct?nf(b.yieldPct,2)+'%':'—')+'</dd>'

   +'<div class="card"><h3>Line clearance and signatures</h3>'
   +'<div style="font-size:12.5px;color:var(--ink2);line-height:1.55;margin-bottom:10px">'+esc(b.lineClearance||'Line clearance not yet recorded. A batch may not start without it — ISO 22716 cl. 7.3.')+'</div>'
   +'<dl class="dl"><dt>Operator</dt><dd>'+esc(person(b.operator))+'</dd>'
   +'<dt>Checked by</dt><dd>'+(b.checkedBy?esc(person(b.checkedBy)):'<span class="tag t-warn">pending</span>')+'</dd>'
   +'<dt>Started</dt><dd class="mono">'+esc(b.actualStart||'—')+'</dd>'

   +(b.notes?'<div class="note" style="margin-top:10px">'+esc(b.notes)+'</div>':'')+'</div></div>'
   + sect('Material requirement versus issued', T([
       {h:'Phase', f:r=>'<span class="sub">'+esc(r.phase)+'</span>'},
       {h:'Material', f:r=>'<span class="mono">'+esc(r.code)+'</span><div class="sub">'+esc(material(r.code).name)+'</div>'},
       {h:'% w/w', c:'num', f:r=>nf(r.pct,2)},
       {h:'Required', c:'num', f:r=>'<b class="mono">'+nf(r.need,2)+' kg</b>'},
       {h:'Issued', c:'num', f:r=>{const q=issued(r.code); const d=q-r.need;

       {h:'Lots used', f:r=>iss.filter(i=>i.code===r.code).map(i=>'<span class="mono" style="font-size:12px">'+esc(i.lot)+'</span>').join('<br>')||'—'}
     ], req, {empty:'No formula attached to this batch.'}))
   + sect('In-process control', T([
       {h:'Point', f:i=>esc(i.point)}, {h:'Parameter', f:i=>'<b>'+esc(i.param)+'</b>'},
       {h:'Spec', f:i=>'<span class="mono" style="font-size:12px">'+esc(i.spec)+'</span>'},
       {h:'Result', c:'num', f:i=>'<span class="mono">'+esc(i.result)+' '+esc(i.unit||'')+'</span>'},
       {h:'', f:i=>tag(i.verdict)}, {h:'By / at', f:i=>personShort(i.by)+'<div class="sub mono">'+esc(i.at)+'</div>'}
     ], ip, {emptyTitle:'No checks yet', empty:'Record in-process checks from the IPQC screen.'}));
}

function printModal(title, html){
  modal(esc(title), html, btn('Print / save as PDF','do-print',null,'btn primary'), true);
}

/* ---------------- option helpers ---------------- */

       {k:'coa',label:'Supplier CoA received',type:'select',opts:[{v:'yes',t:'Yes'},{v:'no',t:'No'}],def:'yes',blank:false}
     ]},{legend:'Identification', fields:[
       {k:'lot',label:'Our lot number',req:true,hint:'Convention: HEM-<3 letters>-YYMMDD'},
       {k:'mfg',label:'Manufactured',type:'date'},{k:'exp',label:'Expiry / retest',type:'date'},
       {k:'sampledBy',label:'Sampled by',type:'select',opts:optPeople()}
     ]}],
     onSave:v=>{
       if(!v.code||!v.lot||!v.qty) return toast('Material, lot number and quantity are required','bad');

       S.grns.unshift({id, date:v.date||today(), supplier:v.supplier, code:v.code, lot:v.lot, supLot:v.supLot||'',
         qty:Number(v.qty), uom:material(v.code).uom, mfg:v.mfg||'', exp:v.exp||'', coa:v.coa==='yes',
         status:'quarantine', sampledBy:v.sampledBy||'', releasedBy:'', releaseDate:'', tests:'', notes:'',
         deliveryNote:v.deliveryNote||'', spoRef:spo.id});

 'release-open': a=>{
   const b=byId('batches',a); if(!b) return;
   const qc=batchQc(b.id), ip=batchIpqc(b.id);
   const fails=ip.filter(i=>i.verdict==='fail'), devs=(S.deviations||[]).filter(d=>d.ref===b.id&&d.status==='open');
   const blocked = fails.length||devs.length||!qc.length;
   let body='';
   if(blocked) body+='<div class="banner bad"><b>This batch cannot be released yet.</b> '
     +[fails.length?fails.length+' in-process result(s) out of specification':'',
       devs.length?devs.length+' open deviation(s): '+devs.map(d=>d.id).join(', '):'',
       !qc.length?'no finished-product release tests recorded':''].filter(Boolean).join(' · ')+'</div>';
   body += bmrHtml(b);
   body += sect('Finished product release panel', T([
       {h:'Test', f:t=>'<b>'+esc(t.test)+'</b><div class="sub">'+esc(t.method)+'</div>'},
       {h:'Specification', f:t=>esc(t.spec)},
       {h:'Result', c:'num', f:t=>'<b class="mono">'+esc(t.result)+'</b>'},

/* ============================================================
   IMPORT ORDERS FROM THE PO REGISTER
   The register exports CSV; this reads whichever export is pasted
   (summary or detail, comma / tab / semicolon) by matching headings
   loosely rather than demanding an exact column order.
   ============================================================ */
function splitRows(text, sep){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function detectSep(text){
  const line=(text.split('\n').find(l=>l.trim())||'');
  const counts={'\t':(line.match(/\t/g)||[]).length, ';':(line.match(/;/g)||[]).length, ',':(line.match(/,/g)||[]).length};
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
}
function findCol(hdr, pats){ for(const p of pats){ const i=hdr.findIndex(h=>p.test(h)); if(i>=0) return i; } return -1; }
const IMPORT_COLS = {
  po:      [/^(po|po ?#|po ?no\.?|po number|customer po|order no\.?|order number|our ref)$/, /purchase order/, /^po\b/],
  customer:[/^customer$/, /customer name/, /^account$/, /^buyer$/, /customer/],
  poDate:  [/^po date$/, /order date/, /date received/, /^received$/, /^date$/],
  shipBy:  [/ship ?-? ?by/, /due date/, /required.*date/, /delivery date/, /^due$/],
  terms:   [/payment terms/, /^terms$/],
  shipTo:  [/ship ?to/, /destination/, /deliver/, /consignee/],
  code:    [/^(product code|item code|part no\.?|sku|code|item|product)$/, /product code/, /^sku$/, /^code$/],
  desc:    [/description/, /product name/],
  cases:   [/^cases$/, /cases ordered/, /case qty/, /^cs$/, /^qty$/, /^quantity$/, /qty.*case/, /cases/],
  price:   [/price ?\/? ?cs/, /price per case/, /case price/, /unit price/, /^price$/, /^rate$/],
  value:   [/^value$/, /line value/, /^amount$/, /^total$/, /order value/],
  note:    [/special ?(request|note)/, /^notes?$/, /remark/],
  rev:     [/^rev(ision)?/],
  uom:     [/^uom$/, /unit of measure/, /^unit$/, /^pack$/, /pack ?size/, /pieces? per case/],
  itemNo:  [/^item ?(no\.?|#)$/, /^line ?(no\.?|#)$/, /^seq$/]
};
function num(v){ if(v==null) return 0; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function normDate(v){
  const s=String(v).trim();
  const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let a=m[1], b=m[2], y=m[3]; y=y.length===2?'20'+y:y;
    // dd/mm/yyyy is the Malaysian convention; only fall back to mm/dd when the first part cannot be a day-of-month reading
    const dd = Number(b)>12 ? b : a, mo = Number(b)>12 ? a : b;
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0'); }
  const t=Date.parse(s);
  return isNaN(t)? today() : new Date(t).toISOString().slice(0,10);
}
function matchCustomer(name){
  if(!name) return {code:'', created:false};
  const n=String(name).trim().toLowerCase();
  const hit=(S.customers||[]).find(c=>c.code.toLowerCase()===n || c.name.toLowerCase()===n
    || c.name.toLowerCase().includes(n) || n.includes(c.name.toLowerCase()));
  if(hit) return {code:hit.code, created:false};
  const code=String(name).trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,4)||'CUS';
  return {code, name:String(name).trim(), created:true};
}
let PENDING_IMPORT=null;
function parseOrderPaste(text){
  const warn=[], sep=detectSep(text);
  const rows=splitRows(text.trim(), sep);
  if(rows.length<2) return {error:'That does not look like a table. Paste the heading row and at least one order line.'};
  let hi=-1;
  for(let i=0;i<Math.min(rows.length,8);i++){
    const h=rows[i].map(c=>String(c).trim().toLowerCase());
    if(findCol(h, IMPORT_COLS.po)>=0){ hi=i; break; }
  }
  if(hi<0) return {error:'No PO number column found. The paste needs a heading row with a column such as "PO", "PO number" or "Customer PO".'};
  const hdr=rows[hi].map(c=>String(c).trim().toLowerCase());
  const C={}; Object.keys(IMPORT_COLS).forEach(k=> C[k]=findCol(hdr, IMPORT_COLS[k]));
  if(C.cases<0 && C.code<0) warn.push('No product or quantity column was found, so the orders will come in without lines — planning will have nothing to size a batch from.');
  const orders=new Map();
  rows.slice(hi+1).forEach(r=>{
    const get=i=> i>=0? String(r[i]==null?'':r[i]).trim() : '';
    const po=get(C.po); if(!po) return;
    let o=orders.get(po);
    if(!o){
      const cm=matchCustomer(get(C.customer));
      o={po, customerRaw:get(C.customer), customer:cm.code, newCustomer:cm.created?cm:null,
         poDateFound:!!get(C.poDate), shipByFound:!!get(C.shipBy),
         poDate:get(C.poDate), shipBy:get(C.shipBy), terms:get(C.terms), shipTo:get(C.shipTo),
         rev:get(C.rev), note:get(C.note), lines:[], headerValue:num(get(C.value))};
      orders.set(po,o);
    }
    const code=get(C.code);
    if(code && (C.cases>=0 || C.price>=0)){
      /* the quantity and the unit of measure often arrive in one cell — split before any
         digit is glued to another (see the P697 extraction bug) */
      const t=tidyLineCells(get(C.cases));
      const line={code, desc:get(C.desc), itemNo:get(C.itemNo),
        cases:num(t.qty||get(C.cases)), price:num(get(C.price)),
        uom:get(C.uom)||t.uom||'', note:get(C.note),
        /* the total PRINTED ON THE DOCUMENT, never one we computed — it is the cross-check */
        total:C.value>=0? num(get(C.value)) : 0};
      line.packSize=packSizeFrom((line.uom||'')+' '+(line.desc||''), line.code);
      o.lines.push(verifyLine(line));
    }
  });
  const list=[...orders.values()];
  if(!list.length) return {error:'The heading row was found but no order rows followed it.'};
  list.forEach(o=>{
    o.poDate = /^\d{4}-\d{2}-\d{2}$/.test(o.poDate)? o.poDate : (o.poDate? normDate(o.poDate) : today());
    o.shipBy = /^\d{4}-\d{2}-\d{2}$/.test(o.shipBy)? o.shipBy : (o.shipBy? normDate(o.shipBy)
               : new Date(new Date(o.poDate).getTime()+(S.settings.defaultShipDays||30)*864e5).toISOString().slice(0,10));
    o.value = o.lines.length? o.lines.reduce((s,l)=>s+(l.total||l.cases*l.price),0) : o.headerValue;
    o.fixed = o.lines.filter(l=>l.qtyFixed);
    o.cases = o.lines.reduce((s,l)=>s+l.cases,0);
    o.existing = (S.pos||[]).find(p=>String(p.po).toLowerCase()===String(o.po).toLowerCase()) || null;
    o.unknown = o.lines.filter(l=>!byId('products',l.code,'code')).map(l=>l.code);
    o.dateWarn = o.shipBy < o.poDate;
  });
  if(list.some(o=>o.dateWarn)) warn.push('One or more orders have a ship-by date before their PO date, which usually means the export writes dates the other way round (dd/mm read as mm/dd, or the reverse). Check the two date columns in the preview before importing.');
  return {orders:list, warn};
}

ACT['po-import-preview'] = ()=>{
  const r=PENDING_IMPORT; if(!r) return;
  const news=r.orders.filter(o=>!o.existing).length, upd=r.orders.length-news;
  const newCust=r.orders.filter(o=>o.newCustomer);
  const unknown=[...new Set(r.orders.flatMap(o=>o.unknown))].filter(Boolean);
  let body='';
  (r.warn||[]).forEach(w=> body+='<div class="banner warn">'+esc(w)+'</div>');
  if(newCust.length) body+='<div class="banner info"><b>'+newCust.length+' customer'+(newCust.length>1?'s':'')+' not in the master.</b> '
    +esc(newCust.map(o=>o.customerRaw).join(', '))+' — will be added with the code '+esc(newCust.map(o=>o.customer).join(', '))+'.</div>';
  const fixed=r.orders.flatMap(o=>o.fixed||[]);
  if(fixed.length) body+='<div class="banner info"><b>'+fixed.length+' quantity corrected against the order\'s own line total.</b> '
    +esc(fixed.map(l=>l.code+': '+nf(l.qtyWas)+' → '+nf(l.cases)).join(' · '))
    +'. Where cases × case price did not equal the printed line total, the printed total was taken as correct.</div>';
  if(unknown.length) body+='<div class="banner warn"><b>'+unknown.length+' product code'+(unknown.length>1?'s':'')+' not in the product master:</b> '
    +esc(unknown.join(', '))+'. They will be created as stubs so the order is complete, but planning cannot size a batch until each has a pack size and a formula — Masters → Products.</div>';
  if(upd) body+='<div class="banner warn"><b>'+upd+' PO'+(upd>1?'s are':' is')+' already here.</b> Importing replaces the lines held against '
    +(upd>1?'them':'it')+' with what you pasted. Batches already linked to '+(upd>1?'them':'it')+' are not touched.</div>';
  body += T([
    {h:'PO', f:o=>'<b class="mono">'+esc(o.po)+'</b>'+(o.rev?'<div class="sub">rev '+esc(o.rev)+'</div>':'')},
    {h:'Customer', f:o=>esc(o.customerRaw||customerName(o.customer))+(o.newCustomer?' <span class="tag t-info">new</span>':'')},
    {h:'PO date', c:'num', f:o=>'<span class="mono"'+(o.dateWarn?' style="color:var(--bad)"':'')+'>'+esc(o.poDate)+'</span>'},
    {h:'Ship by', c:'num', f:o=>'<span class="mono"'+(o.dateWarn?' style="color:var(--bad)"':'')+'>'+esc(o.shipBy)+'</span>'+(o.dateWarn?'<div class="sub impbad">before PO date</div>':'')},
    {h:'Lines', c:'num', f:o=>nf(o.lines.length)},
    {h:'Cases', c:'num', f:o=>nf(o.cases)},
    {h:'Value', c:'num', f:o=>money(o.value)},
    {h:'Products', f:o=>o.lines.map(l=>'<span class="mono" style="font-size:12px'+(byId('products',l.code,'code')?'':';color:var(--bad)')+'">'+esc(l.code)+'</span> ×'+nf(l.cases)).join('<br>')||'<span class="sub">none</span>'},
    {h:'', f:o=>o.existing? '<span class="tag t-warn">replaces</span>':'<span class="tag t-ok">new</span>'}
  ], r.orders);
  modal('Import preview — '+r.orders.length+' order'+(r.orders.length>1?'s':''), body,
    btn('Import '+news+' new'+(upd?' and replace '+upd:''),'po-import-commit',null,'btn primary'), true);
};

ACT['po-import-commit'] = ()=>{
  const r=PENDING_IMPORT; if(!r) return;
  let made=0, replaced=0, stubs=0;
  r.orders.forEach(o=>{
    if(o.newCustomer && !byId('customers',o.customer,'code'))
      S.customers.push({code:o.customer, name:o.newCustomer.name, country:'', terms:o.terms||'', contact:'', notes:'Added by import from the PO Register.'});
    o.lines.forEach(l=>{
      if(l.code && !byId('products',l.code,'code')){
        S.products.push({code:l.code, name:l.desc||l.code, customer:o.customer, formula:'', packSize:0, uom:'',
          fill:0, fillUom:'ml', shelfLife:24, npra:'', npraExp:'', fdaListing:'', status:'active'});
        stubs++;
      }
    });
    const lines=o.lines.map(l=>({code:l.code, desc:l.desc||'', cases:l.cases, price:l.price,
      total:l.total||+(l.cases*l.price).toFixed(2), uom:l.uom||'', packSize:l.packSize||0, note:l.note||''}));
    if(o.existing){
      Object.assign(o.existing, {customer:o.customer||o.existing.customer, poDate:o.poDate, shipBy:o.shipBy,
        terms:o.terms||o.existing.terms, shipTo:o.shipTo||o.existing.shipTo,
        lines: lines.length? lines : o.existing.lines, value:o.value||o.existing.value, source:'PO Register'});
      if(o.note) o.existing.customerNote=o.note;
      replaced++;
    } else {
      S.pos.push({id:'PO-'+o.po, po:o.po, customer:o.customer, poDate:o.poDate, shipBy:o.shipBy, terms:o.terms||'',
        shipTo:o.shipTo||'', status:'planned', value:o.value, lines, customerNote:o.note||'', source:'PO Register'});
      made++;
    }
  });
  (S.pos||[]).forEach(newPriceRows);
  logAudit('Orders imported','PO Register', made+' created, '+replaced+' replaced'+(stubs?', '+stubs+' product stub'+(stubs===1?'':'s')+' added':''));
  PENDING_IMPORT=null; save(); closeModal(); render(); renderNav();
  toast(made+' order'+(made===1?'':'s')+' imported'+(replaced?', '+replaced+' replaced':''),'ok');
};

  logAudit('Order marked shipped', p.id, p.po); cleanupVoidedPOs(); save(); toast(p.po+' marked shipped','ok'); render(); };
/* Voiding never deletes the order — it stays on file with everything it had (lines, filed
   copy, audit trail), just marked cancelled and dropped out of the open-order counts and
   active views. A reason is required and the confirmation has to be typed, since this is the
   kind of action a stray tap should not be able to trigger. */
ACT['po-void'] = a=>{ const p=byId('pos',a); if(!p) return;
  if(p.status==='cancelled') return toast('Already voided','bad');
  formModal({title:'Void order '+p.po,
    intro:'<b>'+esc(p.po)+' — '+esc(customerName(p.customer))+' · '+nf((p.lines||[]).reduce((s,l)=>s+toNum(l.cases),0))+' cases · '+money(p.value)+'.</b> '
      +'The order stays on file for 24 hours under Void status — it drops out of open-order counts, demand, planning and shipping scheduling immediately, but can still be restored during that window. '
      +'After 24 hours it is permanently removed from the working register; a small audit tombstone (PO number, customer, dates, reason, who voided it) is kept for GMP/ISO history.',
    fields:[{k:'reason',label:'Why is this being voided?',full:true,req:true,ph:'Duplicate upload — same PO as P702'},
            {k:'confirm',label:'Type VOID to confirm',full:true}],
    saveLabel:'Void this order',
    onSave:v=>{
      if(!String(v.reason||'').trim()) return toast('A reason is required','bad');
      if(v.confirm!=='VOID') return toast('Type VOID to confirm','bad');
      p.statusBeforeVoid=p.status; p.status='cancelled';
      p.voidedAt=today(); p.voidedAtTS=new Date().toISOString(); p.voidReason=v.reason.trim(); p.voidedBy=UI.user||'SS';
      logAudit('Order voided', p.id, p.po+' — '+v.reason.trim()+' (by '+(UI.user||'SS')+')');
      cleanupVoidedPOs(); save(); toast(p.po+' voided — permanently removed in 24h unless restored','ok'); render();
    }});

ACT['po-restore'] = a=>{ const p=byId('pos',a); if(!p) return;

    fields:[{k:'confirm',label:'Type RESTORE to confirm',full:true}],

ACT['price-open'] = a=>{ let p=priceRow(a);
  if(!p){ const pr=product(a); p={code:a, desc:pr.name||a, price:null, packSize:pr.packSize||0, uom:pr.uom||'',
      confirmed:false, confirmedAt:'', effectiveFrom:'', history:[], notes:''}; S.prices.push(p); }
  formModal({title:'Price master — '+p.code, wide:true, values:p,
    intro:'Entering a price leaves it <b>provisional</b>. Only a confirmed price judges an order line.',
    groups:[{fields:[
      {k:'desc',label:'Description',full:true},
      {k:'price',label:'Our price per case',type:'number',step:'0.01'},
      {k:'packSize',label:'Units per case',type:'number'},
      {k:'uom',label:'Case code'},
      {k:'effectiveFrom',label:'In force from',type:'date',hint:'Orders dated before this are judged against the superseded price'},
      {k:'notes',label:'Notes',type:'textarea',full:true}]}],
    onSave:v=>{
      const newPrice = v.price==null||v.price===''? null : Number(v.price);
      if(p.confirmed && newPrice!==p.price){
        p.history.unshift({price:p.price, from:p.effectiveFrom||'', to:today()});
        p.confirmed=false; p.confirmedAt=''; p.effectiveFrom=v.effectiveFrom||today();
        toast('Price changed — the old price was superseded and this one needs confirming','ok');
      }
      Object.assign(p, {desc:v.desc, price:newPrice, packSize:Number(v.packSize)||0, uom:v.uom, notes:v.notes,
        effectiveFrom:v.effectiveFrom||p.effectiveFrom});
      logAudit('Price updated', p.code, newPrice==null?'cleared':money(newPrice)); save();
    }});
};
ACT['price-confirm'] = a=>{ const p=priceRow(a); if(!p) return;
  if(p.price==null||p.price===''){ toast('Enter our price before confirming it','bad'); return ACT['price-open'](a); }

ACT['rep-summary'] = ()=> formModal({title:'Customer summary report',
  fields:[{k:'customer',label:'Customer',type:'select',opts:optCustomers(),req:true,full:true},
          {k:'scope',label:'Include',type:'select',opts:[{v:'open',t:'Open orders only'},{v:'all',t:'All orders'}],def:'open',blank:false,full:true}],
  saveLabel:'Build', onSave:v=>{
    const pos=(S.pos||[]).filter(p=>p.customer===v.customer && (v.scope==='all'||(p.status!=='shipped'&&p.status!=='cancelled')));
    const body = reportHead('Order Summary','As at '+today())
     +'<div style="margin-bottom:14px"><b style="font-family:var(--disp);font-size:16px">'+esc(customerName(v.customer))+'</b>'
     +'<div style="font-size:12.5px;color:var(--muted)">'+pos.length+' order'+(pos.length===1?'':'s')+' · '
     +nf(pos.reduce((s,p)=>s+poCases(p),0))+' cases · '+money(pos.reduce((s,p)=>s+(p.value||0),0))+'</div></div>'
     + T([{h:'PO',f:p=>'<b class="mono">'+esc(p.po)+'</b><div class="sub">'+esc(ourRef(p))+'</div>'},
          {h:'PO date',c:'num',f:p=>'<span class="mono">'+esc(p.poDate)+'</span>'},
          {h:'Ship by',c:'num',f:p=>'<span class="mono">'+esc(p.shipBy)+'</span>'},
          {h:'Rev',c:'num',f:p=>p.revision?esc(p.revision):'—'},
          {h:'Products',c:'num',f:p=>nf((p.lines||[]).length)},
          {h:'Cases',c:'num',f:p=>nf(poCases(p))},
          {h:'Value',c:'num',f:p=>money(p.value)},
          {h:'Progress',f:p=>{const bs=(S.batches||[]).filter(b=>(b.pos||[]).includes(p.id));
            if(p.status==='shipped') return '<span class="tag t-ok">shipped</span>';
            if(!bs.length) return '<span class="tag t-mute">scheduled</span>';
            if(bs.every(b=>b.status==='released')) return '<span class="tag t-ok">made, ready to ship</span>';
            if(bs.some(b=>b.status==='in production')) return '<span class="tag t-info">in production</span>';
            return '<span class="tag t-mute">planned</span>';}},
          {h:'Window',f:p=>shipPill(p)}], pos)
     + (pos.filter(p=>p.customerNote).length? '<div style="margin-top:16px"><b style="font-family:var(--disp)">Special requests noted</b>'
        + pos.filter(p=>p.customerNote).map(p=>'<div class="note" style="margin-top:8px"><b class="mono">'+esc(p.po)+'</b> — '+esc(p.customerNote)+'</div>').join('')+'</div>':'')
     + '<div style="font-size:11.5px;color:var(--muted);margin-top:16px">Ship-by is '+(S.settings.defaultShipDays||30)
       +' days from the purchase order date. Issued from the HEM customer purchase order register.</div>';
    printModal('Customer summary — '+customerName(v.customer), body);
  }});
ACT['rep-podetail'] = a=>{
  const build = id=>{
    const p=byId('pos',id); if(!p) return;
    const body = reportHead('Purchase Order Detail', p.po)
     +'<dl class="dl" style="grid-template-columns:auto 1fr auto 1fr;margin-bottom:16px">'
     +'<dt>Customer</dt><dd>'+esc(customerName(p.customer))+'</dd><dt>Our reference</dt><dd class="mono">'+esc(ourRef(p))+'</dd>'
     +'<dt>PO date</dt><dd class="mono">'+esc(p.poDate)+'</dd><dt>Ship by</dt><dd class="mono">'+esc(p.shipBy)+'</dd>'
     +'<dt>Terms</dt><dd>'+esc(p.terms||'—')+'</dd><dt>Revision</dt><dd>'+esc(p.revision||'—')+'</dd>'
     +'<dt>Ship to</dt><dd style="grid-column:span 3">'+esc(p.shipTo||'—')+'</dd></dl>'
     +(p.customerNote? '<div class="note" style="margin-bottom:14px"><b>Customer request:</b> '+esc(p.customerNote)+'</div>':'')
     + T([{h:'Product',f:l=>'<b class="mono">'+esc(l.code)+'</b><div class="sub">'+esc(l.desc||product(l.code).name)+'</div>'
            +(l.note? '<div class="linenote">↳ '+esc(l.note)+'</div>':'')},
          {h:'Cases',c:'num',f:l=>nf(l.cases)},
          {h:'Pieces',c:'num',f:l=>nf(l.cases*packOf(l.code))},
          {h:'Price/cs',c:'num',f:l=>money(l.price)},
          {h:'Value',c:'num',f:l=>money(l.cases*l.price)},
          {h:'Batches',f:l=>{const bs=(S.batches||[]).filter(b=>(b.pos||[]).includes(p.id)&&b.product===l.code);
            return bs.length? bs.map(b=>'<span class="mono">'+esc(b.id)+'</span> '+b.status).join('<br>'):'not planned';}}], p.lines||[],
        {foot:['<b>Total</b>','<b>'+nf(poCases(p))+'</b>','<b>'+nf((p.lines||[]).reduce((s,l)=>s+l.cases*packOf(l.code),0))+'</b>','','<b>'+money(p.value)+'</b>','']})
     + ((p.revisions||[]).length? '<div style="margin-top:18px"><b style="font-family:var(--disp)">Revision history</b>'
        + (p.revisions||[]).map(r=>'<div class="note" style="margin-top:8px"><b>Revision '+r.revision+'</b> superseded '+esc(r.supersededAt)
          +' — '+nf(r.cases)+' cases, '+money(r.value)+(r.why? '. '+esc(r.why):'')
          +(r.changes&&r.changes.length? '<div class="sub" style="margin-top:4px">'
            +esc(r.changes.map(c=>c.code+': '+(c.type==='qty'?nf(c.from)+'→'+nf(c.to)+' cs':c.type==='price'?money(c.from)+'→'+money(c.to):c.type)).join(' · '))
            +'</div>':'')+'</div>').join('')+'</div>':'')
     + '<div style="font-size:11.5px;color:var(--muted);margin-top:16px">Production should complete by '
       + esc(new Date(new Date(p.shipBy).getTime()-(S.settings.prodBufferDays||7)*864e5).toISOString().slice(0,10))
       + ', '+(S.settings.prodBufferDays||7)+' days before the ship-by date.</div>';
    printModal('Order detail — '+p.po, body);
  };
  if(a) return build(a);
  formModal({title:'Order detail report', fields:[{k:'po',label:'Order',type:'select',opts:(S.pos||[]).map(p=>({v:p.id,t:p.po+' — '+customerName(p.customer)})),req:true,full:true}],
    saveLabel:'Build', onSave:v=>build(v.po)});
};
ACT['rep-requirement'] = ()=>{
  const dem=openDemand();
  const body = reportHead('Product Requirement','Open demand as at '+today())
   + T([{h:'Product',f:r=>'<b class="mono">'+esc(r.code)+'</b><div class="sub">'+esc(product(r.code).name)+'</div>'},
        {h:'Ordered',c:'num',f:r=>nf(r.cases)+' cs'},
        {h:'In FG',c:'num',f:r=>nf(r.onHand)+' cs'},

/* ---------- image capture ---------- */
function downscaleToJpeg(srcCanvasOrImg, w){
  const targetW = w || 1240;
  const sw = srcCanvasOrImg.width || srcCanvasOrImg.naturalWidth;
  const sh = srcCanvasOrImg.height || srcCanvasOrImg.naturalHeight;
  const scale = Math.min(1, targetW/sw);
  const c = document.createElement('canvas');
  c.width = Math.round(sw*scale); c.height = Math.round(sh*scale);
  const ctx = c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(srcCanvasOrImg, 0,0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72);
}
function imageToPageImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>res(downscaleToJpeg(im)); im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
async function pdfToPageImages(file, maxPages){
  if(typeof pdfjsLib==='undefined') throw new Error('The PDF reader did not load.');
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  const n=Math.min(pdf.numPages, maxPages||12);
  for(let i=1;i<=n;i++){
    const page=await pdf.getPage(i);
    const vp=page.getViewport({scale:1.6});
    const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    out.push(downscaleToJpeg(c));
  }
  return out;
}
function storePages(dataUris, name){
  const pages=[]; let bytes=0;
  dataUris.forEach((uri,i)=>{
    const id='IMG'+Date.now().toString(36).toUpperCase()+i;
    IMAGES[id]=uri; pages.push(id); bytes+=Math.round(uri.length*0.75);
  });
  return {pages, name:name||'', addedAt:today(), bytes};
}

/* ---------- PDF text extraction, positionally reconstructed ---------- */
async function pdfToRows(file){
  if(typeof pdfjsLib==='undefined') return {rows:[], text:'', hasText:false};
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const rows=[]; let text='';
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    if(!tc.items.length) continue;
    /* group items into visual rows by their y position, then across by x */
    const lines=new Map();
    tc.items.forEach(it=>{
      const s=(it.str||'').trim(); if(!s) return;
      text+=s+' ';
      const y=Math.round(it.transform[5]/3)*3;      // 3pt tolerance
      const x=it.transform[4];
      if(!lines.has(y)) lines.set(y,[]);
      lines.get(y).push({x, s, w:it.width||0});
    });
    [...lines.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,items])=>{
      items.sort((a,b)=>a.x-b.x);
      const cells=[]; let cur='', lastEnd=null;
      items.forEach(it=>{
        if(lastEnd!=null && it.x-lastEnd > 6){ cells.push(cur.trim()); cur=''; }
        cur += (cur?' ':'')+it.s; lastEnd = it.x + it.w;
      });
      if(cur.trim()) cells.push(cur.trim());
      if(cells.length) rows.push(cells);
    });
    text+='\n';
  }
  return {rows, text, hasText:rows.length>0};
}

/* pull header fields out of the flat text of the document */
const HDR_PATTERNS = {
  po:        [/\b(?:purchase\s*order|p\.?o\.?)\s*(?:no\.?|number|#)?\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/]{2,20})/i],
  poDate:    [/\b(?:po|order)\s*date\s*[:\-]?\s*([0-9]{1,4}[\/\-.][0-9]{1,2}[\/\-.][0-9]{2,4}|[0-9]{1,2}\s+[A-Za-z]{3,9}\s+[0-9]{4})/i,
              /\bdate\s*[:\-]?\s*([0-9]{1,4}[\/\-.][0-9]{1,2}[\/\-.][0-9]{2,4})/i],
  shipBy:    [/\b(?:ship\s*by|delivery\s*date|required\s*by|date\s*scheduled)\s*[:\-]?\s*([0-9]{1,4}[\/\-.][0-9]{1,2}[\/\-.][0-9]{2,4}|[0-9]{1,2}\s+[A-Za-z]{3,9}\s+[0-9]{4})/i],
  terms:     [/\b(?:payment\s*)?terms\s*[:\-]?\s*(NET\s*\d+|[A-Za-z0-9 ]{2,24})/i],
  fob:       [/\bf\.?o\.?b\.?\s*[:\-]?\s*([A-Za-z0-9 ,.\-]{2,40})/i],
  shipVia:   [/\bship\s*via\s*[:\-]?\s*([A-Za-z0-9 ,.\-]{2,40})/i],
  buyer:     [/\bbuyer\s*[:\-]?\s*([A-Za-z .,'\-]{2,40})/i],
  contact:   [/\bcontact\s*[:\-]?\s*([A-Za-z .,'\-@0-9]{2,40})/i]
};
function grabHeader(text, rows){
  const out={};
  Object.keys(HDR_PATTERNS).forEach(k=>{
    for(const re of HDR_PATTERNS[k]){ const m=text.match(re); if(m){ out[k]=m[1].trim(); break; } }
  });
  const st=text.match(/\bship\s*to\s*[:\-]?\s*([\s\S]{5,140}?)(?:\bbill\s*to\b|\bvendor\b|\bp\.?o\.?\s*(?:no|number|date)\b|$)/i);
  if(st) out.shipTo=st[1].replace(/\s{2,}/g,' ').trim();
  /* Positional extraction from the reconstructed table rows is far more reliable than the
     flat-text regexes above for a tabular PO — the reading order of a JasperReports-style
     document often interleaves side-by-side boxes, so a label like "Purchase Order" can sit
     nowhere near its value in the flat text even though they're clearly paired on the page.
     Wherever the row-based pass finds an answer, it overrides the flat-text guess. */
  if(rows && rows.length) Object.assign(out, grabHeaderFromRows(rows));
  /* sanity check — a PO number is always a short single token (P697, SO-1042, and so on),
     never a full sentence or a company's name. If either extraction path above landed on
     something implausible, drop it — a blank field the person fills in beats a wrong one
     they might not notice. */
  if(out.po){
    const looksWrong = /\s/.test(out.po) || out.po.length>20
      || (out.customer && out.po.toLowerCase()===out.customer.toLowerCase());
    if(looksWrong) delete out.po;
  }
  return out;
}
/* Field extraction driven by (x,y) position rather than content-stream order. Built against
   the actual Hotel Emporium PO template (JasperReports, "Order #"/"Date" box, a "Buyer /
   Payment Terms / FOB Point / Shipping Terms / Ship Via / Date Scheduled" row, Vendor: and
   Ship To: boxes side by side) but written generically off label text, not a fixed layout,
   so it should hold for other customers using a similar bordered-table PO format. */
function grabHeaderFromRows(rows){
  const out={};
  const cellText=c=>String(c||'').trim();

  /* customer name — the row that sits directly above a row containing "Billing" */
  for(let i=1;i<rows.length;i++){
    if(rows[i].some(c=>/\bbilling\b/i.test(cellText(c)))){
      const cand=rows[i-1].find(c=>{
        const t=cellText(c);
        return t && !/purchase\s*order|order\s*#|^date$|\(issued\)/i.test(t);
      });
      if(cand) out.customer=cellText(cand);
      break;
    }
  }
  /* fallback — if "Billing" wasn't found as its own cell, take the first plausible line of
     text before the "Vendor:" box; that's where a letterhead name sits on this style of PO */
  if(!out.customer){
    for(let i=0;i<rows.length;i++){
      if(rows[i].some(c=>/^vendor:?$/i.test(cellText(c)))) break;
      const cand=rows[i].find(c=>{
        const t=cellText(c);
        return t && t.length<60 && !/purchase\s*order|order\s*#|^date$|\(issued\)|^billing$/i.test(t);
      });
      if(cand){ out.customer=cellText(cand); break; }
    }
  }

  /* PO number + date — the row immediately below the "Order #" / "Date" header cells */
  for(let i=0;i<rows.length-1;i++){
    const poCol=rows[i].findIndex(c=>/\border\s*#/i.test(cellText(c)));
    if(poCol>-1){
      const dateCol=rows[i].findIndex(c=>/^date$/i.test(cellText(c)));
      const valRow=rows[i+1];
      if(valRow){
        if(valRow[poCol]) out.po=cellText(valRow[poCol]);
        if(dateCol>-1 && valRow[dateCol]) out.poDate=cellText(valRow[dateCol]);
        else if(valRow[poCol+1]) out.poDate=cellText(valRow[poCol+1]);
      }
      break;
    }
  }
  /* fallback — position-independent. A box like "Order #"/"Date" sitting right next to a
     large letterhead title can end up split across rows differently than the rest of the
     page (different font, different baseline), so the label-adjacency search above can come
     up empty even though the value is sitting right there in the text. Scan every cell for
     something shaped like this customer's PO numbers instead — a short letter+digit token,
     e.g. "P697" — skipping anything that's really a UOM like "cs24". */
  if(!out.po){
    outer: for(const row of rows){
      for(const c of row){
        const t=cellText(c);
        if(/^[A-Z]{1,4}-?\d{2,6}$/i.test(t) && !/^(cs|case|ctn|pk|box)-?\d+$/i.test(t)){ out.po=t; break outer; }
      }
    }
  }
  if(!out.poDate){
    outer2: for(const row of rows){
      for(const c of row){
        const t=cellText(c);
        if(/^\d{1,2}[\/\-][0-9]{1,2}[\/\-][0-9]{2,4}$/.test(t)){ out.poDate=t; break outer2; }
      }
    }
  }

  /* Buyer / Payment Terms / FOB Point / Shipping Terms / Ship Via / Date Scheduled row-pair */
  for(let i=0;i<rows.length-1;i++){
    const low=rows[i].map(c=>cellText(c).toLowerCase());
    if(low.some(c=>c==='buyer') && low.some(c=>c.indexOf('terms')>-1)){
      const valRow=rows[i+1];
      const idx=label=>low.findIndex(c=>c.indexOf(label)>-1);
      const map={buyer:idx('buyer'), terms:idx('payment terms'), fob:idx('fob'),
                 shipVia:idx('ship via'), shipBy:idx('date scheduled')};
      Object.keys(map).forEach(k=>{ if(map[k]>-1 && valRow[map[k]]) out[k]=cellText(valRow[map[k]]); });
      break;
    }
  }

  /* Ship To: — a column running parallel to Vendor:, matched by cell position, not by text
     that happens to follow it in reading order */
  for(let i=0;i<rows.length;i++){
    const col=rows[i].findIndex(c=>/^ship\s*to:?$/i.test(cellText(c)));
    if(col>-1){
      const parts=[];
      for(let j=i+1;j<rows.length && parts.length<5;j++){
        const cell=rows[j][col];
        if(!cell) break;
        const t=cellText(cell);
        if(!t || /^(buyer|contact\s*:)/i.test(t)) break;
        parts.push(t);
      }
      if(parts.length) out.shipTo=parts.join(', ');
      break;
    }
  }

  /* Contact: — usually its own full-width line under the Vendor box */
  for(let i=0;i<rows.length;i++){
    const c=rows[i].find(c=>/^contact\s*:/i.test(cellText(c)));
    if(c){ out.contact=cellText(c).replace(/^contact\s*:\s*/i,''); break; }
  }

  return out;
}
/* a row is a line item when it carries a code-ish cell and at least two money-ish figures.
   Rows that don't qualify but sit right under one that did are folded back into that line's
   description — a wrapped multi-line description otherwise loses everything past its first
   visual line. */
function rowsToLines(rows){
  const lines=[]; let last=null;
  const HDRWORD=/^(item|type|number|description|unit cost|qty|ordered|uom|total cost)$/i;
  rows.forEach(cells=>{
    const joined=cells.join(' ');
    if(/^(total|subtotal|grand|page|purchase order|ship to|bill to|remarks?)\b/i.test(joined)){ last=null; return; }

    if(cells.length>=3){
      const nums=cells.map(c=>({raw:c, n:toNum(c), moneyish:/[\d][\d,]*\.\d{2}\s*$/.test(c.trim())}));
      const monies=nums.filter(x=>x.moneyish);
      const codeShape=c=>/^[A-Z0-9][A-Z0-9\-\/]{3,}$/i.test(c.trim()) && /[A-Za-z]/.test(c);
      const looksLikeUom=c=>/^(cs|case|ctn|pk|box)\s*\d*$/i.test(c.trim());
      const codeCell = cells.find(c=>codeShape(c) && /\d/.test(c) && !looksLikeUom(c))
                     || cells.find(c=>codeShape(c) && !looksLikeUom(c) && !/^(purchase|sale|return)$/i.test(c.trim()));
      if(monies.length>=2 && codeCell){
        const price=monies[monies.length-2], total=monies[monies.length-1];
        const priceIdx=cells.indexOf(price.raw), totalIdx=cells.indexOf(total.raw);
        let qtyCell='', uom='';
        /* most templates carry Qty (and UOM) between the unit price and the line total —
           e.g. Unit Cost | Qty Ordered | UOM | Total Cost */
        for(let i=priceIdx+1;i<totalIdx;i++){
          const t=tidyLineCells(cells[i]);
          if(t.qty && toNum(t.qty)>0){
            qtyCell=t.qty; uom=t.uom;
            if(!uom && cells[i+1]){ const u2=tidyLineCells(cells[i+1]); if(!u2.qty && u2.uom) uom=u2.uom; }
            break;
          }
          if(!t.qty && t.uom && !uom) uom=t.uom;
        }
        /* some templates instead carry Qty before the unit price */
        if(!qtyCell){
          for(let i=priceIdx-1;i>=0;i--){
            const t=tidyLineCells(cells[i]);
            if(t.qty && toNum(t.qty)>0){
              qtyCell=t.qty; uom=uom||t.uom;
              if(!uom && cells[i+1]){ const u2=tidyLineCells(cells[i+1]); if(!u2.qty && u2.uom) uom=u2.uom; }
              break;
            }
          }
        }
        const descCell=cells.filter(c=>c!==codeCell && !/^[\d.,\s]+$/.test(c) && c!==price.raw && c!==total.raw)
                            .sort((a,b)=>b.length-a.length)[0]||'';
        const l={code:codeCell.trim(), desc:descCell.trim(), cases:toNum(qtyCell), uom,
                 price:price.n, total:total.n, note:''};
        l.packSize=packSizeFrom(uom+' '+descCell, l.code);
        lines.push(verifyLine(l));
        last=l;
        return;
      }
    }
    /* not a line-item row — fold what's left of it back into the line above.
       A code that wraps mid-token (e.g. "TG-WT-HW-" / "360ML" on separate lines because the
       Number column ran out of width) shows up here with no digit yet — the next short,
       space-free fragment completes it rather than starting the description. */
    if(last){
      const texty=cells.map(c=>c.trim()).filter(t=>t && !/^[\d.,\s]+$/.test(t) && !HDRWORD.test(t));
      if(!texty.length){ last=null; return; }
      let idx=0;
      if(!/\d/.test(last.code) && !/\s/.test(texty[0]) && texty[0].length<=12){ last.code+=texty[0]; idx=1; }
      const rest=texty.slice(idx);
      if(rest.length===1 && rest[0].length<=80) last.desc=(last.desc+' '+rest[0]).trim();
      else if(rest.length>0) last=null;
    }
  });
  return lines;
}

/* ---------- delimited paste / CSV file ---------- */
function rowsFromDelimited(text){ return splitRows(text.trim(), detectSep(text)); }
function pendingFromRows(rows, srcName){
  const parsed = parseOrderPaste(rows.map(r=>r.map(c=>String(c).replace(/"/g,'""')).map(c=>/[",\n]/.test(c)?'"'+c+'"':c).join(',')).join('\n'));
  if(parsed.error) return null;
  const o=parsed.orders[0];
  return {po:o.po, customer:o.customer, customerRaw:o.customerRaw,
          /* a paste with no date column must not silently move the order's dates to today —
             leave them blank so a revision keeps the ones already on file */
          poDate:o.poDateFound? o.poDate:'', shipBy:o.shipByFound? o.shipBy:'',
          terms:o.terms, shipTo:o.shipTo, customerNote:'', notes:'', source:srcName||'Paste',
          lines:o.lines.map(l=>({code:l.code, desc:l.desc||'', itemNo:l.itemNo||'', cases:l.cases, price:l.price,
            total:l.total||+(l.cases*l.price).toFixed(2), uom:l.uom||'', note:l.note||'',
            packSize:l.packSize||0, qtyFixed:l.qtyFixed, qtyWas:l.qtyWas}))};
}

/* Files are filed FIRST, so a PDF with no text layer still keeps its picture. */
async function handleFiles(files){
  const pdfs=files.filter(f=>/\.pdf$/i.test(f.name));
  const imgs=files.filter(f=>/^image\//.test(f.type));
  const data=files.filter(f=>/\.(csv|txt)$/i.test(f.name));
  let copy=null, extracted=null, warn='';
  const readerReady = (typeof pdfjsLib!=='undefined');
  toast('Reading '+files.length+' file'+(files.length>1?'s':'')+'…');
  try{
    if(pdfs.length && !readerReady){
      warn='The PDF reader could not load in this view, so neither the text nor a picture of the pages could be taken from '
          +pdfs[0].name+'. Save the PO as an image and attach that, then enter the lines below.';
    }
    else if(pdfs.length){
      try{ copy=storePages(await pdfToPageImages(pdfs[0]), pdfs[0].name); }
      catch(e){ warn='The PDF pages could not be rendered, so no copy was filed ('+e.message+'). Attach a screenshot of the order instead.'; }
      try{
        const {rows,text,hasText}=await pdfToRows(pdfs[0]);
        if(hasText){
          const hdr=grabHeader(text, rows), lines=rowsToLines(rows);
          const cm=matchCustomer(hdr.customer);
          extracted={po:hdr.po||'', customer:cm.code, customerRaw:hdr.customer||'', newCustomer:cm.created?cm:null,
            poDate:hdr.poDate?normDate(hdr.poDate):today(),
            shipBy:hdr.shipBy?normDate(hdr.shipBy):'', terms:hdr.terms||'', shipTo:hdr.shipTo||'',
            buyer:hdr.buyer||'', contact:hdr.contact||'', fob:hdr.fob||'', shipVia:hdr.shipVia||'',
            customerNote:'', notes:'', source:'PDF — '+pdfs[0].name, lines};
          if(!lines.length) warn='The PDF has a text layer but no line items could be recognised in it. Check the lines below.';
        } else {
          warn='This PDF has no text layer — every character is artwork, so nothing can be extracted from it. '
             +(copy? 'The picture has been filed; enter the lines below.' : 'Enter the lines below.')
             +' This is what "Microsoft Print to PDF" produces; ask the customer to use Export → PDF, or to send CSV, and uploads become one click permanently.';
        }
      }catch(e){ warn='Could not read the PDF text ('+e.message+'). '+(copy?'The copy is filed; ':'')+'Enter the lines below.'; }
    }
    if(imgs.length && !copy){
      const pages=[]; for(const f of imgs) pages.push(await imageToPageImage(f));
      copy=storePages(pages, imgs[0].name);
      if(!extracted) warn='An image cannot be read automatically. The copy is filed; enter the lines below.';
    }
    if(data.length && !extracted){
      const text=await data[0].text();
      extracted=pendingFromRows(rowsFromDelimited(text), 'File — '+data[0].name);
      if(!extracted) warn='No PO number column found in '+data[0].name+'.';
    }
  }catch(e){ warn='Could not read that file: '+e.message; }

  PENDING = extracted || {po:'', customer:'', poDate:today(), shipBy:'', terms:'', shipTo:'',
    customerNote:'', notes:'', source:(files[0]&&files[0].name)||'Upload',
    lines:[{code:'',desc:'',cases:0,price:0,total:0,uom:'',note:'',packSize:0}]};
  if(copy) PENDING.copy=copy;
  PENDING.warn=warn;
  openReview();
}

   +'<td>'+f('desc')+'</td>'

   +'<td>'+f('uom','wnarrow')+'</td>'

   +'<td class="num">'+f('price','wnarrow','number')+'</td>'

   +'<td>'+f('note')+'</td>'
