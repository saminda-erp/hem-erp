function openReview(){
  const p=PENDING; if(!p) return;
  const existing=(S.pos||[]).find(x=>String(x.po).toLowerCase()===String(p.po||'').toLowerCase() && p.po);
  /* a revision often arrives as a bare line list — show the header we already hold for this
     PO rather than a screen of blanks the user has to retype */
  if(existing) ['customer','poDate','shipBy','terms','shipTo','buyer','contact','fob','shipVia','customerNote','notes']
    .forEach(k=>{ if(!p[k] && existing[k]) p[k]=existing[k]; });
  const fixed=(p.lines||[]).filter(l=>l.qtyFixed);
  const totalCases=(p.lines||[]).reduce((s,l)=>s+toNum(l.cases),0);
  const totalValue=(p.lines||[]).reduce((s,l)=>s+(toNum(l.total)||toNum(l.cases)*toNum(l.price)),0);

  let body='';
  if(p.warn) body+='<div class="banner warn"><b>Read this before you save.</b> '+esc(p.warn)+'</div>';
  if(fixed.length) body+='<div class="banner info"><b>'+fixed.length+' quantity corrected against the order\'s own arithmetic.</b> '
    +esc(fixed.map(l=>l.code+': '+nf(l.qtyWas)+' → '+nf(l.cases)).join(' · '))
    +'. The line total printed on the PO divided by the case price is the reliable figure — check these before saving.</div>';
  if(p.copy) body+='<div class="banner info"><b>Customer copy filed</b> — '+p.copy.pages.length+' page'
    +(p.copy.pages.length>1?'s':'')+' from '+esc(p.copy.name||'the upload')+'. '+btn('View','copy-view-pending')+'</div>';

  if(existing){
    const changes=diffLines(existing.lines, p.lines);
    body+='<div class="banner warn"><b>PO '+esc(p.po)+' is already on the register.</b> '
      +(changes.length? 'This version differs — the comparison is below.' : 'No line differences were found.')+'</div>';
    if(changes.length){
      body+='<div class="diffbox"><div class="diffhd">What changed against the version on file</div>'

function nextPrId(){ const n=(S.prs||[]).map(p=>parseInt((p.id||'').replace('PR-',''))||0);
  return 'PR-'+String(n.length?Math.max(...n)+1:1).padStart(4,'0'); }

/* "Create Purchase Requisition" from a material shortage row — every figure is pre-filled
   from materialAvailability(), never re-typed or re-derived by hand */
ACT['pr-new'] = a=>{

  formModal({title:'New purchase requisition — '+a, wide:true,
    intro:'Needed for: '+esc((row.breakdown||[]).map(b=>b.po+' ('+b.product+') — '+nf(b.qty,2)+' '+row.uom).join('; ')||'—'),
    values:{material:a, desc:m.name, qty:row.netShortage||0, uom:row.uom, requiredBy:row.requiredBy||today(),
      currentStock:row.released, incomingStock:row.incoming, netShortage:row.netShortage,
      preferredSupplier:m.supplier||'', notes:''},
    groups:[{fields:[
      {k:'material',label:'Material code',req:true},{k:'desc',label:'Description',full:true},
      {k:'qty',label:'Required quantity',type:'number',req:true},{k:'uom',label:'UOM'},
      {k:'requiredBy',label:'Required-by date',type:'date'},
      {k:'currentStock',label:'Current stock',type:'number'},{k:'incomingStock',label:'Incoming stock',type:'number'},
      {k:'netShortage',label:'Net shortage',type:'number'},
      {k:'preferredSupplier',label:'Preferred supplier',type:'select',opts:optSuppliers()},
      {k:'notes',label:'Notes',type:'textarea',full:true}]}],
    onSave:v=>{
      if(!v.material||!v.qty) return toast('Material and quantity are required','bad');
      const relatedPos=[...new Set((row.breakdown||[]).map(b=>b.po))];
      const relatedProducts=[...new Set((row.breakdown||[]).map(b=>b.product))];

      S.prs.push(pr);

};

ACT['spo-save']=()=>{
  const s=readSpoEditor();
  if(!s.supplier) return toast('Supplier is required','bad');
  if(!(s.lines||[]).length) return toast('Add at least one line','bad');
  const isNew=!s.id;
  const original = isNew? null : byId('spos', s.id);
  /* delivery-date changes are never silently overwritten — previous date, new date, who and
     why are kept on the line itself */
  if(original){
    const changedLines=[];
    s.lines.forEach((l,i)=>{
      const prevLine=original.lines[i];
      if(prevLine && prevLine.code===l.code && prevLine.expectedDelivery && l.expectedDelivery && prevLine.expectedDelivery!==l.expectedDelivery)
        changedLines.push({i, from:prevLine.expectedDelivery, to:l.expectedDelivery});
    });
    if(changedLines.length){
      if(!String(s._dateChangeReason||'').trim()) return toast('A reason is required for the delivery date change on '+changedLines.map(c=>s.lines[c.i].code).join(', '),'bad');
      changedLines.forEach(c=>{
        const l=s.lines[c.i];
        l.deliveryHistory=(original.lines[c.i].deliveryHistory||[]).slice();
        l.deliveryHistory.push({from:c.from, to:c.to, changedAt:today(), changedBy:UI.user||'SS', reason:s._dateChangeReason.trim()});
      });
      logAudit('Supplier PO delivery date changed', s.id, changedLines.map(c=>c.i+':'+c.from+'→'+c.to).join('; ')+' — '+s._dateChangeReason.trim());
    }
  }
  delete s._dateChangeReason;
  if(isNew) s.id=nextSpoId();
  const idx=(S.spos||[]).findIndex(x=>x.id===s.id);
  if(idx>-1) S.spos[idx]=s; else S.spos.push(s);
  if(isNew && (s.relatedPrs||[]).length) s.relatedPrs.forEach(prId=>{ const pr=byId('prs',prId); if(pr) pr.status='Converted'; });
  logAudit(isNew?'Supplier PO created':'Supplier PO updated', s.id, s.supplier+' — '+(s.lines||[]).length+' line(s)');
  save(); toast(s.id+' saved','ok'); closeModal(); render();
};

}
ACT['bom-bulk-add']=()=>{ readBomEditor(); PENDING_BOM.bulk.push({phase:'',code:'',fn:'',pct:0,lossPct:0,notes:''}); openBomEditor(); };
ACT['bom-bulk-del']=a=>{ readBomEditor(); PENDING_BOM.bulk.splice(+a,1); openBomEditor(); };
ACT['bom-pkg-add'] =()=>{ readBomEditor(); PENDING_BOM.packaging.push({code:'',desc:'',type:'Bottle',qtyPerUnit:0,qtyPerCase:0,wastagePct:0}); openBomEditor(); };
ACT['bom-pkg-del'] =a=>{ readBomEditor(); PENDING_BOM.packaging.splice(+a,1); openBomEditor(); };
ACT['bom-new'] = a=>{
  const code=a||''; const p=code?byId('products',code,'code'):null;
  const existingRevs=code?bomsFor(code):[];
  const nextRev=existingRevs.length?(existingRevs[0].revision||0)+1:1;
  PENDING_BOM={code, revision:nextRev, status:'draft', mfgType:(p&&p.mfgType)||'Liquid',
    effectiveDate:today(), batchSize:0, batchUom:'kg', standardOutput:0,
    fillSize:(p&&p.fill)||0, fillUom:(p&&p.fillUom)||'', density:(p&&p.density)||1,
    createdBy:UI.user||'SS', reviewedBy:'', approvedBy:'', approvedAt:'',
    sourceDoc:'', sourceLink:'', notes:'', bulk:[], packaging:[]};
  openBomEditor();
};
ACT['bom-open'] = a=>{ const b=(S.boms||[]).find(x=>x.id===a); if(!b) return;
  if(b.status!=='draft') return ACT['bom-view'](a);
  PENDING_BOM=clone(b); openBomEditor();
};
ACT['bom-revise'] = a=>{
  const cur=approvedBom(a); if(!cur) return toast('No approved BOM on file to revise','bad');
  PENDING_BOM=clone(cur); PENDING_BOM.revision=(cur.revision||0)+1; PENDING_BOM.status='draft';
  PENDING_BOM.approvedBy=''; PENDING_BOM.approvedAt=''; PENDING_BOM.createdBy=UI.user||'SS';
  delete PENDING_BOM.id;
  openBomEditor();
};
function bomReadOnlyHtml(b){
  const p=byId('products',b.code,'code');
  return '<dl class="dl" style="grid-template-columns:auto 1fr auto 1fr;margin-bottom:14px">'
   +'<dt>Product</dt><dd>'+esc(p?p.name:b.code)+'</dd><dt>Type</dt><dd>'+esc(b.mfgType||'—')+'</dd>'
   +'<dt>Batch size</dt><dd class="mono">'+nf(b.batchSize)+' '+esc(b.batchUom||'')+'</dd><dt>Fill</dt><dd class="mono">'+nf(b.fillSize)+' '+esc(b.fillUom||'')+'</dd>'
   +'<dt>Approved by</dt><dd>'+esc(b.approvedBy||'—')+'</dd><dt>Approved on</dt><dd class="mono">'+esc(b.approvedAt||'—')+'</dd>'
   +'<dt>Source</dt><dd style="grid-column:span 3">'+esc(b.sourceLink||'—')+'</dd></dl>'
   +'<h4 style="font-size:13px;margin-bottom:6px">A — Bulk / raw material</h4>'
   +T([{h:'Phase',f:it=>esc(it.phase)},{h:'Code',f:it=>'<span class="mono">'+esc(it.code)+'</span>'},{h:'Function',f:it=>esc(it.fn)},
       {h:'%',c:'num',f:it=>nf(it.pct,2)},
       {h:'Qty (std batch)',c:'num',f:it=>nf((Number(b.batchSize)||0)*(Number(it.pct)||0)/100,2)},
       {h:'Loss %',c:'num',f:it=>nf(it.lossPct||0,1)}], b.bulk||[], {empty:'No bulk lines.'})
   +'<div style="height:14px"></div><h4 style="font-size:13px;margin-bottom:6px">B — Packaging</h4>'
   +T([{h:'Code',f:it=>'<span class="mono">'+esc(it.code)+'</span>'},{h:'Description',f:it=>esc(it.desc)},{h:'Type',f:it=>esc(it.type)},
       {h:'Qty/unit',c:'num',f:it=>nf(it.qtyPerUnit||0,3)},{h:'Qty/case',c:'num',f:it=>nf(it.qtyPerCase||0,2)},{h:'Wastage %',c:'num',f:it=>nf(it.wastagePct||0,1)}],
      b.packaging||[], {empty:'No packaging lines.'});
}
ACT['bom-view'] = a=>{ const b=(S.boms||[]).find(x=>x.id===a); if(!b) return;
  modal('BOM '+esc(b.code)+' rev '+b.revision, bomReadOnlyHtml(b)+'<div style="margin-top:6px">'+tag(b.status)+'</div>',
    b.status==='approved'? btn('Create next revision','bom-revise',b.code,'btn primary') : '', true);
};
ACT['bom-save'] = ()=>{
  const b=readBomEditor();
  if(!String(b.code||'').trim()) return toast('Product code is required','bad');
  b.id=b.code+'-r'+b.revision;
  const idx=(S.boms||[]).findIndex(x=>x.id===b.id);
  if(idx>-1) S.boms[idx]=b; else S.boms.push(b);
  logAudit('BOM saved as draft', b.id, b.code+' rev '+b.revision);
  save(); toast('Saved as draft — approve it before production planning can use it','ok'); closeModal(); render();
};
ACT['bom-approve'] = ()=>{
  const b=readBomEditor();
  if(!String(b.code||'').trim()) return toast('Product code is required','bad');
  if(!(b.bulk||[]).length && !(b.packaging||[]).length) return toast('Add at least one line before approving','bad');
  b.id=b.code+'-r'+b.revision;
  const prevApproved=approvedBom(b.code);
  if(prevApproved && prevApproved.id!==b.id) prevApproved.status='obsolete';
  b.status='approved'; b.approvedBy=UI.user||'SS'; b.approvedAt=today();
  const idx=(S.boms||[]).findIndex(x=>x.id===b.id);
  if(idx>-1) S.boms[idx]=b; else S.boms.push(b);
  logAudit('BOM approved', b.id, b.code+' rev '+b.revision+(prevApproved?' — supersedes rev '+prevApproved.revision:''));
  save(); toast(b.code+' BOM rev '+b.revision+' approved','ok'); closeModal(); render();
};

function pendingToPo(p){
  return {po:String(p.po).trim(), customer:p.customer||'', poDate:p.poDate||today(),
    shipBy:p.shipBy|| new Date(new Date(p.poDate||today()).getTime()+(S.settings.defaultShipDays||30)*864e5).toISOString().slice(0,10),
    terms:p.terms||'', shipTo:p.shipTo||'', buyer:p.buyer||'', contact:p.contact||'', fob:p.fob||'', shipVia:p.shipVia||'',
    customerNote:p.customerNote||'', notes:p.notes||'', source:p.source||'',
    lines:(p.lines||[]).filter(l=>l.code).map(l=>({code:String(l.code).trim(), desc:l.desc||'', cases:toNum(l.cases),
      price:toNum(l.price), total:toNum(l.total)||+(toNum(l.cases)*toNum(l.price)).toFixed(2),
      uom:l.uom||'', packSize:toNum(l.packSize)||packSizeFrom(l.uom||'',l.code), note:l.note||''})),
    value:(p.lines||[]).reduce((s,l)=>s+(toNum(l.total)||toNum(l.cases)*toNum(l.price)),0)};
}
/* a revision often arrives as a bare line list — never let a blank wipe a field we already hold */
function carryForward(target, prev){
  ['customer','buyer','shipTo','contact','terms','fob','shipVia','customerNote','notes','copyLink','poDate','shipBy','source']
    .forEach(k=>{ if(!target[k] && prev[k]) target[k]=prev[k]; });
  return target;
}
function validatePending(){
  const p=readReview();
  if(!String(p.po||'').trim()) return toast('A PO number is required','bad');
  const prior=(S.pos||[]).find(x=>String(x.po).toLowerCase()===String(p.po).toLowerCase());
  if(!p.customer && prior) p.customer=prior.customer;   // a revision inherits the customer on file
  if(!p.customer) return toast('Pick the customer','bad');
  if(!(p.lines||[]).some(l=>l.code)) return toast('At least one line with a product code is required','bad');
  return true;
}
ACT['po-save'] = ()=>{
  if(validatePending()!==true) return;
  const p=PENDING, rec=pendingToPo(p);
  rec.id='PO-'+rec.po; rec.status='planned'; rec.revision=0; rec.revisions=[];
  if(p.copy) rec.copy=p.copy;
  S.pos.push(rec); newPriceRows(rec);
  (rec.lines||[]).forEach(l=>{ if(!byId('products',l.code,'code'))
    S.products.push({code:l.code, name:l.desc||l.code, customer:rec.customer, formula:'', packSize:l.packSize||0,
      uom:l.uom||'', fill:0, fillUom:'ml', shelfLife:24, npra:'', npraExp:'', fdaListing:'', status:'active'}); });
  logAudit('Order received', rec.id, rec.po+' · '+nf(rec.lines.length)+' lines · '+money(rec.value));
  PENDING=null; save(); closeModal(); render(); renderNav();
  toast(rec.po+' saved to the register','ok');
};
ACT['po-save-rev'] = ()=>{
  if(validatePending()!==true) return;
  const p=PENDING, prev=(S.pos||[]).find(x=>String(x.po).toLowerCase()===String(p.po).toLowerCase());
  if(!prev) return ACT['po-save']();
  const rec=carryForward(pendingToPo(p), prev);
  const changes=diffLines(prev.lines, rec.lines);
  prev.revisions=prev.revisions||[];
  prev.revisions.unshift({revision:prev.revision||0, supersededAt:today(), poDate:prev.poDate,
    lines:clone(prev.lines), value:prev.value, cases:(prev.lines||[]).reduce((s,l)=>s+toNum(l.cases),0),
    copy:prev.copy?clone(prev.copy):null, customerNote:prev.customerNote||'', changes,
    why:(document.querySelector('#modal-root [data-h="why"]')||{}).value||''});
  Object.assign(prev, rec);
  prev.revision=(prev.revision||0)+1; prev.revisedAt=today();
  if(p.copy) prev.copy=p.copy;
  newPriceRows(prev);
  logAudit('Order revised', prev.id, prev.po+' rev '+prev.revision+' · '+changes.length+' change'+(changes.length===1?'':'s'));
  PENDING=null; save(); closeModal(); render(); renderNav();
  toast(prev.po+' saved as revision '+prev.revision,'ok');
};
ACT['po-save-fix'] = ()=>{
  if(validatePending()!==true) return;
  const p=PENDING, prev=(S.pos||[]).find(x=>String(x.po).toLowerCase()===String(p.po).toLowerCase());
  if(!prev) return ACT['po-save']();
  Object.assign(prev, carryForward(pendingToPo(p), prev));
  if(p.copy) prev.copy=p.copy;
  newPriceRows(prev);
  logAudit('Order corrected', prev.id, prev.po+' (no revision recorded)');
  PENDING=null; save(); closeModal(); render(); renderNav();
  toast(prev.po+' corrected','ok');
};

/* ---------- filed copies ---------- */
ACT['copy-attach-pending'] = ()=>{ readReview(); pickCopy(null); };
ACT['copy-attach'] = a=>pickCopy(a);
function pickCopy(poId){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.pdf,image/*'; inp.multiple=true;
  inp.onchange=async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    toast('Filing the copy…');
    try{
      let pages=[];
      for(const f of files){
        if(/\.pdf$/i.test(f.name)) pages=pages.concat(await pdfToPageImages(f));
        else pages.push(await imageToPageImage(f));
      }
      const copy=storePages(pages, files[0].name);
      if(poId){ const po=byId('pos',poId); if(po){ po.copy=copy; logAudit('PO copy filed', po.id, po.po); save(); render(); } }
      else { PENDING.copy=copy; openReview(); }
      toast(pages.length+' page'+(pages.length>1?'s':'')+' filed','ok');
    }catch(err){ toast('Could not file that copy: '+err.message,'bad'); }
  };
  inp.click();
}
ACT['copy-view-pending'] = ()=>{ VIEWER={pending:true, page:0}; drawViewer(); };
ACT['copy-view'] = a=>{ VIEWER={poId:a, page:0}; drawViewer(); };
function drawViewer(){
  const v=VIEWER; if(!v) return;
  const copy = v.pending? (PENDING&&PENDING.copy) : ((byId('pos',v.poId)||{}).copy);
  if(!copy||!copy.pages.length) return toast('No copy is filed for this order','bad');
  const uri=IMAGES[copy.pages[v.page]];
  modal('Customer copy'+(v.pending?'':' — '+esc((byId('pos',v.poId)||{}).po)),
    '<div class="stage">'+(uri? '<img src="'+uri+'" alt="Filed purchase order, page '+(v.page+1)+'">'
      : '<div style="color:#bbb;padding:30px">That page is no longer stored.</div>')+'</div>'
    +(copy.pages.length>1? '<div class="pagestrip">'+copy.pages.map((_,i)=>
        '<button class="'+(i===v.page?'on':'')+'" data-act="copy-page" data-arg="'+i+'" type="button">'+(i+1)+'</button>').join('')+'</div>':'')
    +'<div class="sub" style="text-align:center;margin-top:9px;color:var(--muted)">'
    +esc(copy.name||'')+' · filed '+esc(copy.addedAt||'')+' · '+nf(Math.round((copy.bytes||0)/1024))+' KB</div>',
    (v.pending?'':btn('Replace','copy-attach',v.poId)+btn('Remove','copy-remove',v.poId,'btn danger'))
    +btn('Download this page','copy-download',null,'btn'), true);
}
ACT['copy-page'] = a=>{ VIEWER.page=+a; drawViewer(); };
ACT['copy-download'] = ()=>{ const v=VIEWER; if(!v) return;
  const copy = v.pending? (PENDING&&PENDING.copy) : ((byId('pos',v.poId)||{}).copy);
  const uri=IMAGES[copy.pages[v.page]]; if(!uri) return;
  const bin=atob(uri.split(',')[1]); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  download('po-copy-p'+(v.page+1)+'.jpg', new Blob([arr],{type:'image/jpeg'}));
};
ACT['copy-remove'] = a=>{ const po=byId('pos',a); if(!po) return;
  po.copy=null; logAudit('PO copy removed', po.id, po.po); save(); closeModal(); render(); toast('Copy removed','ok'); };

/* ---------- revisions ---------- */
ACT['po-revisions'] = a=>{
  const po=byId('pos',a); if(!po) return;
  const revs=po.revisions||[];
  modal('Revision history — '+esc(po.po),
    '<dl class="dl" style="margin-bottom:14px"><dt>Current</dt><dd>revision <b class="mono">'+(po.revision||0)+'</b>'
    +(po.revisedAt?' · revised '+esc(po.revisedAt):'')+' · '+nf(poCases(po))+' cases · '+money(po.value)+'</dd></dl>'
    + (revs.length? revs.map(r=>'<div class="diffbox"><div class="diffhd">Revision '+r.revision
        +' · superseded '+esc(r.supersededAt)+' · '+nf(r.cases)+' cases · '+money(r.value)
        +(r.why?' · '+esc(r.why):'')+'</div>'
        + (r.changes||[]).map(c=>'<div class="diffrow"><span class="dk"><span class="tag '
            +(c.type==='added'?'t-ok':c.type==='removed'?'t-bad':'t-warn')+'">'+esc(c.type)+'</span></span>'
            +'<span class="mono" style="width:170px;flex:none">'+esc(c.code)+'</span><span>'
            +(c.type==='added'? 'added, '+nf(c.to)+' cases'
              : c.type==='removed'? 'removed, was '+nf(c.from)+' cases'
              : c.type==='price'? '<span class="was">'+money(c.from)+'</span> → <span class="now">'+money(c.to)+'</span>'
              : '<span class="was">'+nf(c.from)+' cs</span> → <span class="now">'+nf(c.to)+' cs</span>')+'</span></div>').join('')
        + (r.copy&&r.copy.pages&&r.copy.pages.length? '<div class="diffrow"><span class="dk"></span><span>'
            +'This version keeps its own filed copy, '+r.copy.pages.length+' page'+(r.copy.pages.length>1?'s':'')+'.</span></div>':'')
        +'</div>').join('')
      : '<div class="empty"><b>No revisions</b>This order has not been reissued.</div>'), '', true);
};

/* ---------- the figures audit ---------- */
ACT['fig-audit'] = ()=>{
  const issues=arithmeticIssues();
  modal('Check these figures',
    '<div class="note" style="margin-bottom:12px">A purchase order states its own arithmetic. Where <b>cases × case price</b> does not equal the line total printed on the order, the printed total is the figure to trust — usually the quantity was misread when the order was captured.</div>'
    + T([{h:'PO',f:r=>'<b class="mono">'+esc(r.po)+'</b>'},
         {h:'Product',f:r=>'<span class="mono">'+esc(r.code)+'</span>'},
         {h:'Cases now',c:'num',f:r=>'<span style="color:var(--bad)">'+nf(r.cases)+'</span>'},
         {h:'Price/cs',c:'num',f:r=>money(r.price)},
         {h:'Line total',c:'num',f:r=>money(r.total)},
         {h:'Cases should be',c:'num',f:r=>'<b>'+nf(r.should)+'</b>'},
         {h:'',f:r=>btn('Fix','fig-fix',r.poId+'::'+r.idx)}], issues,
        {emptyTitle:'Every line agrees', empty:'Cases × price equals the printed line total on every order.'}),
    issues.length? btn('Fix all '+issues.length,'fig-fix-all',null,'btn primary'):'', true);
};
ACT['fig-fix'] = a=>{ const [poId,idx]=a.split('::'); const po=byId('pos',poId); if(!po) return;
  const l=po.lines[+idx]; l.cases=Math.round(toNum(l.total)/toNum(l.price));
  po.value=(po.lines||[]).reduce((s,x)=>s+(toNum(x.total)||toNum(x.cases)*toNum(x.price)),0);
  logAudit('Quantity corrected', po.id, po.po+' · '+l.code+' → '+nf(l.cases)+' cases');
  save(); ACT['fig-audit'](); render(); };
ACT['fig-fix-all'] = ()=>{ arithmeticIssues().forEach(r=>{ const po=byId('pos',r.poId);
    const l=po.lines[r.idx]; l.cases=r.should;
    po.value=(po.lines||[]).reduce((s,x)=>s+(toNum(x.total)||toNum(x.cases)*toNum(x.price)),0); });
  logAudit('Quantities corrected','register','arithmetic audit, fix all');
  save(); closeModal(); render(); toast('Every flagged line corrected','ok'); };

</script>
