<html lang="en">

<style>
:root{
  --ground:#F6F2F1; --surface:#FFFFFF; --surface2:#FBF8F7; --sunk:#F0EAE9;
  --line:#E4DAD9; --line2:#EFE8E7;
  --ink:#241A1E; --ink2:#5C4B51; --muted:#8A767C;
  --wine:#522B39; --wine2:#6E3B4D; --wine-soft:#F3EAEC; --brass:#9C7434; --brass-soft:#F6EFE2;
  --ok:#2E6F4E; --ok-bg:#E7F0EB; --ok-line:#BCD6C7;
  --warn:#9A6A15; --warn-bg:#F8F0DE; --warn-line:#E4CE9C;
  --bad:#A32E2E; --bad-bg:#F8EAEA; --bad-line:#E3BDBD;
  --info:#39537F; --info-bg:#E9EEF6; --info-line:#C2CFE3;
  --r:3px; --on-wine:#FFFFFF;
  --sh:0 1px 2px rgba(36,26,30,.06), 0 8px 24px -12px rgba(36,26,30,.18);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#151013; --surface:#1E1719; --surface2:#241B1E; --sunk:#120D0F;
  --line:#392C30; --line2:#2B2124;
  --ink:#F2E9E9; --ink2:#CBB8BD; --muted:#98868B;
  --wine:#D9A0B2; --wine2:#EBBDCB; --wine-soft:#33222A; --brass:#CCA263; --brass-soft:#2E2519;
  --ok:#77C49A; --ok-bg:#17281F; --ok-line:#2C4838;
  --warn:#DCAA4A; --warn-bg:#2A2113; --warn-line:#4A3A1C;
  --bad:#E88C8C; --bad-bg:#2C1B1B; --bad-line:#4C2C2C;
  --info:#9AB8E2; --info-bg:#1A2231; --info-line:#31405A;
  --on-wine:#231419;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#151013; --surface:#1E1719; --surface2:#241B1E; --sunk:#120D0F;
  --line:#392C30; --line2:#2B2124;
  --ink:#F2E9E9; --ink2:#CBB8BD; --muted:#98868B;
  --wine:#D9A0B2; --wine2:#EBBDCB; --wine-soft:#33222A; --brass:#CCA263; --brass-soft:#2E2519;
  --ok:#77C49A; --ok-bg:#17281F; --ok-line:#2C4838;
  --warn:#DCAA4A; --warn-bg:#2A2113; --warn-line:#4A3A1C;
  --bad:#E88C8C; --bad-bg:#2C1B1B; --bad-line:#4C2C2C;
  --info:#9AB8E2; --info-bg:#1A2231; --info-line:#31405A;
  --on-wine:#231419;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:600;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--wine)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
#rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-bottom:24px}
.brandbox{padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center;position:sticky;top:0;background:var(--surface);z-index:3}
.crest{width:38px;height:38px;flex:none;display:grid;place-items:center;position:relative}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.brandbox b{display:block;font-family:var(--disp);font-size:15px;font-weight:600;line-height:1.15;color:var(--ink)}
.brandbox span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.navgroup{padding:16px 16px 5px;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.navgroup::after{content:"";flex:1;height:1px;background:var(--brass);opacity:.28}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:6px 16px 6px 14px;cursor:pointer;color:var(--ink2);font-size:13.5px;line-height:1.3}
.navitem:hover{background:var(--surface2);color:var(--ink)}
.navitem.on{background:var(--wine-soft);border-left-color:var(--wine);color:var(--wine);font-weight:600}
.navitem .step{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:16px;flex:none}
.navitem.on .step{color:var(--wine)}
.navitem .navicon{flex:none;width:16px;height:16px;color:var(--muted);display:flex}
.navitem .navicon svg{width:100%;height:100%}
.navitem.on .navicon{color:var(--wine)}
.navitem.hasicon .step{width:auto;margin-right:1px}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:0 6px}
.navitem.on .cnt{background:var(--surface);color:var(--wine)}
.navitem .cnt.alert{background:var(--bad-bg);color:var(--bad)}

#main{min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
#topbar .eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:600}
#topbar h1{font-size:23px;margin-top:2px}
#topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:62ch}
.topacts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#view{padding:22px 26px 80px;min-width:0}
.section{margin-bottom:26px}
.section>h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.section>h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--wine);color:var(--wine)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.btn.primary:hover{background:var(--wine2);border-color:var(--wine2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--wine);outline:none;box-shadow:0 0 0 3px var(--wine-soft)}
textarea{resize:vertical;min-height:64px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filterbar input,.filterbar select{width:auto;min-width:130px}
.filterbar .grow{flex:1;min-width:180px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}

/* ---------- cards / kpis ---------- */
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--brass);opacity:.5}
.kpi.ok::before{background:var(--ok);opacity:1}.kpi.warn::before{background:var(--warn);opacity:1}
.kpi.bad::before{background:var(--bad);opacity:1}.kpi.info::before{background:var(--info);opacity:1}
.kpi .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px}

/* department cards (dashboard) */
.deptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
@media(min-width:1400px){.deptgrid{grid-template-columns:repeat(5,1fr)}}
.deptcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.deptcard:hover,.deptcard:focus-visible{border-color:var(--wine);background:var(--wine-soft);outline:none}
.deptcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.deptnum{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.05em}
.deptcard-top svg{width:22px;height:22px;color:var(--wine);transition:transform .15s}
.deptcard:hover .deptcard-top svg{transform:translateY(-1px)}
.deptname{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:4px}
.deptdesc{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:10px;min-height:32px}
.deptstat{font-size:12px;color:var(--ink2);font-weight:500}
.deptstat.muted{color:var(--muted);font-weight:400}
.deptopen{font-size:11.5px;color:var(--wine);margin-top:10px;display:flex;align-items:center;gap:4px;font-weight:500}
.deptopen .arrow{transition:transform .15s;display:inline-block}
.deptcard:hover .deptopen .arrow{transform:translateX(2px)}

/* department hub landing pages (Store, Quality Control) */
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.hubcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  cursor:pointer;transition:border-color .15s,background .15s}
.hubcard:hover{border-color:var(--wine);background:var(--wine-soft)}
.hubname{font-family:var(--disp);font-weight:600;font-size:15px;margin-bottom:4px;color:var(--ink)}
.hubdesc{font-size:12.5px;color:var(--muted);line-height:1.4;margin-bottom:8px}
.hubstat{font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:6px}

/* placeholder department page */
.placeholder-dept{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);
  padding:40px 24px;text-align:center;color:var(--muted)}
.placeholder-dept h3{font-family:var(--disp);color:var(--ink);margin-bottom:8px;font-size:16px}
.placeholder-dept p{max-width:480px;margin:0 auto;line-height:1.5;font-size:13px}

/* connected process-flow row */
.flowrow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.flownode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 10px;min-width:100px;flex:1;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s}
.flownode:hover{border-color:var(--wine);background:var(--wine-soft)}
.flownum{font-family:var(--mono);font-size:10px;color:var(--brass)}
.flowlabel{font-size:11.5px;color:var(--ink2);margin-top:4px;font-weight:500;white-space:nowrap}
.flowval{font-family:var(--mono);font-size:20px;margin-top:4px;color:var(--ink)}
.flowarrow{display:flex;align-items:center;justify-content:center;padding:0 6px;color:var(--muted);flex:none}
.card h3{font-size:14px;margin-bottom:9px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:12px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;position:sticky;top:0;z-index:1}
th.num,td.num{text-align:right}
td{padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tr.clickable{cursor:pointer}
td .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
tfoot td{border-top:1px solid var(--line);border-bottom:0;font-weight:600;background:var(--surface2)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;font-family:var(--disp);font-size:15px;color:var(--ink2);margin-bottom:4px}

/* ---------- status tags (GMP warehouse tags) ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid;white-space:nowrap;font-family:var(--ui)}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.t-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.t-bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.t-info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.t-mute{color:var(--muted);background:var(--sunk);border-color:var(--line)}
.t-brand{color:var(--wine);background:var(--wine-soft);border-color:var(--wine);border-color:color-mix(in srgb,var(--wine) 35%,transparent)}

/* ---------- misc ---------- */
/* ---------- upload / review / filed copies ---------- */
.dropzone{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;background:var(--surface2);cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--wine);background:var(--wine-soft)}
.dropzone .dzmark{font-size:22px;color:var(--brass);line-height:1}
.dropzone b{display:block;font-family:var(--disp);font-size:15px;margin:7px 0 3px}
.dropzone span{font-size:12.5px;color:var(--muted)}
.orbar{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.orbar::before,.orbar::after{content:"";flex:1;height:1px;background:var(--line)}
.lgrid input,.lgrid select{padding:4px 6px;font-size:12.5px}
.lgrid td{padding:5px 6px}
.lgrid .wnarrow{width:88px}
.lgrid .wmed{width:120px}
.fixrow{background:var(--warn-bg)}
.fixrow td{border-bottom-color:var(--warn-line)}
.diffbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.diffhd{background:var(--surface2);padding:9px 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.diffrow{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:13px}
.diffrow:last-child{border-bottom:0}
.diffrow .dk{width:78px;flex:none}
.was{color:var(--muted);text-decoration:line-through}
.now{color:var(--ink);font-weight:600}
.stage{background:#161012;border-radius:var(--r);padding:14px;text-align:center}
.stage img{max-width:100%;border-radius:2px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.pagestrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:11px}
.pagestrip button{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:2px 9px;font-family:var(--mono);font-size:11.5px;cursor:pointer;color:var(--ink2)}
.pagestrip button.on{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.copychip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--brass);color:var(--brass);background:var(--brass-soft);border-radius:2px;padding:2px 8px;font-size:11px;cursor:pointer}
.copychip:hover{background:var(--wine-soft);border-color:var(--wine);color:var(--wine)}
.linenote{color:var(--brass);font-size:11.5px;margin-top:3px}

/* ---------- step 01 register ---------- */
.subtabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.subtab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;color:var(--ink2);font-size:13.5px;margin-bottom:-1px}
.subtab:hover{color:var(--ink)}
.subtab.on{color:var(--wine);border-bottom-color:var(--wine);font-weight:600}
.subtab b{font-family:var(--mono);font-size:10.5px;font-weight:500;background:var(--sunk);border-radius:8px;padding:1px 6px;margin-left:5px;color:var(--muted)}
.subtab.on b{background:var(--wine-soft);color:var(--wine)}
.subtab b.warnpip{background:var(--bad-bg);color:var(--bad)}
.pocards{display:flex;flex-direction:column;gap:10px}
.pocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pocard.open{border-color:color-mix(in srgb,var(--wine) 45%,var(--line))}
.pohead{display:flex;gap:14px;align-items:center;padding:13px 15px 13px 0;cursor:pointer;position:relative}
.pohead:hover{background:var(--surface2)}
.postripe{width:3px;align-self:stretch;background:var(--ok);flex:none;margin-right:12px}
.postripe.late{background:var(--bad)} .postripe.done{background:var(--muted)}
.porow1{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.pono{font-size:16px;letter-spacing:-.01em}
.pocust{font-size:14px;color:var(--ink)}
.poref{font-size:11.5px;color:var(--brass)}
.porow2{font-size:12.5px;color:var(--muted);margin-top:4px}
.porow2 b{color:var(--ink2);font-weight:500}
.poship{color:var(--muted)}
.pometa{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.povalue{font-size:17px;letter-spacing:-.01em}
.povlabel{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pochev{color:var(--muted);font-size:14px;flex:none;width:14px;text-align:center}
.pobody{padding:0 15px 15px 15px;border-top:1px solid var(--line2)}
.pobody .tw{margin-top:13px}
@media (max-width:760px){
  .pohead{flex-wrap:wrap}
  .pometa{align-items:flex-start;text-align:left;flex-direction:row;gap:10px;align-items:baseline;padding-left:15px}
}
.extcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--wine);border-radius:var(--r);padding:14px 16px}
.extmark{width:34px;height:34px;flex:none;border:1px solid var(--brass);border-radius:2px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--brass);background:var(--brass-soft)}
.exttitle{font-family:var(--disp);font-size:15px;font-weight:600}
.extdesc{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:3px;max-width:80ch}
.extcard a.btn{text-decoration:none}
.impbad{color:var(--bad)}
.note{border-left:2px solid var(--brass);background:var(--brass-soft);padding:9px 12px;border-radius:0 var(--r) var(--r) 0;font-size:12.5px;color:var(--ink2)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border:1px solid;border-radius:var(--r);font-size:13px;margin-bottom:12px}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.banner.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.banner b{font-weight:600}
.meter{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--wine);border-radius:3px}
.meter i.ok{background:var(--ok)}.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--bad)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.dl dt{color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.dl dd{margin:0}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb button{background:none;border:0;color:var(--wine);cursor:pointer;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}

/* trace chain */
.chain{display:flex;flex-direction:column;gap:0}
.chainstep{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:stretch}
.chainstep .rail{display:flex;flex-direction:column;align-items:center}
.chainstep .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--wine);background:var(--surface);margin-top:5px;flex:none}
.chainstep .dot.done{background:var(--wine)}
.chainstep .dot.miss{border-color:var(--line);background:var(--surface)}
.chainstep .ln{flex:1;min-height:14px;width:1.5px;background:var(--brass);opacity:.4;margin:4px 0}
.chainstep .body{padding-bottom:16px;min-width:0}
.chainstep .body h4{font-size:13.5px;font-family:var(--ui);font-weight:600}
.chainstep .body .meta{font-size:12px;color:var(--muted);margin-top:2px}

/* modal */
#modal-root:empty{display:none}
.mbg{position:fixed;inset:0;background:rgba(20,12,15,.55);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);width:min(760px,100%);margin:auto 0}
.modal.wide{width:min(1040px,100%)}
.mhead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2;border-radius:var(--r) var(--r) 0 0}
.mhead h3{font-size:16px;flex:1}
.mhead .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.mhead .x:hover{color:var(--bad)}
.mbody{padding:18px}
.mfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.mfoot .left{margin-right:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field .hint{font-size:11.5px;color:var(--muted)}
.field .req{color:var(--bad)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:13px;margin:0 0 14px}
legend{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--brass);font-weight:700;padding:0 6px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toastmsg{background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:var(--r);font-size:13px;box-shadow:var(--sh);max-width:min(520px,90vw)}
.toastmsg.bad{background:var(--bad);color:#fff}
.toastmsg.ok{background:var(--ok);color:#fff}

.savechip{font-size:11px;color:var(--muted);font-family:var(--mono)}
.savechip.on{color:var(--ok)}
.savechip.err{color:var(--bad)}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  #rail[data-collapsed="1"] .navwrap{display:none}
  .railtoggle{display:block}
  #view{padding:18px 14px 70px}
  #topbar{padding:12px 14px}
}
.railtoggle{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r);padding:4px 9px;cursor:pointer;color:var(--ink2);font-size:12px}
@media (max-width:900px){.railtoggle{display:block}}
@media print{
  #rail,#topbar .topacts,.btn,.filterbar,#toast{display:none!important}
  #app{display:block}#view{padding:0}
  .mbg{position:static;inset:auto;background:none;backdrop-filter:none;padding:0;display:block;overflow:visible}
  .modal,.modal.wide{border:0;box-shadow:none;width:100%;max-width:100%;margin:0}
  .mhead,.mfoot{display:none!important}
  .mbody{padding:0}
  .tw{overflow:visible}
  body.printing #app{display:none!important}
  tbody tr{break-inside:avoid}
}
</style>

    <h1>HE Manufacturing</h1>
    <div class="sub">Sign in to the plant floor system</div>
    <div id="loginErr" class="loginerr" hidden></div>
    <form id="loginForm">
      <label><span>Email</span>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </label>
      <label><span>Password</span>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>
      <button type="submit" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>
<button id="logoutBtn" type="button" hidden>Sign out</button>

<script>
(function(){
  const SUPABASE_URL = 'https://znxtvkpnwzrzevljdsgx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_3Q-qF58hDO6Q5Tr8Wr8X4A_WTBVR8z5';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  window.HEM_AUTH = sb;

  const gate = document.getElementById('authGate');
  const logoutBtn = document.getElementById('logoutBtn');
  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');

  function showApp(){
    gate.style.display = 'none';
    logoutBtn.hidden = false;
  }
  function showGate(msg){
    gate.style.display = 'flex';
    logoutBtn.hidden = true;
    if(msg){ errBox.textContent = msg; errBox.hidden = false; } else { errBox.hidden = true; }
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errBox.hidden = true;
    btn.disabled = true; btn.textContent = 'Signing in…';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Sign in';
    if(error){
      showGate(error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : error.message);
      return;
    }
    showApp();
  });

  logoutBtn.addEventListener('click', async function(){
    await sb.auth.signOut();
    showGate();
  });

  sb.auth.getSession().then(function(res){
    if(res.data && res.data.session) showApp(); else showGate();
  });
})();
</script>

let ORIGINAL_DOC = '';
function captureDoc(){
  if(ORIGINAL_DOC) return;
  try{
    const c = document.documentElement.cloneNode(true);
    // drop anything the viewer runtime injected; keep only our own tagged scripts
    c.querySelectorAll('script').forEach(s=>{
      if(s.id==='hem-state') return;
      if(s.hasAttribute('data-hem')) return;
      s.remove();
    });
    c.querySelectorAll('[data-hem-runtime]').forEach(n=>n.remove());
    ORIGINAL_DOC = '<!doctype html>\n' + c.outerHTML;
  }catch(e){ ORIGINAL_DOC=''; }
}

function sortBy(arr,k,dir){ const s=[...arr]; s.sort((a,b)=>{const x=a[k],y=b[k]; if(x==null)return 1; if(y==null)return -1; return (typeof x==='number'&&typeof y==='number')?x-y:String(x).localeCompare(String(y));}); return dir==='desc'?s.reverse():s; }

/* returns false so `return toast('…','bad')` inside a form handler both tells the
   user what is wrong and keeps the form open with their input still in it */
function toast(msg, kind){
  const t=document.createElement('div'); t.className='toastmsg'+(kind?' '+kind:''); t.textContent=msg;
  $('#toast').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(()=>t.remove(),450);},2600);
  return false;
}

/* ---------- audit trail (ISO 22716 cl.17 / 9001 cl.7.5) ---------- */
function logAudit(action, ref, detail){
  S.audit = S.audit || [];
  S.audit.unshift({at:new Date().toISOString().replace('T',' ').slice(0,16), who:UI.user||'SS', action, ref:ref||'', detail:detail||''});
  if(S.audit.length>600) S.audit.length=600;
}

/* A PO in Void status for more than 24 hours is permanently removed from the working
   register — but never silently. A small tombstone is written first, kept forever, and never
   read by demand/production/purchasing calculations (only S.pos feeds those). Runs on boot,
   whenever the Customer PO screen is opened, and after any status change, per GMP/ISO
   requirements for a documented deletion trail rather than a quiet one. */
function cleanupVoidedPOs(){
  const pos = S.pos||[]; S.poTombstones = S.poTombstones||[];
  const cutoffMs = 24*3600*1000;
  const stay=[], expired=[];
  pos.forEach(p=>{
    if(p.status==='cancelled' && p.voidedAtTS && (Date.now()-new Date(p.voidedAtTS).getTime())>cutoffMs) expired.push(p);
    else stay.push(p);
  });
  if(!expired.length) return false;
  expired.forEach(p=>{
    S.poTombstones.push({
      po:p.po, customer:customerName(p.customer), origId:p.id,
      receivedAt:p.poDate||'', voidedAt:p.voidedAt||'', voidReason:p.voidReason||'',
      voidedBy:p.voidedBy||'', deletedAt:new Date().toISOString().replace('T',' ').slice(0,16)
    });
    logAudit('Void PO permanently removed', p.id, p.po+' — voided '+(p.voidedAt||'')+', reason: '+(p.voidReason||''));
  });
  S.pos = stay;
  return true;
}

/* "Scheduled for permanent deletion in Xh Ym." shown on a voided PO card while it's still
   inside the 24-hour restore window. */
function voidCountdown(p){
  if(!p.voidedAtTS) return 'Scheduled for permanent deletion once cleanup next runs.';
  const msLeft = 24*3600*1000 - (Date.now()-new Date(p.voidedAtTS).getTime());
  if(msLeft<=0) return 'Past the 24-hour window — will be permanently removed the next time this screen loads.';
  const h=Math.floor(msLeft/3600000), m=Math.floor((msLeft%3600000)/60000);
  return 'Scheduled for permanent deletion in '+h+'h '+m+'m.';
}
/* ---------- persistence ---------- */
function readEmbedded(){
  try{
    const raw = document.getElementById('hem-state').textContent;
    const m = raw.match(/\/\*STATE_START\*\/([\s\S]*?)\/\*STATE_END\*\//);
    if(!m) return null;
    const body = m[1].trim();
    if(!body || body==='{}') return null;
    return JSON.parse(decodeURIComponent(escape(atob(body))));
  }catch(e){ console.warn('embedded state unreadable', e); return null; }
}
function readLocal(){
  try{ const v = localStorage.getItem(LS_KEY); return v? JSON.parse(v):null; }catch(e){ return null; }
}
function writeLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
function encodeState(){
  return btoa(unescape(encodeURIComponent(JSON.stringify(S))));
}

/* ---------- filed PO copies ----------
   There is no file-storage capability on this account, so a scanned or rendered PO page is
   kept in the document itself as a JPEG data URI. Images live in their OWN block, not in the
   state JSON: encodeState() base64-encodes the state, which would encode a data URI a second
   time (1.78x overhead instead of 1.33x). */
let IMAGES = {};
const IMG_BUDGET = 9*1024*1024;
const IMG_LS_KEY = 'hem-erp-images-v1';
function readImages(){
  try{
    const raw=document.getElementById('hem-images').textContent;
    const m=raw.match(/\/\*IMG_START\*\/([\s\S]*?)\/\*IMG_END\*\//);
    if(!m) return {};
    const body=m[1].trim();
    return (!body||body==='{}')? {} : JSON.parse(body);
  }catch(e){ console.warn('image block unreadable',e); return {}; }
}
function imagesBytes(){ let n=0; for(const k in IMAGES) n+=IMAGES[k].length; return Math.round(n*0.75); }
/* drop any page no order (or superseded revision) still points at */
function pruneImages(){
  const keep=new Set();
  (S.pos||[]).forEach(p=>{
    ((p.copy&&p.copy.pages)||[]).forEach(id=>keep.add(id));
    (p.revisions||[]).forEach(r=>((r.copy&&r.copy.pages)||[]).forEach(id=>keep.add(id)));
  });
  Object.keys(IMAGES).forEach(id=>{ if(!keep.has(id)) delete IMAGES[id]; });
}
function writeImagesLocal(){ try{ localStorage.setItem(IMG_LS_KEY, JSON.stringify(IMAGES)); }catch(e){} }
function readImagesLocal(){ try{ const v=localStorage.getItem(IMG_LS_KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
/* merge: keep records unique to either side; the later-edited copy wins on collisions */
const COLLECTIONS = ['customers','suppliers','materials','products','formulas','prices','pos','grns','issues','batches','ipqc','qc','coas','fg','shipments','deviations','capas','changes','complaints','training','equipment','compliance','audit','boms','poTombstones','prs','spos'];
function reconcile(a,b){
  if(!a) return b; if(!b) return a;
  const out = clone(a);
  out.settings = Object.assign({}, a.settings||{}, b.settings||{});
  COLLECTIONS.forEach(k=>{
    const A = a[k]||[], B = b[k]||[];
    if(k==='prices'){
      const map = new Map(A.map(r=>[r.code, r]));
      B.forEach(r=>map.set(r.code, r));
      out[k]=[...map.values()]; return;
    }
    if(k==='compliance'){
      const map = new Map(A.map(r=>[r.std+'|'+r.cl, r]));
      B.forEach(r=>map.set(r.std+'|'+r.cl, r));
      out[k]=[...map.values()]; return;
    }
    if(k==='audit'){ out[k]=[...B,...A].slice(0,600); return; }
    const map = new Map(A.map(r=>[r.id, r]));
    B.forEach(r=>{ map.set(r.id, r); });
    out[k]=[...map.values()];
  });
  return out;
}

let pubTimer=null;
function markSaved(kind){ saveState=kind; const c=$('#savechip'); if(c){ c.className='savechip'+(kind==='saved'?' on':kind==='error'?' err':''); c.textContent = kind==='saving'?'saving…':kind==='saved'?'saved '+new Date().toTimeString().slice(0,5):kind==='local'?'saved locally':kind==='error'?'not shared':''; } }
function save(reason){
  pruneImages(); writeLocal(); writeImagesLocal(); dirty=true; markSaved('saving');
  clearTimeout(pubTimer);
  pubTimer = setTimeout(()=>publish(reason), 1400);
}
async function publish(reason){
  if(!CAP.artifact || !ORIGINAL_DOC){ markSaved('local'); return; }
  try{
    let doc = ORIGINAL_DOC.replace(/\/\*STATE_START\*\/[\s\S]*?\/\*STATE_END\*\//, '/*STATE_START*/'+encodeState()+'/*STATE_END*/');
    doc = doc.replace(/\/\*IMG_START\*\/[\s\S]*?\/\*IMG_END\*\//, '/*IMG_START*/'+JSON.stringify(IMAGES)+'/*IMG_END*/');
    await CAP.artifact.publish(doc);
    markSaved('saved');
  }catch(e){
    if(e && e.code==='conflict'){ return; }
    if(e && (e.code==='not_writer'||e.code==='not_granted'||e.code==='not_declared'||e.code==='capability_disabled')){ CAP.artifact=null; markSaved('local'); return; }
    console.warn('publish failed', e); markSaved('error');
  }
}
async function download(filename, text, mime){
  if(CAP.downloads){
    const payload = (typeof text==='string' && mime==='text/csv') ? '﻿'+text : text;
    try{ await CAP.downloads.save({filename, data:payload}); toast('Saved '+filename,'ok'); return; }
    catch(e){ if(e&&e.code==='declined') return; }
  }
  /* self-hosted: no capability needed, save the file directly */
  try{
    const blob = (text instanceof Blob) ? text
      : new Blob([(mime==='text/csv'?'\ufeff':'')+text], {type:(mime||'text/plain')+';charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Saved '+filename,'ok'); return;
  }catch(e){}
  if(typeof text!=='string'){ toast('Saving files is not available in this view','bad'); return; }
  const w = window.open('', '_blank');
  if(w){ w.document.write('<pre style="white-space:pre-wrap;font:12px ui-monospace,monospace;padding:16px">'+esc(text)+'</pre>'); w.document.title=filename; }
  else toast('Download unavailable in this view','bad');
}
function csv(rows){
  return rows.map(r=>r.map(c=>{
    const v = c==null?'':String(c);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\n');
}

/* ---------- derived data ---------- */
function product(code){ return byId('products',code,'code') || {code, name:code, packSize:1, uom:''}; }
function material(code){ return byId('materials',code,'code') || {code, name:code, uom:''}; }
function formula(id){ return byId('formulas',id); }
function customerName(c){ const x=byId('customers',c,'code'); return x?x.name:c; }
function supplierName(c){ const x=byId('suppliers',c,'code'); return x?x.name:c; }
function person(init){ const p=(S.settings.signatories||[]).find(s=>s.init===init); return p?p.name:(init||'—'); }
function personShort(init){ return init? '<span class="mono" title="'+esc(person(init))+'">'+esc(init)+'</span>' : '—'; }

/* stock by material lot: received (released) minus issued */
function lotStock(){
  const map = new Map();
  (S.grns||[]).forEach(g=>{
    const k = g.code+'|'+g.lot;
    map.set(k, {code:g.code, lot:g.lot, uom:g.uom, received:g.qty, issued:0, status:g.status, exp:g.exp, grn:g.id, supplier:g.supplier, date:g.date});
  });
  (S.issues||[]).forEach(i=>{
    const k = i.code+'|'+i.lot; const r = map.get(k);
    if(r) r.issued += Number(i.qty)||0;
  });
  map.forEach(r=> r.balance = (Number(r.received)||0) - r.issued);
  return [...map.values()];
}
function materialStock(){
  const lots = lotStock(); const map = new Map();
  (S.materials||[]).forEach(m=> map.set(m.code, {code:m.code, name:m.name, type:m.type, uom:m.uom, reorder:m.reorder, released:0, quarantine:0, rejected:0, lots:0, nearest:''}));
  lots.forEach(l=>{
    const r = map.get(l.code); if(!r) return;
    if(l.balance<=0) return;
    r.lots++;
    if(l.status==='released') r.released += l.balance;
    else if(l.status==='quarantine') r.quarantine += l.balance;
    else r.rejected += l.balance;
    if(l.exp && (!r.nearest || l.exp < r.nearest)) r.nearest = l.exp;
  });
  return [...map.values()];
}
/* open demand by product code from POs not yet shipped */
function openDemand(){
  const map = new Map();
  (S.pos||[]).forEach(po=>{
    if(po.status==='shipped'||po.status==='cancelled') return;
    (po.lines||[]).forEach(l=>{
      const r = map.get(l.code) || {code:l.code, cases:0, value:0, pos:[], earliest:''};
      r.cases += Number(l.cases)||0;
      r.value += (Number(l.cases)||0)*(Number(l.price)||0);
      if(!r.pos.includes(po.po)) r.pos.push(po.po);
      if(!r.earliest || (po.shipBy && po.shipBy < r.earliest)) r.earliest = po.shipBy;
      map.set(l.code, r);
    });
  });
  /* subtract finished goods already made and not yet shipped */
  map.forEach(r=>{
    const onHand = (S.fg||[]).filter(f=>f.product===r.code && f.status==='released').reduce((s,f)=>s+(Number(f.cases)||0),0);
    r.onHand = onHand;
    r.toMake = Math.max(0, r.cases - onHand);
    r.units = r.toMake * (product(r.code).packSize||1);
  });
  return [...map.values()].sort((a,b)=> (a.earliest||'zz').localeCompare(b.earliest||'zz'));
}
function batchIssues(b){ return (S.issues||[]).filter(i=>i.batch===b); }
function batchIpqc(b){ return (S.ipqc||[]).filter(i=>i.batch===b); }
function batchQc(b){ return (S.qc||[]).filter(i=>i.batch===b); }
function batchCoa(b){ return (S.coas||[]).find(c=>c.batch===b); }
function batchFg(b){ return (S.fg||[]).filter(f=>f.batch===b); }
function fgShipments(lot){ return (S.shipments||[]).filter(s=>(s.lines||[]).some(l=>l.fgLot===lot)); }

/* material requirement for a batch from its formula */
function requirement(batch){
  const f = formula(batch.formula); if(!f) return [];
  const kg = Number(batch.plannedKg)||0;
  return (f.items||[]).map(it=>({code:it.code, phase:it.phase, pct:it.pct, need:+(kg*it.pct/100).toFixed(2), uom:'kg', fn:it.fn}));
}

/* ============================================================
   BOM MASTER — the permanent manufacturing requirement database.
   A product may have several BOM revisions on file; only one is ever
   'approved' at a time (others sit as 'draft' or 'obsolete'). Only an
   approved BOM is used for automatic material requirement calculation
   — this preserves the existing formula-based batch calculation above
   untouched, and adds the fuller BOM (bulk + packaging) alongside it.
   ============================================================ */
function bomsFor(code){ return (S.boms||[]).filter(b=>b.code===code).sort((a,b)=>(b.revision||0)-(a.revision||0)); }
function approvedBom(code){ return (S.boms||[]).find(b=>b.code===code && b.status==='approved') || null; }

/* Where no BOM has been built yet but the product has an approved formula, offer a read-only
   view derived from that formula's real, already-approved percentages — bulk only, no
   packaging (that data doesn't exist yet). This is never written into S.boms on its own and
   is always shown as "derived", never treated as equal to a real approved BOM. */
function derivedBomFromFormula(code){
  const p=product(code), f=formula(p.formula);
  if(!f) return null;
  return {code, revision:0, status:'derived', mfgType:'Liquid', batchSize:f.batchSizeKg||0, batchUom:'kg',
    fillSize:p.fill||0, fillUom:p.fillUom||'', density:f.density||1,
    bulk:(f.items||[]).map((it,i)=>({seq:i+1, phase:it.phase, code:it.code, fn:it.fn, pct:it.pct, lossPct:0, notes:''})),
    packaging:[], notes:'Derived from formula '+f.id+' v'+f.version+' — not a full BOM. No packaging data exists yet.'};
}
/* what a Customer PO's material requirement calculation should use for this product right now */
function bomStatusFor(code){
  const p = byId('products',code,'code');
  if(!p) return {state:'unrecognized', bom:null, drafts:[]};
  const lookupCode = p.bomAlias || code;
  const ap = approvedBom(lookupCode);
  if(ap) return {state:'approved', bom:ap, drafts:[]};
  const drafts = bomsFor(lookupCode).filter(b=>b.status==='draft');
  const derived = derivedBomFromFormula(code);
  if(derived) return {state:'derived', bom:derived, drafts};
  if(drafts.length) return {state:'draft-only', bom:null, drafts};
  return {state:'missing', bom:null, drafts:[]};
}

/* ---- liquid / raw-material requirement — spec section 10 ---- */
function netFillKg(p, bom){
  if(p.netFillWeight) return Number(p.netFillWeight);
  const density = (bom&&bom.density) || p.density || 1;
  const fillUom = (p.fillUom||'').toLowerCase();
  if(fillUom==='g') return (Number(p.fill)||0)/1000;
  if(fillUom==='kg') return Number(p.fill)||0;
  if(fillUom==='l') return (Number(p.fill)||0)*density;
  return (Number(p.fill)||0)/1000*density; /* default: treat as ml */
}
function liquidRequirement(line, bomInfo){
  const p = product(line.code); const bom = bomInfo.bom;
  const units = (Number(line.cases)||0) * packOf(line.code);
  if(!bom || !bom.bulk || !bom.bulk.length) return {units, totalKg:0, rows:[]};
  const kgPerUnit = netFillKg(p, bom);
  const totalKg = units*kgPerUnit;
  const rows = bom.bulk.map(it=>{
    const theo = +(totalKg*(Number(it.pct)||0)/100).toFixed(3);
    const wastage = +(theo*(Number(it.lossPct)||0)/100).toFixed(3);
    return {code:it.code, phase:it.phase, fn:it.fn, pct:it.pct, theo, wastage, total:+(theo+wastage).toFixed(3), uom:'kg'};
  });
  return {units, totalKg:+totalKg.toFixed(2), rows};
}
/* ---- packaging requirement — spec section 11 ---- */
function packagingRequirement(line, bomInfo){
  const bom = bomInfo.bom;
  const units = (Number(line.cases)||0) * packOf(line.code);
  const cases = Number(line.cases)||0;
  if(!bom || !bom.packaging || !bom.packaging.length) return {units, cases, rows:[]};
  const rows = bom.packaging.map(it=>{
    const theo = it.qtyPerUnit? units*Number(it.qtyPerUnit) : (it.qtyPerCase? cases*Number(it.qtyPerCase):0);
    const wastage = +(theo*(Number(it.wastagePct)||0)/100).toFixed(2);
    return {code:it.code, desc:it.desc, type:it.type, theo:+theo.toFixed(2), wastagePct:it.wastagePct||0, wastage, total:+(theo+wastage).toFixed(2), uom:it.uom||'pcs'};
  });
  return {units, cases, rows};
}
/* full requirement for one PO — every line, liquid and packaging kept separate, with the
   BOM state for each line so an unrecognised product or a missing BOM never gets guessed at */
function poMaterialRequirement(po){
  return (po.lines||[]).map(l=>{
    const bomInfo = bomStatusFor(l.code);
    return {
      line:l, product:byId('products',l.code,'code'), bomState:bomInfo.state, bom:bomInfo.bom, drafts:bomInfo.drafts,
      liquid: bomInfo.bom? liquidRequirement(l, bomInfo) : null,
      packaging: bomInfo.bom? packagingRequirement(l, bomInfo) : null
    };
  });
}
/* consolidated requirement across every open PO, by material code, with the PO/product
   breakdown kept — spec section 12 */
function consolidatedRequirement(){
  const open=(S.pos||[]).filter(p=>p.status!=='shipped'&&p.status!=='cancelled');
  const liquidMap=new Map(), pkgMap=new Map();
  open.forEach(po=>{
    poMaterialRequirement(po).forEach(r=>{
      (r.liquid&&r.liquid.rows||[]).forEach(row=>{
        const cur=liquidMap.get(row.code)||{code:row.code, need:0, from:[]};
        cur.need+=row.total; cur.from.push({po:po.po, poId:po.id, poDate:po.poDate, shipBy:po.shipBy, product:r.line.code, qty:row.total});
        liquidMap.set(row.code,cur);
      });
      (r.packaging&&r.packaging.rows||[]).forEach(row=>{
        const cur=pkgMap.get(row.code)||{code:row.code, desc:row.desc, need:0, uom:row.uom, from:[]};
        cur.need+=row.total; cur.from.push({po:po.po, poId:po.id, poDate:po.poDate, shipBy:po.shipBy, product:r.line.code, qty:row.total});
        pkgMap.set(row.code,cur);
      });
    });
  });
  return {liquid:[...liquidMap.values()].sort((a,b)=>b.need-a.need), packaging:[...pkgMap.values()].sort((a,b)=>b.need-a.need)};
}

/* ============================================================
   INVENTORY ALLOCATION, SHORTAGE & PURCHASING — Phase 3.
   Reservation is never stored; it's recomputed from live data every time, the same way
   materialStock() and consolidatedRequirement() already work. This avoids an allocation
   record silently going stale as orders, receipts or BOMs change.
   ============================================================ */

/* outstanding quantity per material still due on open Supplier POs */
function supplierIncomingByCode(){
  const map=new Map();
  (S.spos||[]).forEach(po=>{
    if(po.status==='Cancelled') return;
    (po.lines||[]).forEach(l=>{
      const outstanding=Math.max(0,(Number(l.qty)||0)-(Number(l.received)||0));
      if(outstanding<=0) return;
      const cur=map.get(l.code)||{qty:0, lines:[]};
      cur.qty+=outstanding;
      cur.lines.push({spo:po.id, supplier:po.supplier, expectedDelivery:l.expectedDelivery||po.expectedDelivery, qty:outstanding, status:po.status});
      map.set(l.code,cur);
    });
  });
  return map;
}
/* GREEN / AMBER / RED — calculated from dates, never assigned by hand */
function purchasingUrgency(shortageQty, requiredBy, mat, incomingLines){
  if(shortageQty<=0) return 'GREEN';
  if(!requiredBy) return 'AMBER';
  const daysLeft = Math.round((new Date(requiredBy)-new Date(today()))/864e5);
  const withDate=(incomingLines||[]).filter(l=>l.expectedDelivery);
  if(withDate.length){
    const worst = withDate.map(l=>l.expectedDelivery).sort().slice(-1)[0];
    return worst<=requiredBy? 'GREEN':'RED';
  }
  const lead=Number(mat&&mat.leadTimeDays)||14;
  return daysLeft>=lead? 'AMBER':'RED';
}
/* the single source of truth for Inventory, Planning and Purchasing — physical/quarantine/
   released/reserved/available stock, gross requirement, incoming supply, net shortage,
   required-by date and urgency, for every material that has stock and/or open-PO demand */
function materialAvailability(){
  const stock=new Map(materialStock().map(m=>[m.code,m]));
  const cons=consolidatedRequirement();
  const reqMap=new Map();
  cons.liquid.forEach(r=>reqMap.set(r.code, Object.assign({kind:'liquid'},r)));
  cons.packaging.forEach(r=>reqMap.set(r.code, Object.assign({kind:'packaging'},r)));
  const incoming=supplierIncomingByCode();
  const allCodes=new Set([...stock.keys(), ...reqMap.keys()]);
  const rows=[];
  allCodes.forEach(code=>{
    const m=material(code);
    const s=stock.get(code)||{code, name:m.name, type:m.type, uom:m.uom, released:0, quarantine:0, rejected:0};
    const req=reqMap.get(code);
    const gross=req?req.need:0;
    const from=req?req.from:[];
    /* priority: earliest requested delivery date first, then the older PO when dates tie */
    const sortedFrom=from.slice().sort((a,b)=>
      String(a.shipBy||'9999-99-99').localeCompare(String(b.shipBy||'9999-99-99')) || String(a.poDate||'').localeCompare(String(b.poDate||'')));
    let remaining=s.released||0;
    const alloc=sortedFrom.map(f=>{ const take=Math.min(f.qty,remaining); remaining-=take;
      return Object.assign({},f,{reserved:+take.toFixed(3), short:+(f.qty-take).toFixed(3)}); });
    const reserved=+alloc.reduce((sum,a)=>sum+a.reserved,0).toFixed(3);
    const available=+Math.max(0,(s.released||0)-reserved).toFixed(3);
    const inc=incoming.get(code);
    const incQty=inc?inc.qty:0;
    const netShortage=+Math.max(0, gross-(s.released||0)-incQty).toFixed(3);
    const earliestNeed=sortedFrom.length? sortedFrom[0].shipBy : null;
    const requiredBy=earliestNeed? new Date(new Date(earliestNeed).getTime()-((S.settings.prodBufferDays||7)+(S.settings.materialPrepBufferDays||1))*864e5).toISOString().slice(0,10) : null;
    rows.push({
      code, name:s.name||m.name, type:s.type||m.type, kind:req?req.kind:(m.type==='PM'?'packaging':'liquid'), uom:s.uom||m.uom,
      physical:+((s.released||0)+(s.quarantine||0)+(s.rejected||0)).toFixed(3),
      quarantine:s.quarantine||0, released:s.released||0, reserved, available, gross,
      incoming:incQty, incomingLines:inc?inc.lines:[], netShortage, breakdown:alloc, requiredBy,
      urgency:purchasingUrgency(netShortage, requiredBy, m, inc?inc.lines:[])
    });
  });
  return rows.sort((a,b)=> b.netShortage-a.netShortage || a.code.localeCompare(b.code));
}
/* per-PO material readiness — spec section 14. Named distinctly from the existing
   poMaterialStatus() used on the Dashboard's Order Status Overview (different signature,
   simpler batch-level check) so neither is disturbed. */
function poMaterialReadiness(po){
  const reqs = poMaterialRequirement(po);
  const avail = new Map(materialAvailability().map(r=>[r.code,r]));
  let worstDate=null, anyPending=false, anyShort=false, anyRed=false, anyOrdered=false, anyCovered=false;
  reqs.forEach(r=>{
    if(r.bomState!=='approved' && r.bomState!=='derived'){ anyPending=true; return; }
    const codes=[...(r.liquid?r.liquid.rows.map(x=>x.code):[]), ...(r.packaging?r.packaging.rows.map(x=>x.code):[])];
    codes.forEach(c=>{
      const a=avail.get(c); if(!a) return;
      const myLine=(a.breakdown||[]).find(b=>b.poId===po.id);
      const short=myLine? myLine.short : 0;
      if(short>0.001){ anyShort=true; if(a.incoming>0) anyOrdered=true; if(a.urgency==='RED') anyRed=true; }
      else anyCovered=true;
      if(a.requiredBy && (!worstDate || a.requiredBy>worstDate)) worstDate=a.requiredBy;
    });
  });
  let state;
  if(anyPending) state='Pending BOM';
  else if(!anyShort) state='Material Ready';
  else if(anyRed) state='Material Delay';
  else if(anyOrdered) state='Purchasing in Progress';
  else if(anyCovered) state='Partially Ready';
  else state='Waiting for Supplier';
  return {state, materialReadyDate:worstDate};
}

/* "MATERIAL REQUIREMENT PREVIEW" on the PO detail screen — liquid and packaging always kept
   in separate tables, per line, with the three states the spec calls for handled explicitly:
   an unrecognised product code, a recognised product with no BOM, and a recognised product
   with an approved (or formula-derived) BOM. Nothing here blocks the PO from being registered. */
function materialRequirementHtml(po){
  const reqs = poMaterialRequirement(po);
  let h = '<h3 style="font-size:14px;margin-bottom:10px">Material requirement preview</h3>';
  reqs.forEach(r=>{
    const code = r.line.code;
    h += '<div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      + '<b class="mono">'+esc(code)+'</b><span style="color:var(--muted);font-size:12.5px">'+esc(r.product? r.product.name : '')+'</span></div>';
    if(r.bomState==='unrecognized'){
      h += '<div class="banner bad"><b>NEW / UNRECOGNIZED PRODUCT</b> — this code is not in the Product Master yet, so no requirement can be calculated. The order stays registered.</div>'
        + '<div class="pillrow">'+btn('Create Product Master from PO','prod-from-po', po.id+'::'+code)+'</div>';
      return;
    }
    if(r.bomState==='missing' || r.bomState==='draft-only'){
      h += '<div class="banner warn"><b>BOM NOT AVAILABLE</b> — material requirement shows as Pending BOM. Automatic production planning will not assume quantities, and no purchasing requirement will be created from a guess.'
        + (r.bomState==='draft-only'? ' A draft BOM exists but has not been approved yet.':'') + '</div>'
        + '<div class="pillrow">'+btn('Create BOM manually','bom-new',code)
        + (r.bomState==='draft-only'? btn('Review draft','bom-open',r.drafts[0].id):btn('Upload batch sheet (as reference)','bom-new',code))
        + btn('Select existing BOM','prod-bom-alias',code)+'</div>';
      return;
    }
    if(r.bomState==='derived') h += '<div class="banner warn">Calculated from the approved formula ('+esc((formula(r.product.formula)||{}).id||'')+') — bulk only. Packaging requirement is not shown until a full BOM is built. '+btn('Build the full BOM','bom-new',code)+'</div>';
    const liq=r.liquid, pkg=r.packaging;
    h += '<div style="font-size:12px;color:var(--ink2);margin-bottom:6px">'+nf(liq.units)+' units · theoretical liquid '+nf(liq.totalKg,1)+' kg</div>';
    h += '<div class="tw"><table><thead><tr><th>Material</th><th>Function</th><th class="num">%</th><th class="num">Theoretical</th><th class="num">Wastage</th><th class="num">Total requirement</th></tr></thead><tbody>'
      + (liq.rows.length? liq.rows.map(row=>'<tr><td class="mono">'+esc(row.code)+'</td><td class="sub">'+esc(row.fn||'')+'</td>'
          +'<td class="num">'+nf(row.pct,2)+'%</td><td class="num">'+nf(row.theo,2)+' kg</td><td class="num">'+nf(row.wastage,2)+' kg</td>'
          +'<td class="num"><b>'+nf(row.total,2)+' kg</b></td></tr>').join('') : '<tr><td colspan="6" class="sub">No bulk lines on this BOM.</td></tr>')
      + '</tbody></table></div>';
    h += '<div style="height:10px"></div><div class="tw"><table><thead><tr><th>Packaging</th><th>Type</th><th class="num">Theoretical qty</th><th class="num">Wastage %</th><th class="num">Wastage qty</th><th class="num">Total requirement</th></tr></thead><tbody>'
      + (pkg.rows.length? pkg.rows.map(row=>'<tr><td class="mono">'+esc(row.code)+'<div class="sub">'+esc(row.desc||'')+'</div></td><td>'+esc(row.type||'')+'</td>'
          +'<td class="num">'+nf(row.theo)+' '+esc(row.uom)+'</td><td class="num">'+nf(row.wastagePct,1)+'%</td><td class="num">'+nf(row.wastage)+' '+esc(row.uom)+'</td>'
          +'<td class="num"><b>'+nf(row.total)+' '+esc(row.uom)+'</b></td></tr>').join('') : '<tr><td colspan="6" class="sub">No packaging lines on this BOM.</td></tr>')
      + '</tbody></table></div></div>';
  });
  return h;
}

/* ============================================================
   FIGURE HYGIENE — anything read off a document is checked against
   another figure on the same document before it is trusted.
   ============================================================ */
/* "1,120 cs24" arrives as one cell when the PDF's quantity and UOM columns collide.
   Split it BEFORE anything is turned into a number, or num() glues 1120 and 24 into 112024. */
function tidyLineCells(cell){
  const s=String(cell==null?'':cell).trim();
  const m=s.match(/^([\d,.]+)\s*([A-Za-z][A-Za-z0-9/\- ]*)$/);
  if(m) return {qty:m[1], uom:m[2].trim()};
  const m2=s.match(/^([A-Za-z][A-Za-z0-9/\- ]*?)\s*([\d,.]+)$/);
  if(m2 && /^(cs|case|ctn|pk|box)/i.test(m2[1])) return {qty:'', uom:s};
  return {qty:s, uom:''};
}
function toNum(v){ if(v==null) return 0; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
/* cs40 · 40/cs · 40/case · 40 per case · then the price master, then the product master */
function packSizeFrom(text, code){
  const s=String(text||'');
  let m=s.match(/\bcs\s*(\d{1,4})\b/i)||s.match(/\b(\d{1,4})\s*\/\s*(?:cs|case|ctn)\b/i)
      ||s.match(/\b(\d{1,4})\s*(?:per|\/)\s*case\b/i)||s.match(/\bcase\s*of\s*(\d{1,4})\b/i);
  if(m) return Number(m[1]);
  const pr=code&&priceRow(code); if(pr&&pr.packSize) return Number(pr.packSize);
  const pd=code&&byId('products',code,'code'); if(pd&&pd.packSize) return Number(pd.packSize);
  return 0;
}
/* The PO states its own arithmetic. Where cases x case price does not equal the printed line
   total, the printed total is the trustworthy figure and the quantity is recomputed. */
function verifyLine(l){
  const cases=toNum(l.cases), price=toNum(l.price), total=toNum(l.total);
  if(!total||!price) return l;
  const expect=+(cases*price).toFixed(2);
  if(Math.abs(expect-total)<=Math.max(0.02, total*0.001)) return l;
  const should=Math.round(total/price);
  if(should>0 && should!==cases){ l.qtyWas=cases; l.cases=should; l.qtyFixed=true; }
  return l;
}
/* the same check, run continuously over lines already saved */
function arithmeticIssues(){
  const out=[];
  (S.pos||[]).forEach(po=>(po.lines||[]).forEach((l,i)=>{
    const total=toNum(l.total); if(!total||!toNum(l.price)) return;
    const expect=+(toNum(l.cases)*toNum(l.price)).toFixed(2);
    if(Math.abs(expect-total)>Math.max(0.02,total*0.001))
      out.push({poId:po.id, po:po.po, idx:i, code:l.code, cases:l.cases, price:l.price,
                total, should:Math.round(total/toNum(l.price))});
  }));
  return out;
}
/* lines whose piece count would silently be wrong because no pack size is known */
function missingPack(){
  const out=[];
  (S.pos||[]).forEach(po=>(po.lines||[]).forEach(l=>{
    if(!packOf(l.code)||packOf(l.code)===1) out.push({po:po.po, code:l.code});
  }));
  return out;
}
/* what changed between two versions of the same PO */
function diffLines(before, after){
  const key=l=>String(l.code||('#'+l.itemNo)).toUpperCase();
  const A=new Map((before||[]).map(l=>[key(l),l])), B=new Map((after||[]).map(l=>[key(l),l]));
  const out=[];
  B.forEach((b,k)=>{
    const a=A.get(k);
    if(!a){ out.push({type:'added', code:b.code, to:b.cases, price:b.price}); return; }
    if(toNum(a.cases)!==toNum(b.cases)) out.push({type:'qty', code:b.code, from:a.cases, to:b.cases});
    if(toNum(a.price)!==toNum(b.price)) out.push({type:'price', code:b.code, from:a.price, to:b.price});
  });
  A.forEach((a,k)=>{ if(!B.has(k)) out.push({type:'removed', code:a.code, from:a.cases}); });
  return out;
}
function recentRevisions(days){
  return (S.pos||[]).filter(p=>p.revisedAt && daysFromToday(p.revisedAt)>=-days);

/* ---------- price master ---------- */
function priceRow(code){ return (S.prices||[]).find(p=>String(p.code).toLowerCase()===String(code).toLowerCase()); }
function priceStatus(p){ if(!p) return 'none'; if(p.price==null||p.price==='') return 'awaiting'; return p.confirmed? 'confirmed':'provisional'; }
/* the price in force on a given date, walking the supersession history */
function priceAsOf(code, when){
  const p = priceRow(code); if(!p) return null;
  if(when && (p.history||[]).length){
    const h = (p.history||[]).find(x=> (!x.from || x.from<=when) && (!x.to || when < x.to));
    if(h) return {price:h.price, historic:true, from:h.from, to:h.to};
  }
  if(p.effectiveFrom && when && when < p.effectiveFrom){
    const h = (p.history||[])[0];
    if(h) return {price:h.price, historic:true, from:h.from, to:h.to};
  }
  return {price:p.price, historic:false};
}
/* every PO line judged against a confirmed price of ours */
function priceCheck(){
  const tol = S.settings.priceTolerance||0.005, out=[];
  (S.pos||[]).forEach(po=>(po.lines||[]).forEach(l=>{
    const p = priceRow(l.code), st = priceStatus(p);
    const asOf = st==='confirmed'? priceAsOf(l.code, po.poDate) : null;
    const ours = asOf? asOf.price : null;
    const diff = ours==null? null : +(l.price - ours).toFixed(4);
    out.push({po:po.po, poId:po.id, poDate:po.poDate, customer:po.customer, code:l.code, cases:l.cases,
      poPrice:l.price, ours, status:st, historic:asOf? asOf.historic:false, histFrom:asOf?asOf.from:'',
      verdict: st!=='confirmed'? 'unchecked' : (Math.abs(diff)<=tol? 'match':'variance'),
      diff, impact: diff==null? null : +(diff*l.cases).toFixed(2)});
  }));
  return out;
}
function unconfirmedPrices(){ return (S.prices||[]).filter(p=>priceStatus(p)!=='confirmed'); }
/* products on an order with no price-master row at all */
function newPriceRows(po){
  (po.lines||[]).forEach(l=>{
    if(l.code && !priceRow(l.code)){
      const pr = product(l.code);
      S.prices.push({code:l.code, desc:pr.name||l.code, price:null, packSize:pr.packSize||0, uom:pr.uom||'',
        confirmed:false, confirmedAt:'', effectiveFrom:'', history:[], notes:'Added automatically from '+po.po+'. Enter our price and confirm it.'});
    }
  });
}
/* next twice-weekly customer summary */
function nextSummary(){
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const days=(S.settings.summaryDays||['Mon','Thu']).map(d=>map[d]).filter(d=>d!=null);
  if(!days.length) return null;
  const now=new Date(today()+'T00:00:00');
  for(let i=0;i<8;i++){ const d=new Date(now.getTime()+i*864e5); if(days.includes(d.getDay())) return d.toISOString().slice(0,10); }
  return null;
}

function poStage(p, bs, sh){
  if(p.status==='cancelled') return 'Voided';
  if(p.status==='shipped' || (sh&&sh.status==='shipped')) return 'Shipped';
  if(!bs.length) return 'Awaiting planning';
  if(bs.some(b=>b.status==='in production')) return 'In production';
  if(bs.some(b=>b.status==='on hold')) return 'On hold';
  if(bs.length && bs.every(b=>b.status==='released')) return 'Released — ready to ship';
  if(bs.some(b=>b.status==='planned')) return 'Batch planned';
  return 'In process';
}
function poMaterialStatus(p, bs, stockMap){
  if(!bs.length) return {text:'—', cls:''};
  let short=false;
  bs.forEach(b=> requirement(b).forEach(r=>{
    const s=stockMap.get(r.code)||{released:0};
    if(r.need > s.released) short=true;
  }));
  return short? {text:'Short', cls:'t-bad'} : {text:'Covered', cls:'t-ok'};
}
function poShipStatus(p, sh){
  if(p.status==='shipped') return 'Shipped';
  if(sh) return (sh.container?'Container '+sh.container:sh.id)+' — '+sh.status;
  return 'Not yet scheduled';
}

  const npraDue = (S.products||[]).filter(p=>{const d=daysFromToday(p.npraExp); return d!=null && d<60;});

      d:'Earliest expiry '+npraDue.map(p=>p.npraExp).sort()[0]+'. NPRA requires renewal at least one month before expiry, so the filing window '

      go:['masters','products']});
  }
  (S.equipment||[]).forEach(e=>{
    const dleft = daysFromToday(e.calDue);
    if(e.calDue && dleft!=null && dleft<14) att.push({p: dleft<0?1:3, kind:'Calibration', tone:dleft<0?'bad':'warn',

  });
  (S.training||[]).filter(t=>t.status==='overdue').forEach(t=>
    att.push({p:3, kind:'Training', tone:'warn', t:t.person+' — '+t.topic, d:'Refresher was due '+t.next+'.', go:['people',null]}));
  (S.batches||[]).filter(b=>b.status==='planned' && /BLOCKED/i.test(b.notes||'')).forEach(b=>
    att.push({p:2, kind:'Planned batch blocked', tone:'warn', t:b.id+' — '+product(b.product).name, d:b.notes, go:['production',b.id]}));
  quar.forEach(g=>{ if(daysFromToday(g.date)<-4) att.push({p:4, kind:'Quarantine ageing', tone:'warn', t:g.id+' — '+material(g.code).name, d:'In quarantine since '+g.date+'. '+(g.tests||''), go:['receiving',g.id]}); });
  att.sort((a,b)=>a.p-b.p);

  const attHtml = att.length? '<div class="grid">'+att.slice(0,6).map(a=>

    +btn('Open','go-sel',a.go[0]+'::'+(a.go[1]||''))+'</div>').join('')
    +(att.length>6? '<div style="font-size:12.5px;color:var(--muted);padding-left:2px">'+(att.length-6)+' further item'+(att.length-6>1?'s':'')+' of lower priority — see the deviation, compliance and equipment registers.</div>':'')
    +'</div>'
    : '<div class="banner info">Nothing is blocking. Every lot, batch and clause is where it should be.</div>';

  /* process flow — every department, in order, connected with arrows */
  const flow = [
    {n:'01', l:'Customer PO',   v:(S.pos||[]).filter(p=>p.status!=='shipped'&&p.status!=='cancelled').length, go:'orders'},
    {n:'02', l:'Planning',      v:(S.batches||[]).filter(b=>b.status==='planned').length, go:'planning'},

  const demRows = dem.filter(d=>d.toMake>0);

    {k:'Open deviations', v:nf(openDev.length), d:openDev.filter(d=>d.severity==='major').length+' major', cls:openDev.length?'bad':'ok'},
    {k:'Compliance readiness', v:pct+'%', d:met+' of '+comp.length+' clauses fully met', cls:pct>=90?'ok':pct>=75?'warn':'bad'}

  + sect('Departments', deptCards())

  + sect('Demand not yet covered', T([

/* ============================ 02 PLANNING ============================ */
function V_planning(){
  const dem = openDemand();
  const planned = (S.batches||[]).filter(b=>b.status==='planned'||b.status==='in production');
  const stock = new Map(materialStock().map(m=>[m.code,m]));

  /* availability check across all planned batches */
  const need = new Map();
  planned.forEach(b=> requirement(b).forEach(r=>{
    const cur = need.get(r.code)||{code:r.code, need:0, batches:[]};
    cur.need += r.need; if(!cur.batches.includes(b.id)) cur.batches.push(b.id);
    need.set(r.code, cur);
  }));
  const avail = [...need.values()].map(n=>{
    const s = stock.get(n.code)||{released:0,quarantine:0,uom:'kg'};
    return Object.assign(n,{released:s.released, quarantine:s.quarantine, uom:s.uom, short: Math.max(0, n.need - s.released)});
  }).sort((a,b)=> b.short-a.short || a.code.localeCompare(b.code));
  const shortages = avail.filter(a=>a.short>0);

  return KPI([
    {k:'Batches planned', v:nf((S.batches||[]).filter(b=>b.status==='planned').length), d:'not yet started'},
    {k:'In production', v:nf((S.batches||[]).filter(b=>b.status==='in production').length), d:'on the floor now', cls:'info'},
    {k:'Bulk to compound', v:nf(planned.reduce((s,b)=>s+(b.plannedKg||0),0))+' kg', d:'across planned + running'},
    {k:'Material shortages', v:nf(shortages.length), d:shortages.length?'blocking one or more batches':'all requirements covered', cls:shortages.length?'bad':'ok'}
  ])
  + (shortages.length? '<div class="banner bad"><b>'+shortages.length+' material'+(shortages.length>1?'s':'')+' short against the current plan.</b> '
      +esc(shortages.map(s=>material(s.code).name+' ('+nf(s.short,1)+' '+s.uom+')').join('; '))+'</div>' : '')
  + sect('Open demand → batch plan', T([
      {h:'Product', f:r=>'<b class="mono">'+esc(r.code)+'</b><div class="sub">'+esc(product(r.code).name)+'</div>'},
      {h:'To make', c:'num', f:r=>nf(r.toMake)+' cs<div class="sub">'+nf(r.units)+' pcs</div>'},
      {h:'Bulk needed', c:'num', f:r=>{const p=product(r.code); const f=formula(p.formula)||{density:1};
        const kg = r.units*(p.fill||0)/1000*(f.density||1); return nf(kg,0)+' kg<div class="sub">'+esc(p.formula||'no formula')+'</div>';}},
      {h:'Covered by', f:r=>{const bs=(S.batches||[]).filter(b=>b.product===r.code&&b.status!=='released'); return bs.length? bs.map(b=>'<span class="mono">'+esc(b.id)+'</span> '+tag(b.status)).join('<br>') : '<span class="tag t-warn">not planned</span>';}},
      {h:'Ship by', c:'num', f:r=>'<span class="mono">'+esc(r.earliest||'—')+'</span>'},
      {h:'', f:r=>btn('Create batch','plan-from',r.code)}
    ], dem.filter(d=>d.toMake>0), {empty:'No open demand — every order line is covered.'}))
  + sect('Scheduled batches', T([
      {h:'Batch', f:b=>'<b class="mono">'+esc(b.id)+'</b><div class="sub">'+esc(b.line||'')+'</div>'},
      {h:'Product', f:b=>esc(product(b.product).name)+'<div class="sub mono">'+esc(b.product)+'</div>'},
      {h:'Formula', f:b=>'<span class="mono">'+esc(b.formula)+'</span><div class="sub">v'+esc((formula(b.formula)||{}).version||'')+'</div>'},
      {h:'Planned', c:'num', f:b=>nf(b.plannedKg)+' kg<div class="sub">'+nf(b.plannedUnits)+' pcs</div>'},
      {h:'Start', c:'num', f:b=>'<span class="mono">'+esc(b.plannedStart||'—')+'</span>'},
      {h:'For orders', f:b=>(b.pos||[]).map(p=>'<span class="mono" style="font-size:12px">'+esc((byId('pos',p)||{}).po||p)+'</span>').join(', ')||'—'},
      {h:'Status', f:b=>tag(b.status)},
      {h:'', f:b=>btn('BMR','batch-open',b.id)}
    ], sortBy(planned,'plannedStart'), {empty:'Nothing scheduled.'}),
    btn('New batch','batch-new',null,'btn primary'))
  + sect('Material availability against the plan', T([
      {h:'Material', f:a=>'<b class="mono">'+esc(a.code)+'</b><div class="sub">'+esc(material(a.code).name)+'</div>'},
      {h:'Required', c:'num', f:a=>nf(a.need,2)+' '+esc(a.uom)},
      {h:'Released stock', c:'num', f:a=>nf(a.released,2)},
      {h:'In quarantine', c:'num', f:a=>a.quarantine? '<span style="color:var(--warn)">'+nf(a.quarantine,2)+'</span>':'—'},
      {h:'Short', c:'num', f:a=>a.short? '<b style="color:var(--bad)">'+nf(a.short,2)+'</b>':'<span class="tag t-ok">covered</span>'},
      {h:'For batches', f:a=>'<span class="mono" style="font-size:12px">'+esc(a.batches.join(', '))+'</span>'}
    ], avail, {empty:'No batches planned, so nothing to check.'}))
  + poMaterialRequirementSection();
