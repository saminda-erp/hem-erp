<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>HE Manufacturing — Leave approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  Superior's leave approval page. The employee (or HR) sends this link to the superior by WhatsApp:
  leave-approve.html?t=<36-hex token>. The token is single-application, expires after 21 days, and
  is stored only as a SHA-256 hash in hem_leave_applications. superior_view / superior_decide are the
  only things this page can call. The superior's decision + comment is recorded and the application
  moves to HR for final approval.
-->
<style>
  :root{ --wine:#522B39; --brass:#9C7434; --ink:#231a1c; --ink2:#5c4b51; --paper:#faf8f6; --card:#fff; --line:#e7dfdb; --muted:#8a7b76;
    --ok:#2f6b46; --ok-bg:#e4f0e7; --bad:#a3312c; --bad-bg:#fbe4e2; --warn:#a86a10; --warn-bg:#fbeed9; --soft:#f4eeee; --r:10px; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#f1e9e6; --ink2:#c9bab5; --paper:#171214; --card:#211a1d; --line:#3a2f33; --muted:#9a8b86;
    --ok:#8fcfa4; --ok-bg:#1d3325; --bad:#f1a19b; --bad-bg:#3a1e1c; --warn:#e8b765; --warn-bg:#3a2c15; --soft:#2d2226; } }
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.5 'Archivo',system-ui,sans-serif}
  .top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#522B39;color:#f7f0ee}
  .crest{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:2px;overflow:hidden}
  .crest img{width:100%;height:100%;object-fit:contain;display:block}
  .top b{font-family:'Fraunces',serif;font-weight:600} .top small{display:block;font-size:11.5px;opacity:.75}
  .lang{margin-left:auto;display:flex;border:1px solid rgba(255,255,255,.3);border-radius:20px;overflow:hidden}
  .lang button{background:transparent;color:#f7f0ee;border:0;padding:6px 10px;font:600 12px 'Archivo',sans-serif;cursor:pointer}
  .lang button.on{background:#f7f0ee;color:#522B39}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 50px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  h1{font:600 20px 'Fraunces',serif;margin:0 0 4px} .muted{color:var(--muted);font-size:13px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:12px 0 0;font-size:14.5px} dt{color:var(--muted)} dd{margin:0;font-weight:500}
  .bal{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:12px}
  textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);font:16px 'Archivo',sans-serif;background:var(--card);color:var(--ink);margin:6px 0 12px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.big{border:0;border-radius:var(--r);padding:15px 10px;font:700 16px 'Archivo',sans-serif;cursor:pointer}
  .yes{background:#2f6b46;color:#fff} .no{background:#a3312c;color:#fff} button:disabled{opacity:.5}
  .msg{border-radius:var(--r);padding:11px 13px;font-size:14px;margin-bottom:12px}
  .msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.err{background:var(--bad-bg);color:var(--bad)} .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:700} .tag.unpaid{background:var(--line);color:var(--ink2)}
  .done{text-align:center;padding:26px 10px}
  .btn-wa{display:block;text-align:center;background:#25D366;color:#fff;border-radius:var(--r);padding:14px 16px;font-weight:700;text-decoration:none;margin-top:10px}
  .btn-wa.sec{background:transparent;color:var(--ink);border:1px solid var(--line)} .done .ic{font-size:44px}
  .signin{border-top:1px solid var(--line);padding-top:12px;margin:2px 0 14px}
  .signin label{display:block;font-size:13px;color:var(--ink2);margin:8px 0 4px;font-weight:600}
  .signin input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);font:16px 'Archivo',sans-serif;background:var(--card);color:var(--ink)}
  .who{font-size:13.5px;margin-top:5px;min-height:1px} .who.ok{color:var(--ok);font-weight:600} .who.bad{color:var(--bad)}
  [hidden]{display:none!important}
</style>
<link rel="icon" type="image/png" href="hem-seal-160.png">
<link rel="apple-touch-icon" href="hem-seal-160.png">
</head>
<body>
<div class="top"><div class="crest"><img src="hem-seal-160.png" alt="HE Manufacturing"></div><div><b>HE Manufacturing</b><small id="sub"></small></div>
  <div class="lang"><button type="button" data-lang="en" class="on">EN</button><button type="button" data-lang="ms">BM</button></div></div>
<div class="wrap">
  <div id="msg"></div>
  <div class="card" id="loading"><span class="muted" data-t="loading"></span></div>
  <div id="main" hidden>
    <div class="card">
      <h1 data-t="title"></h1>
      <div class="muted" id="forWho"></div>
      <dl id="details"></dl>
      <div class="bal" id="bal"></div>
    </div>
    <div class="card" id="decideCard">
      <b data-t="yourDecision"></b>
      <textarea id="comment" rows="3" maxlength="500"></textarea>
      <div class="signin">
        <b data-t="signTitle"></b>
        <div class="muted" data-t="signNote" style="margin-bottom:8px"></div>
        <label for="hodEmp" data-t="yourId"></label>
        <input id="hodEmp" autocomplete="username" autocapitalize="characters" inputmode="text" maxlength="20">
        <div class="who" id="hodWho"></div>
        <label for="hodPw" data-t="yourPw"></label>
        <input id="hodPw" type="password" autocomplete="current-password" maxlength="64">
      </div>
      <div class="btns">
        <button type="button" class="big yes" id="yesBtn" data-t="approve"></button>
        <button type="button" class="big no" id="noBtn" data-t="reject"></button>
      </div>
      <div class="muted" style="margin-top:10px" data-t="afterNote"></div>
    </div>
    <div class="card done" id="doneCard" hidden><div class="ic" id="doneIc"></div><h1 id="doneTitle"></h1><div class="muted" id="doneBody"></div>
      <div id="informBox" style="margin-top:16px;text-align:left"></div></div>
  </div>
</div>
<script>
const sb = window.supabase && window.supabase.createClient('https://znxtvkpnwzrzevljdsgx.supabase.co','sb_publishable_3Q-qF58hDO6Q5Tr8Wr8X4A_WTBVR8z5',{auth:{persistSession:false}});
const TOKEN = (new URLSearchParams(location.search).get('t')||'').toLowerCase();
const TX={
  sub:{en:'Leave approval', ms:'Kelulusan cuti'}, loading:{en:'Loading the application…', ms:'Memuatkan permohonan…'},
  title:{en:'Leave application', ms:'Permohonan cuti'}, forYou:{en:'For your approval as Head of Department{n}', ms:'Untuk kelulusan anda sebagai Ketua Jabatan{n}'},
  emp:{en:'Employee', ms:'Pekerja'}, dept:{en:'Department', ms:'Jabatan'}, type:{en:'Leave type', ms:'Jenis cuti'}, dates:{en:'Dates', ms:'Tarikh'},
  days:{en:'Days', ms:'Hari'}, reason:{en:'Reason', ms:'Sebab'}, relief:{en:'Relief / cover', ms:'Pengganti'}, handover:{en:'Handover', ms:'Serahan tugas'},
  docs:{en:'Documents', ms:'Dokumen'}, applied:{en:'Applied', ms:'Dimohon'}, unpaid:{en:'UNPAID', ms:'TANPA GAJI'},
  bal:{en:'{type} this year: {taken} day(s) already taken{ent}.', ms:'{type} tahun ini: {taken} hari telah diambil{ent}.'}, of:{en:' of {n}', ms:' daripada {n}'},
  yourDecision:{en:'Your decision — comment (required if not approving)', ms:'Keputusan anda — ulasan (wajib jika tidak diluluskan)'},
  approve:{en:'✓ Approve', ms:'✓ Lulus'}, reject:{en:'✗ Not approve', ms:'✗ Tidak lulus'},
  afterNote:{en:'Your decision goes to HR, who gives the final approval and informs the employee.', ms:'Keputusan anda dihantar kepada HR, yang akan memberi kelulusan akhir dan memaklumkan pekerja.'},
  needComment:{en:'Please write a short reason for not approving.', ms:'Sila tulis sebab ringkas tidak meluluskan.'},
  sending:{en:'Sending…', ms:'Menghantar…'},
  doneYes:{en:'You approved this leave', ms:'Anda telah meluluskan cuti ini'}, doneNo:{en:'You did not approve this leave', ms:'Anda tidak meluluskan cuti ini'},
  doneBody:{en:'Your decision is saved in the system. Now tap below to inform HR on WhatsApp.', ms:'Keputusan anda disimpan dalam sistem. Sekarang tekan di bawah untuk memaklumkan HR melalui WhatsApp.'},
  doneBodyNoHr:{en:'Your decision is saved and HR can see it in the system. You can close this page.', ms:'Keputusan anda disimpan dan HR boleh melihatnya dalam sistem. Anda boleh menutup halaman ini.'},
  informHr:{en:'Inform HR on WhatsApp', ms:'Maklumkan HR melalui WhatsApp'}, informEmp:{en:'Tell {n} too', ms:'Beritahu {n} juga'},
  hrSent:{en:'Thank you — you can close this page.', ms:'Terima kasih — anda boleh menutup halaman ini.'},
  already:{en:'You already responded: {d}. {c}', ms:'Anda telah memberi maklum balas: {d}. {c}'},
  closed:{en:'This application has already been {s} by HR — no action needed.', ms:'Permohonan ini telah {s} oleh HR — tiada tindakan diperlukan.'},
  invalid:{en:'This approval link is not valid or has expired. Ask the employee or HR to send a new one.', ms:'Pautan kelulusan ini tidak sah atau telah tamat tempoh. Minta pekerja atau HR menghantar pautan baharu.'},
  offline:{en:'Could not connect — check your internet and try again.', ms:'Tidak dapat disambungkan — semak internet anda dan cuba lagi.'},
  signTitle:{en:'Sign in to confirm it is you', ms:'Log masuk untuk mengesahkan ini anda'},
  signNote:{en:'Use your own Employee ID and leave-portal password. The employee cannot approve their own leave.', ms:'Gunakan ID Pekerja dan kata laluan portal cuti anda sendiri. Pekerja tidak boleh meluluskan cuti sendiri.'},
  yourId:{en:'Your Employee ID (HOD)', ms:'ID Pekerja anda (Ketua Jabatan)'}, yourPw:{en:'Your password', ms:'Kata laluan anda'},
  whoNotFound:{en:'Employee ID not found', ms:'ID Pekerja tidak dijumpai'}, whoNotReg:{en:'{n} — not registered on the leave portal yet', ms:'{n} — belum mendaftar di portal cuti'},
  needSign:{en:'Enter your Employee ID and password to approve.', ms:'Masukkan ID Pekerja dan kata laluan anda untuk meluluskan.'},
  eAuth:{en:'Wrong Employee ID or password. Not registered yet? Register at the leave portal first: {u}', ms:'ID Pekerja atau kata laluan salah. Belum daftar? Daftar di portal cuti dahulu: {u}'},
  eLocked:{en:'Too many wrong attempts — try again in 15 minutes.', ms:'Terlalu banyak cubaan salah — cuba lagi selepas 15 minit.'},
  eSelf:{en:'You cannot approve your own leave application.', ms:'Anda tidak boleh meluluskan permohonan cuti anda sendiri.'},
  eNotHod:{en:'Only the Head of Department this was sent to{n} can decide. Your registered WhatsApp number must match the number the employee entered — ask HR if it is wrong.', ms:'Hanya Ketua Jabatan yang dihantar{n} boleh membuat keputusan. Nombor WhatsApp berdaftar anda mesti sama dengan nombor yang dimasukkan pekerja — hubungi HR jika salah.'},
  signedAs:{en:'Signed by {n}', ms:'Ditandatangani oleh {n}'},
  approvedW:{en:'approved', ms:'diluluskan'}, rejectedW:{en:'not approved', ms:'tidak diluluskan'}, halfW:{en:'half day', ms:'separuh hari'}
};
let LANG='en', A=null;
try{ const l=localStorage.getItem('hem_leave_lang'); if(l==='ms') LANG='ms'; }catch(e){}
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(k,v){ let s=(TX[k]||{})[LANG]||(TX[k]||{}).en||k; if(v) Object.keys(v).forEach(x=>{ s=s.split('{'+x+'}').join(v[x]); }); return s; }
const fd=s=>s? new Date(s+'T00:00:00Z').toLocaleDateString(LANG==='ms'?'ms-MY':'en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}) : '';
function msg(kind,text){ $('msg').innerHTML=text?'<div class="msg '+kind+'">'+esc(text)+'</div>':''; }
function render(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  $('sub').textContent=t('sub'); $('comment').placeholder=LANG==='ms'?'cth. Diluluskan — Aye akan menggantikan':'e.g. Approved — Aye will cover';
  if(!A) return;
  const e=A.employee||{};
  $('forWho').textContent=t('forYou',{n:A.superior_name?' ('+A.superior_name+')':''});
  const row=(k,v)=>v? '<dt>'+esc(t(k))+'</dt><dd>'+v+'</dd>' : '';
  $('details').innerHTML=row('emp','<b>'+esc(e.name)+'</b> <span class="muted">'+esc(e.emp_no)+(e.position?' · '+esc(e.position):'')+'</span>')
    +row('dept',esc(e.department||''))
    +row('type',esc(A.type)+(A.paid===false?' <span class="tag unpaid">'+esc(t('unpaid'))+'</span>':''))
    +row('dates',esc(fd(A.start_date))+(A.end_date!==A.start_date?' → '+esc(fd(A.end_date)):'')+(A.half?' ('+esc(A.half)+' '+esc(t('halfW'))+')':''))
    +row('days','<b>'+esc(A.days)+'</b>')+row('reason',esc(A.reason))+row('relief',esc(A.relief||''))+row('handover',esc(A.handover||''))
    +row('docs', A.docs? esc(A.docs):'')+row('applied',esc(String(A.applied_at||'').slice(0,10)));
  $('bal').textContent=t('bal',{type:A.type, taken:A.taken, ent:Number(A.entitlement)>0? t('of',{n:A.entitlement}) : ''});
  if(A.status!=='pending'){ $('decideCard').hidden=true; msg('warn', t('closed',{s:t(A.status==='approved'?'approvedW':'rejectedW')})); }
  else if(A.decision){ msg('ok', t('already',{d:t(A.decision==='approved'?'approvedW':'rejectedW'), c:A.comment? '“'+A.comment+'”':''}));
    $('decideCard').hidden=true; $('doneCard').hidden=false; $('doneIc').textContent=A.decision==='approved'?'✅':'❌';
    $('doneTitle').textContent=t(A.decision==='approved'?'doneYes':'doneNo'); renderInform(); }
}
async function load(){
  if(!sb || !/^[0-9a-f]{36}$/.test(TOKEN)){ $('loading').hidden=true; msg('err',t('invalid')); return; }
  try{
    const {data,error}=await sb.rpc('superior_view',{p_token:TOKEN});
    $('loading').hidden=true;
    if(error) throw error;
    if(!data||!data.ok){ msg('err',t('invalid')); return; }
    A=data; $('main').hidden=false; render();
  }catch(e){ console.error(e); $('loading').hidden=true; msg('err',t('offline')); }
}
async function decide(decision){
  const c=$('comment').value.trim();
  if(decision==='rejected' && c.length<3){ msg('err',t('needComment')); $('comment').focus(); return; }
  const me=$('hodEmp').value.trim(), pw=$('hodPw').value;
  if(!me || !pw){ msg('err',t('needSign')); (me?$('hodPw'):$('hodEmp')).focus(); return; }
  $('yesBtn').disabled=$('noBtn').disabled=true;
  try{
    const {data,error}=await sb.rpc('superior_decide',{p_token:TOKEN, p_emp_no:me, p_password:pw, p_decision:decision, p_comment:c});
    if(error) throw error;
    if(!data||!data.ok){
      const code=data&&data.code;
      const portal=new URL('leave-portal.html',location.href).href;
      const m= code==='closed'? t('closed',{s:t(data.status==='approved'?'approvedW':'rejectedW')})
        : code==='comment_needed'? t('needComment')
        : code==='auth'? t('eAuth',{u:portal})
        : code==='locked'? t('eLocked')
        : code==='self'? t('eSelf')
        : code==='not_hod'? t('eNotHod',{n:data.sent_to?' ('+data.sent_to+')':''})
        : t('invalid');
      if(code==='auth'){ $('hodPw').value=''; $('hodPw').focus(); }
      msg('err',m); window.scrollTo({top:0,behavior:'smooth'}); return; }
    $('hodPw').value='';
    A.superior_name=data.name||A.superior_name;
    msg('ok',t('signedAs',{n:data.name||me})); $('decideCard').hidden=true; $('doneCard').hidden=false;
    $('doneIc').textContent=decision==='approved'?'✅':'❌';
    $('doneTitle').textContent=t(decision==='approved'?'doneYes':'doneNo');
    A.decision=decision; A.comment=c; renderInform();
  }catch(e){ console.error(e); msg('err',t('offline')); }
  finally{ $('yesBtn').disabled=$('noBtn').disabled=false; }
}
/* after deciding: one tap sends the result to HR (number set by HR in the ERP), optionally to the employee */
function waHref(phone, text){ const n=String(phone||'').replace(/\D/g,''); return n? 'https://wa.me/'+n+'?text='+encodeURIComponent(text) : ''; }
function renderInform(){
  if(!A || !A.decision) return;
  const e=A.employee||{}, ok=A.decision==='approved';
  const d=fd(A.start_date)+(A.end_date!==A.start_date?' – '+fd(A.end_date):'')+(A.half?' ('+A.half+')':'');
  const line='👤 Employee: *'+e.name+'*\nEmp No: '+e.emp_no+(e.department?' · '+e.department:'')+(e.position?' · '+e.position:'')
    +'\n📅 '+A.type+': '+d+' · '+A.days+' day(s)\n📝 Reason: '+A.reason;
  const toHr='HE Manufacturing — Leave '+(ok?'APPROVED ✅':'NOT APPROVED ❌')+' by HOD '+(A.superior_name||'')+'\n'+line
    +(A.comment?'\nHOD comment: '+A.comment:'')+'\nRef: '+A.id+'\n\n'+(ok?'Please give final approval in the ERP (HR → Leave).':'For your records.');
  const toEmp='HE Manufacturing — your leave was '+(ok?'APPROVED by your HOD ✅ — HR will give final approval.':'NOT APPROVED by your HOD ❌')+'\n'+A.type+': '+d
    +(A.comment?'\nComment: '+A.comment:'')+'\n\nCuti anda '+(ok?'telah diluluskan oleh Ketua Jabatan. Menunggu kelulusan akhir HR.':'tidak diluluskan oleh Ketua Jabatan.');
  const hr=waHref(A.hr_phone, toHr), em=waHref(e.phone, toEmp);
  $('doneBody').textContent=t(hr?'doneBody':'doneBodyNoHr');
  $('informBox').innerHTML=(hr?'<a class="btn-wa" id="hrWa" href="'+esc(hr)+'" target="_blank" rel="noopener">'+esc(t('informHr'))+(A.hr_name?' ('+esc(A.hr_name)+')':'')+'</a>':'')
    +(em?'<a class="btn-wa sec" href="'+esc(em)+'" target="_blank" rel="noopener">'+esc(t('informEmp',{n:e.name}))+'</a>':'');
}
/* show the HOD's name as they type their Employee ID */
let WHO_T=null;
$('hodEmp').addEventListener('input',()=>{
  const v=$('hodEmp').value.trim(), box=$('hodWho'); clearTimeout(WHO_T);
  if(v.length<3||!sb){ box.textContent=''; box.className='who'; return; }
  WHO_T=setTimeout(async()=>{
    try{ const {data}=await sb.rpc('portal_whois',{p_emp_no:v});
      if($('hodEmp').value.trim()!==v) return;
      if(!data||!data.ok){ box.className='who bad'; box.textContent=t('whoNotFound'); return; }
      if(!data.registered){ box.className='who bad'; box.textContent=t('whoNotReg',{n:data.name}); return; }
      box.className='who ok'; box.textContent='✓ '+data.name;
    }catch(e){ box.textContent=''; }
  },350);
});
$('hodPw').addEventListener('keydown',e=>{ if(e.key==='Enter') e.preventDefault(); });
$('yesBtn').addEventListener('click',()=>decide('approved'));
$('noBtn').addEventListener('click',()=>decide('rejected'));
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.lang; try{localStorage.setItem('hem_leave_lang',LANG);}catch(e){} render(); }));
render(); load();
</script>
</body>
</html>
